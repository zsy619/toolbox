            { id: 'mode', name: '运行模式', icon: 'layers' },

            { id: 'rpc', name: 'RPC 协议', icon: 'swap' },
            { id: 'tools', name: '工具与上下文', icon: 'sliders' },
        ];

        const COMMANDS = [
            /* ── 安装与更新 ───────────────────────── */
            {
                cat: 'install', title: '全局安装 Pi CLI', tag: '必装',
                code: 'npm install -g --ignore-scripts @earendil-works/pi-coding-agent',
                desc: '--ignore-scripts 禁用依赖的生命周期脚本，Pi 正常安装并不需要它们，可降低供应链风险。'
            },

            {
                cat: 'install', title: '脚本安装（备用方案）', tag: '备选',
                code: 'curl -fsSL https://pi.dev/install.sh | sh',
                desc: '不依赖 npm 的安装方式，适合 Node 环境受限的机器。'
            },

            {
                cat: 'install', title: '查看当前版本', tag: '',
                code: 'pi --version',
                desc: '输出版本号，排查问题时应首先确认。'
            },

            {
                cat: 'install', title: '更新 Pi 本体', tag: '维护',
                code: 'pi update --self',
                desc: '拉取并安装最新版 Pi CLI，不影响已有会话与配置。'
            },

            {
                cat: 'install', title: '更新内置模型目录', tag: '维护',
                code: 'pi update --models',
                desc: '同步最新的模型列表与元数据，新模型上线后无需升级本体即可使用。'
            },

            /* ── 运行模式 ─────────────────────────── */
            {
                cat: 'mode', title: '交互模式（默认）', tag: 'TUI',
                code: 'pi',
                desc: '在双 TTY 终端中直接运行，进入 TUI 编辑器，持续到用户退出。'
            },

            {
                cat: 'mode', title: '带初始提示词启动', tag: 'TUI',
                code: 'pi "列出 src/ 下所有 TypeScript 文件"',
                desc: '进入交互模式的同时发送首条提示词，省去一次输入。'
            },

            {
                cat: 'mode', title: 'Print 模式（一次性输出）', tag: '脚本',
                code: 'pi -p "总结这个仓库的变更"',
                desc: '执行完成后把最后一条助手文本写入 stdout 并退出。适合放进脚本与 CI。'
            },

            {

        function svgIcon(name, cls) {
            return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
                + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
                + (ICONS[name] || '') + '</svg>';
        }

        function esc(str) {
            return String(str).replace(/[&<>"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        /* ═══════════════════════════════════════════════

        const contentEl = document.getElementById('content');

        function cardHTML(item, index) {
            var searchKey = (item.title + ' ' + item.code + ' ' + item.desc + ' ' + (item.tag || '')).toLowerCase();
            var tagHTML = item.tag
                ? '<span class="shrink-0 rounded-md bg-indigo-50 px-1.5 py-0.5 text-[10.5px] font-medium text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300">' + esc(item.tag) + '</span>'
                : '';

            return ''
                + '<article data-card data-search="' + esc(searchKey) + '"'
                + ' class="anim-up group flex flex-col rounded-xl border border-slate-200 bg-white p-3.5 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-indigo-300 hover:shadow-lg hover:shadow-indigo-500/5 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-indigo-500/50 sm:p-4"'
                + ' style="animation-delay:' + Math.min(index * 18, 300) + 'ms">'

                + '<div class="mb-2.5 flex items-start justify-between gap-2">'
                + '<h3 class="text-[13.5px] font-semibold leading-6 text-slate-900 dark:text-slate-100">' + esc(item.title) + '</h3>'
                + tagHTML
                + '</div>'

                + '<div class="relative">'
                + '<pre class="overflow-x-auto rounded-lg bg-slate-900 px-3 py-2.5 pr-14 text-[12.5px] leading-5 text-slate-100 dark:bg-slate-950 dark:ring-1 dark:ring-slate-800">'
                + '<code class="font-mono">' + esc(item.code) + '</code>'
                + '</pre>'
                + '<button type="button" class="copy-btn absolute right-1.5 top-1.5 rounded-md bg-white/10 px-1.5 py-1 text-[10.5px] font-medium text-slate-300 backdrop-blur transition hover:bg-white/20 hover:text-white active:scale-95" aria-label="复制命令">复制</button>'
                + '</div>'

                + '<p class="mt-3 text-[12.5px] leading-6 text-slate-600 dark:text-slate-400">' + esc(item.desc) + '</p>'
                + '</article>';
        }

        function renderAll() {
            var html = '';
            var cardIndex = 0;

            CATEGORIES.forEach(function (cat) {
                var items = COMMANDS.filter(function (c) { return c.cat === cat.id; });
                if (!items.length) return;

                html += ''
                    + '<section id="cat-' + cat.id + '" data-section class="scroll-mt-32">'

                    + '<div class="mb-4 flex items-center gap-2.5 sm:mb-5 sm:gap-3">'
                    + '<span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400">'
                    + svgIcon(cat.icon, 'h-[17px] w-[17px]')
                    + '</span>'
                    + '<h2 class="text-base font-semibold tracking-tight sm:text-lg">' + esc(cat.name) + '</h2>'
                    + '<span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-500 dark:bg-slate-800 dark:text-slate-400">' + items.length + '</span>'
                    + '</div>'

                    + '<div class="grid gap-3 sm:grid-cols-2 sm:gap-4 xl:grid-cols-3">'
                    + items.map(function (it) { return cardHTML(it, cardIndex++); }).join('')
                    + '</div>'

                    + '</section>';
            });

            contentEl.innerHTML = html;

            document.getElementById('stat-cmds').textContent = COMMANDS.length;
            document.getElementById('stat-cats').textContent = CATEGORIES.length;
        }

        /* ═══════════════════════════════════════════════
           4. 分类标签栏
           ═══════════════════════════════════════════════ */

        const tabsEl = document.getElementById('tabs');

        function renderTabs() {
            tabsEl.innerHTML = CATEGORIES.map(function (c) {
                return '<button type="button" data-jump="' + c.id + '" class="tab shrink-0 whitespace-nowrap rounded-lg px-3 py-1.5 text-[13px] font-medium text-slate-600 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800">'
                    + esc(c.name) + '</button>';
            }).join('');
        }

        function setActiveTab(id) {
            document.querySelectorAll('.tab').forEach(function (t) {
                var on = t.dataset.jump === id;
                t.className = 'tab shrink-0 whitespace-nowrap rounded-lg px-3 py-1.5 text-[13px] font-medium transition '
                    + (on
                        ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-300'
                        : 'text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800');
            });
        }

        tabsEl.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-jump]');
            if (!btn) return;
            var target = document.getElementById('cat-' + btn.dataset.jump);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setActiveTab(btn.dataset.jump);
        });

        /* ═══════════════════════════════════════════════
           5. 搜索过滤
           ═══════════════════════════════════════════════ */

        var searchEl = document.getElementById('search');
        var emptyEl = document.getElementById('empty');
        var countEl = document.getElementById('resultCount');

        function applyFilter() {
            var q = searchEl.value.trim().toLowerCase();
            var visible = 0;

            document.querySelectorAll('[data-card]').forEach(function (card) {
                var match = !q || card.dataset.search.indexOf(q) !== -1;
                card.classList.toggle('hidden', !match);
                if (match) visible++;
            });

            document.querySelectorAll('[data-section]').forEach(function (sec) {
                var any = sec.querySelector('[data-card]:not(.hidden)');
                sec.classList.toggle('hidden', !any);
            });

            emptyEl.classList.toggle('hidden', visible > 0);

            if (q) {
                countEl.textContent = '找到 ' + visible + ' 条匹配「' + searchEl.value.trim() + '」的命令';
                countEl.classList.remove('hidden');
            } else {
                countEl.classList.add('hidden');
            }
        }

        searchEl.addEventListener('input', applyFilter);
        searchEl.addEventListener('search', applyFilter);

        /* ═══════════════════════════════════════════════
           6. 复制命令
           ═══════════════════════════════════════════════ */

        contentEl.addEventListener('click', function (e) {
            var btn = e.target.closest('.copy-btn');
            if (!btn) return;

            var codeEl = btn.parentElement.querySelector('code');
            if (!codeEl) return;

            var text = codeEl.textContent;
            var original = btn.textContent;

            function done() {
                btn.textContent = '已复制';
                btn.classList.add('!text-emerald-400');
                setTimeout(function () {
                    btn.textContent = original;
                    btn.classList.remove('!text-emerald-400');
                }, 1400);
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
            } else {
                fallbackCopy(text, done);
            }
        });

        function fallbackCopy(text, cb) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); cb(); } catch (err) { }
            document.body.removeChild(ta);
        }

        /* ═══════════════════════════════════════════════
           7. 主题切换
           ═══════════════════════════════════════════════ */

        var themeBtn = document.getElementById('theme-toggle');
        var iconSun = document.getElementById('icon-sun');
        var iconMoon = document.getElementById('icon-moon');

        function syncThemeIcon() {
            var dark = document.documentElement.classList.contains('dark');
            iconSun.classList.toggle('hidden', !dark);
            iconMoon.classList.toggle('hidden', dark);
        }

        themeBtn.addEventListener('click', function () {
            var dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('pi-theme', dark ? 'dark' : 'light'); } catch (e) { }
            syncThemeIcon();
        });

        /* ═══════════════════════════════════════════════
           8. 滚动监听 + 回到顶部
           ═══════════════════════════════════════════════ */

        var toTopBtn = document.getElementById('to-top');

        window.addEventListener('scroll', function () {
            var show = window.scrollY > 600;
            toTopBtn.classList.toggle('opacity-0', !show);
            toTopBtn.classList.toggle('translate-y-3', !show);
            toTopBtn.classList.toggle('pointer-events-none', !show);
        }, { passive: true });

        toTopBtn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        /* ═══════════════════════════════════════════════
           9. 初始化
           ═══════════════════════════════════════════════ */

        renderTabs();
        renderAll();
        syncThemeIcon();
        setActiveTab(CATEGORIES[0].id);

        /* 滚动时高亮当前分类 */
        var spy = new IntersectionObserver(function (entries) {
            var visible = entries
                .filter(function (en) { return en.isIntersecting; })
                .sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top; });

            if (visible.length) {
                setActiveTab(visible[0].target.id.replace('cat-', ''));
            }
        }, { rootMargin: '-120px 0px -62% 0px', threshold: 0 });

        document.querySelectorAll('[data-section]').forEach(function (s) { spy.observe(s); });
    </script>
</body>

</html>
