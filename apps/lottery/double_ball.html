  <script>
    // 初始化多彩主题
    initColorTheme('doubleBallTheme');

    // 历史记录 localStorage key
    var HISTORY_KEY = 'doubleBallHistory';
    var historyData = [];
    try {
      historyData = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    } catch (e) {
      historyData = [];
    }

    /**
     * 生成一组双色球号码
     * 红球:33 选 6(不重复,升序)
     * 蓝球:16 选 1
     */
    function generateBallSet() {
      var redBalls = [];
      while (redBalls.length < 6) {
        var num = Math.floor(Math.random() * 33) + 1;
        num = num < 10 ? '0' + num : num.toString();
        if (redBalls.indexOf(num) === -1) {
          redBalls.push(num);
        }
      }
      redBalls.sort(function (a, b) { return a - b; });

      var blueBall = Math.floor(Math.random() * 16) + 1;
      blueBall = blueBall < 10 ? '0' + blueBall : blueBall.toString();

      return {
        redBalls: redBalls,
        blueBall: blueBall,
        time: new Date().toISOString()
      };
    }

    /**
     * 检查号码组合是否已存在(完全匹配)
     */
    function isDuplicateNumbers(newBalls) {
      return historyData.some(function (existing) {
        var redMatch = newBalls.redBalls.length === existing.redBalls.length &&
          newBalls.redBalls.every(function (ball, i) {
            return ball === existing.redBalls[i];
          });
        return redMatch && newBalls.blueBall === existing.blueBall;
      });
    }

    /**
     * 复制文本到剪贴板
     */
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showToast('已复制到剪贴板', 'success');
        }, function () {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('已复制到剪贴板', 'success');
      } catch (e) {
        showToast('复制失败,请手动复制', 'error');
      }
      document.body.removeChild(ta);
    }

    /**
     * 简单 toast 提示(替代 layui layer)
     */
    function showToast(msg, type) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:' +
        (type === 'error' ? '#e74c3c' : '#00b894') +
        ';color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:fadeIn .2s';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 1500);
    }

    /**
     * 渲染批量生成结果
     */
    function renderBatchResults(results) {
      var html = '';
      results.forEach(function (item, index) {
        var numbers = item.redBalls.join(' ') + ' + ' + item.blueBall;
        var isCollected = isDuplicateNumbers(item);
        var saveBtnClass = isCollected ? 'btn btn-sm btn-collected' : 'btn btn-sm btn-collect';
        var saveBtnHtml = isCollected
          ? '<button type="button" class="' + saveBtnClass + '" disabled><i class="fas fa-check" aria-hidden="true"></i> 已收藏</button>'
          : '<button type="button" class="' + saveBtnClass + '" data-index="' + index + '" aria-label="收藏第' + (index + 1) + '组号码"><i class="fas fa-star" aria-hidden="true"></i> 收藏</button>';

        var ballsHtml = '';
        item.redBalls.forEach(function (b) {
          ballsHtml += '<span class="ball ball-red">' + b + '</span>';
        });
        ballsHtml += '<span class="ball-sep">+</span>';
        ballsHtml += '<span class="ball ball-blue">' + item.blueBall + '</span>';

        html += '<div class="result-card">' +
          '<div class="balls" aria-label="双色球号码">' + ballsHtml + '</div>' +
          '<div class="card-actions">' +
            saveBtnHtml +
            '<button type="button" class="btn btn-sm btn-success" data-copy="' + numbers + '" aria-label="复制号码' + numbers + '"><i class="fas fa-copy" aria-hidden="true"></i> 复制</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('batchResults').innerHTML = html;

      // 绑定收藏/复制事件(事件委托)
      document.getElementById('batchResults').querySelectorAll('.btn-collect').forEach(function (btn) {
        btn.addEventListener('click', function () {
          saveSingleSet(parseInt(this.dataset.index, 10));
        });
      });
      document.getElementById('batchResults').querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          copyToClipboard(this.dataset.copy);
        });
      });
    }

    /**
     * 渲染历史记录
     */
    function renderHistory() {
      var html = '';
      historyData.forEach(function (item, index) {
        var date = new Date(item.time);
        var timeStr = date.getFullYear() + '/' +
          String(date.getMonth() + 1).padStart(2, '0') + '/' +
          String(date.getDate()).padStart(2, '0') + ' ' +
          String(date.getHours()).padStart(2, '0') + ':' +
          String(date.getMinutes()).padStart(2, '0');
        var numbers = item.redBalls.join(' ') + ' + ' + item.blueBall;

        var ballsHtml = '';
        item.redBalls.forEach(function (b) {
          ballsHtml += '<span class="ball ball-red">' + b + '</span>';
        });
        ballsHtml += '<span class="ball-sep">+</span>';
        ballsHtml += '<span class="ball ball-blue">' + item.blueBall + '</span>';

        html += '<div class="history-item">' +
          '<div class="balls">' + ballsHtml + '</div>' +
          '<div class="history-time">' + timeStr + '</div>' +
          '<div class="card-actions">' +
            '<button type="button" class="btn btn-sm btn-success" data-copy="' + numbers + '" aria-label="复制历史号码"><i class="fas fa-copy" aria-hidden="true"></i> 复制</button>' +
            '<button type="button" class="btn btn-sm btn-warning" data-delete="' + index + '" aria-label="删除该历史记录"><i class="fas fa-trash" aria-hidden="true"></i> 删除</button>' +
          '</div>' +
        '</div>';
      });

      document.getElementById('historyList').innerHTML = html ||
        '<p class="history-empty">暂无历史记录</p>';

      // 绑定删除/复制事件
      document.getElementById('historyList').querySelectorAll('[data-delete]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          deleteHistory(parseInt(this.dataset.delete, 10));
        });
      });
      document.getElementById('historyList').querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          copyToClipboard(this.dataset.copy);
        });
      });
    }

    /**
     * 删除历史记录
     */
    function deleteHistory(index) {
      historyData.splice(index, 1);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
      renderHistory();
      updateAllCollectButtons();
      showToast('删除成功', 'success');
    }

    /**
     * 收藏单组号码
     */
    function saveSingleSet(index) {
      var batchCards = document.querySelectorAll('#batchResults .result-card');
      if (index < 0 || index >= batchCards.length) return;

      var card = batchCards[index];
      var redBalls = Array.from(card.querySelectorAll('.ball-red')).map(function (el) {
        return el.textContent;
      });
      var blueBall = card.querySelector('.ball-blue').textContent;

      var item = {
        redBalls: redBalls,
        blueBall: blueBall,
        time: new Date().toISOString()
      };

      if (isDuplicateNumbers(item)) {
        showToast('该号码组合已收藏过了', 'error');
        return;
      }

      historyData.unshift(item);
      // 最多保留 50 条
      if (historyData.length > 50) {
        historyData = historyData.slice(0, 50);
      }
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
      renderHistory();
      updateAllCollectButtons();
      showToast('收藏成功', 'success');
    }

    /**
     * 更新所有批量结果中的收藏按钮状态
     */
    function updateAllCollectButtons() {
      document.querySelectorAll('#batchResults .result-card').forEach(function (card, idx) {
        var redBalls = Array.from(card.querySelectorAll('.ball-red')).map(function (el) {
          return el.textContent;
        });
        var blueBall = card.querySelector('.ball-blue').textContent;
        var item = { redBalls: redBalls, blueBall: blueBall };

        var isCollected = isDuplicateNumbers(item);
        var btn = card.querySelector('.btn-collect, .btn-collected');
        if (!btn) return;

        if (isCollected) {
          btn.className = 'btn btn-sm btn-collected';
          btn.innerHTML = '<i class="fas fa-check"></i> 已收藏';
          btn.disabled = true;
          btn.removeAttribute('data-index');
        } else {
          btn.className = 'btn btn-sm btn-collect';
          btn.innerHTML = '<i class="fas fa-star"></i> 收藏';
          btn.disabled = false;
          btn.setAttribute('data-index', idx);
          btn.onclick = function () { saveSingleSet(idx); };
        }
      });
    }

    // 绑定生成按钮
    document.getElementById('generateBtn').addEventListener('click', function () {
      var results = [];
      for (var i = 0; i < 5; i++) {
        results.push(generateBallSet());
      }
      renderBatchResults(results);
      showToast('已生成 5 组号码', 'success');
    });

    // 绑定重置按钮
    document.getElementById('resetBtn').addEventListener('click', function () {
      document.getElementById('batchResults').innerHTML = '<p class="history-empty">点击"生成 5 组号码"开始</p>';
      showToast('已重置', 'success');
    });

    // 初始化历史记录
    renderHistory();
  </script>
