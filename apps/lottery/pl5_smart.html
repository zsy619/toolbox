  <script>
    initColorTheme('pl5Theme');

    var HISTORY_KEY = 'pl5History';
    var historyData = [];
    try { historyData = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { historyData = []; }

    /**
     * 生成一组排列5号码(5位 0-9 数字)
     */
    function generatePL5Numbers() {
      var digits = [];
      for (var i = 0; i < 5; i++) digits.push(Math.floor(Math.random() * 10));
      return { digits: digits, time: new Date().toISOString() };
    }

    function isDuplicatePL5(newDigits) {
      return historyData.some(function (existing) {
        return newDigits.length === existing.digits.length &&
          newDigits.every(function (d, i) { return d === existing.digits[i]; });
      });
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showToast('已复制到剪贴板', 'success');
        }, function () { fallbackCopy(text); });
      } else { fallbackCopy(text); }
    }
    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('已复制到剪贴板', 'success'); }
      catch (e) { showToast('复制失败,请手动复制', 'error'); }
      document.body.removeChild(ta);
    }

    function showToast(msg, type) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:' +
        (type === 'error' ? '#e74c3c' : '#00b894') +
        ';color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 1500);
    }

    function renderBatchResults(results) {
      var html = '';
      results.forEach(function (item, index) {
        var numbers = item.digits.join('');
        var isCollected = isDuplicatePL5(item.digits);
        var saveBtnHtml = isCollected
          ? '<button type="button" class="btn btn-sm btn-collected" disabled><i class="fas fa-check"></i> 已收藏</button>'
          : '<button type="button" class="btn btn-sm btn-collect" data-index="' + index + '" aria-label="收藏第' + (index + 1) + '组"><i class="fas fa-star"></i> 收藏</button>';

        var ballsHtml = '';
        item.digits.forEach(function (d) {
          ballsHtml += '<span class="ball ball-large">' + d + '</span>';
        });

        html += '<div class="result-card">' +
          '<div class="balls" aria-label="排列5号码">' + ballsHtml + '</div>' +
          '<div class="card-actions">' + saveBtnHtml +
            '<button type="button" class="btn btn-sm btn-success" data-copy="' + numbers + '" aria-label="复制号码"><i class="fas fa-copy"></i> 复制</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('batchResults').innerHTML = html;

      document.getElementById('batchResults').querySelectorAll('.btn-collect').forEach(function (btn) {
        btn.addEventListener('click', function () { saveSingleSet(parseInt(this.dataset.index, 10)); });
      });
      document.getElementById('batchResults').querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () { copyToClipboard(this.dataset.copy); });
      });
    }

    function renderHistory() {
      var html = '';
      historyData.forEach(function (item, index) {
        var date = new Date(item.time);
        var timeStr = date.getFullYear() + '/' +
          String(date.getMonth() + 1).padStart(2, '0') + '/' +
          String(date.getDate()).padStart(2, '0') + ' ' +
          String(date.getHours()).padStart(2, '0') + ':' +
          String(date.getMinutes()).padStart(2, '0');
        var numbers = item.digits.join('');

        var ballsHtml = '';
        item.digits.forEach(function (d) {
          ballsHtml += '<span class="ball ball-large">' + d + '</span>';
        });

        html += '<div class="history-item">' +
          '<div class="balls">' + ballsHtml + '</div>' +
          '<div class="history-time">' + timeStr + '</div>' +
          '<div class="card-actions">' +
            '<button type="button" class="btn btn-sm btn-success" data-copy="' + numbers + '" aria-label="复制历史号码"><i class="fas fa-copy"></i> 复制</button>' +
            '<button type="button" class="btn btn-sm btn-warning" data-delete="' + index + '" aria-label="删除该记录"><i class="fas fa-trash"></i> 删除</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('historyList').innerHTML = html || '<p class="history-empty">暂无历史记录</p>';

      document.getElementById('historyList').querySelectorAll('[data-delete]').forEach(function (btn) {
        btn.addEventListener('click', function () { deleteHistory(parseInt(this.dataset.delete, 10)); });
      });
      document.getElementById('historyList').querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () { copyToClipboard(this.dataset.copy); });
      });
    }

    function deleteHistory(index) {
      historyData.splice(index, 1);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
      renderHistory();
      updateAllCollectButtons();
      showToast('删除成功', 'success');
    }

    function saveSingleSet(index) {
      var batchCards = document.querySelectorAll('#batchResults .result-card');
      if (index < 0 || index >= batchCards.length) return;

      var card = batchCards[index];
      var digits = Array.from(card.querySelectorAll('.ball')).map(function (el) { return parseInt(el.textContent, 10); });

      if (isDuplicatePL5(digits)) {
        showToast('该号码组合已收藏过了', 'error');
        return;
      }

      historyData.unshift({ digits: digits, time: new Date().toISOString() });
      if (historyData.length > 50) historyData = historyData.slice(0, 50);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
      renderHistory();
      updateAllCollectButtons();
      showToast('收藏成功', 'success');
    }

    function updateAllCollectButtons() {
      document.querySelectorAll('#batchResults .result-card').forEach(function (card, idx) {
        var digits = Array.from(card.querySelectorAll('.ball')).map(function (el) { return parseInt(el.textContent, 10); });
        var isCollected = isDuplicatePL5(digits);

        var btn = card.querySelector('.btn-collect, .btn-collected');
        if (!btn) return;
        if (isCollected) {
          btn.className = 'btn btn-sm btn-collected';
          btn.innerHTML = '<i class="fas fa-check"></i> 已收藏';
          btn.disabled = true;
          btn.removeAttribute('data-index');
        } else {
          btn.className = 'btn btn-sm btn-collect';
          btn.innerHTML = '<i class="fas fa-star"></i> 收藏';
          btn.disabled = false;
          btn.setAttribute('data-index', idx);
          btn.onclick = function () { saveSingleSet(idx); };
        }
      });
    }

    document.getElementById('generateBtn').addEventListener('click', function () {
      var results = [];
      for (var i = 0; i < 5; i++) results.push(generatePL5Numbers());
      renderBatchResults(results);
      showToast('已生成 5 组排列5号码', 'success');
    });

    document.getElementById('resetBtn').addEventListener('click', function () {
      document.getElementById('batchResults').innerHTML = '<p class="history-empty">点击"生成 5 组号码"开始</p>';
      showToast('已重置', 'success');
    });

    renderHistory();
  </script>
