  <script>
    initColorTheme('testTheme');

    var HISTORY_KEY = 'pathTestHistory';
    var historyData = [];
    try { historyData = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { historyData = []; }

    /**
     * 路径测试项定义
     * kind: 'css' 检查 link 标签, 'js' 检查 script 标签
     * 'xhr' 检查 fetch 资源
     */
    var testItems = [
      { name: 'lottery.css (本地)', path: 'lottery.css', kind: 'css' },
      { name: 'lottery.js (本地)', path: 'lottery.js', kind: 'js' },
      { name: 'Font Awesome (CDN)', path: 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css', kind: 'xhr' },
      { name: 'index.html (首页)', path: 'index.html', kind: 'xhr' },
      { name: 'double_ball.html', path: 'double_ball.html', kind: 'xhr' },
      { name: 'happy8.html', path: 'happy8.html', kind: 'xhr' }
    ];

    /**
     * 检测路径是否可达(基于 fetch / link / script 标签的 onload/onerror)
     */
    function checkPath(item) {
      return new Promise(function (resolve) {
        var status = 'ok';

        if (item.kind === 'css') {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = item.path;
          link.onload = function () { resolve({ name: item.name, path: item.path, status: 'ok' }); };
          link.onerror = function () { resolve({ name: item.name, path: item.path, status: 'fail' }); };
          document.head.appendChild(link);
          setTimeout(function () {
            try {
              if (!link.sheet) {
                resolve({ name: item.name, path: item.path, status: 'fail' });
              }
            } catch (e) { resolve({ name: item.name, path: item.path, status: 'fail' }); }
          }, 1500);
          return;
        }

        if (item.kind === 'js') {
          var script = document.createElement('script');
          script.src = item.path;
          script.onload = function () { resolve({ name: item.name, path: item.path, status: 'ok' }); };
          script.onerror = function () { resolve({ name: item.name, path: item.path, status: 'fail' }); };
          document.body.appendChild(script);
          setTimeout(function () {
            resolve({ name: item.name, path: item.path, status: 'fail' });
          }, 1500);
          return;
        }

        // xhr / fetch
        fetch(item.path, { method: 'HEAD', cache: 'no-cache' })
          .then(function (r) {
            resolve({ name: item.name, path: item.path, status: r.ok ? 'ok' : 'fail' });
          })
          .catch(function () {
            resolve({ name: item.name, path: item.path, status: 'fail' });
          });
      });
    }

    function showToast(msg, type) {
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);background:' +
        (type === 'error' ? '#e74c3c' : '#00b894') +
        ';color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)';
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 1500);
    }

    function renderResults(results) {
      var html = '';
      results.forEach(function (r) {
        html += '<li class="path-item">' +
          '<span>' + r.name + '</span>' +
          '<code>' + r.path + '</code>' +
          '<span class="path-status ' + (r.status === 'ok' ? 'ok' : 'warn') + '">' + (r.status === 'ok' ? '✓ OK' : '✗ FAIL') + '</span>' +
        '</li>';
      });
      document.getElementById('testList').innerHTML = html;
    }

    function renderHistory() {
      var html = '';
      historyData.forEach(function (item, index) {
        var date = new Date(item.time);
        var timeStr = date.getFullYear() + '/' +
          String(date.getMonth() + 1).padStart(2, '0') + '/' +
          String(date.getDate()).padStart(2, '0') + ' ' +
          String(date.getHours()).padStart(2, '0') + ':' +
          String(date.getMinutes()).padStart(2, '0');
        var okCount = item.results.filter(function (r) { return r.status === 'ok'; }).length;
        var total = item.results.length;

        html += '<div class="history-item">' +
          '<div class="history-time">' + timeStr + ' · 通过率 ' + okCount + '/' + total + '</div>' +
          '<div class="card-actions">' +
            '<button type="button" class="btn btn-sm btn-warning" data-delete="' + index + '" aria-label="删除该记录"><i class="fas fa-trash"></i> 删除</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('historyList').innerHTML = html || '<p class="history-empty">暂无历史记录</p>';

      document.getElementById('historyList').querySelectorAll('[data-delete]').forEach(function (btn) {
        btn.addEventListener('click', function () { deleteHistory(parseInt(this.dataset.delete, 10)); });
      });
    }

    function deleteHistory(index) {
      historyData.splice(index, 1);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
      renderHistory();
      showToast('删除成功', 'success');
    }

    document.getElementById('testBtn').addEventListener('click', async function () {
      var btn = this;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 测试中...';
      var results = [];
      for (var i = 0; i < testItems.length; i++) {
        results.push(await checkPath(testItems[i]));
      }
      renderResults(results);
      historyData.unshift({ results: results, time: new Date().toISOString() });
      if (historyData.length > 20) historyData = historyData.slice(0, 20);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
      renderHistory();

      var ok = results.filter(function (r) { return r.status === 'ok'; }).length;
      showToast('测试完成:' + ok + '/' + results.length + ' 通过', 'success');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-play"></i> 运行测试';
    });

    document.getElementById('resetBtn').addEventListener('click', function () {
      document.getElementById('testList').innerHTML = '<li class="history-empty">点击"运行测试"开始</li>';
      showToast('已重置', 'success');
    });

    renderHistory();
  </script>
