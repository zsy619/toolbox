<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书图片风格大全 · 灵感图鉴</title>
    <style>
        :root {
            --bg: #fdf6f0;
            --bg-card: #ffffff;
            --text: #3d2c2a;
            --text-secondary: #7a6a65;
            --accent: #e8615c;
            --accent-soft: #fce4e3;
            --accent2: #f0a58b;
            --accent3: #e8b86d;
            --border: #f0e3da;
            --shadow: 0 4px 20px rgba(120, 70, 50, 0.08);
            --shadow-hover: 0 16px 40px rgba(120, 70, 50, 0.16);
            --nav-bg: rgba(255, 255, 255, 0.85);
            --tag-bg: #fef5f2;
            --tag-text: #c0504a;
            --overlay: rgba(0, 0, 0, 0.45);
            --card-glow: rgba(232, 97, 92, 0.12);
            --divider: #f5e8e0;
            --input-bg: #fff;
            --badge: #e8615c;
            --badge-text: #fff;
            --toast-bg: #3d2c2a;
            --toast-text: #fff;
            --scrollbar: #e0ccc4;
            --modal-bg: #fff;
            --modal-overlay: rgba(30, 15, 10, 0.6);
            --tilt-shine: rgba(255, 255, 255, 0.55);
            --category-dot: #e8615c;
            --pulse-ring: rgba(232, 97, 92, 0.35);
        }

        [data-theme="dark"] {
            --bg: #1a1513;
            --bg-card: #2a2220;
            --text: #e8dcd6;
            --text-secondary: #b8a59c;
            --accent: #f07b75;
            --accent-soft: #3a1f1d;
            --accent2: #d4856e;
            --accent3: #c9a05a;
            --border: #3d302c;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.45);
            --nav-bg: rgba(26, 21, 19, 0.9);
            --tag-bg: #352422;
            --tag-text: #f0a098;
            --overlay: rgba(0, 0, 0, 0.7);
            --card-glow: rgba(240, 123, 117, 0.18);
            --divider: #3d302c;
            --input-bg: #2a2220;
            --badge: #f07b75;
            --badge-text: #1a1513;
            --toast-bg: #e8dcd6;
            --toast-text: #1a1513;
            --scrollbar: #4a3c37;
            --modal-bg: #2a2220;
            --modal-overlay: rgba(0, 0, 0, 0.75);
            --tilt-shine: rgba(255, 255, 255, 0.2);
            --category-dot: #f07b75;
            --pulse-ring: rgba(240, 123, 117, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* Canvas粒子背景 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
            transition: opacity 0.5s;
        }

        [data-theme="dark"] #particleCanvas {
            opacity: 0.35;
        }

        @media (max-width: 768px) {
            #particleCanvas {
                opacity: 0.3;
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 顶栏 */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            border-radius: 0 0 24px 24px;
            transition: all 0.35s;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
        }

        .top-bar.scrolled {
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e8615c, #f0a58b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            font-weight: bold;
            animation: logoPulse 3s ease-in-out infinite;
            box-shadow: 0 4px 14px rgba(232, 97, 92, 0.35);
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.07);
            }
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            white-space: nowrap;
            color: var(--text);
        }

        .logo-text span {
            background: linear-gradient(135deg, #e8615c, #f0a58b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 搜索框 */
        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 180px;
            max-width: 360px;
        }

        .search-input {
            width: 100%;
            padding: 10px 42px 10px 18px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 6px var(--accent-soft);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            pointer-events: none;
            opacity: 0.5;
        }

        .clear-search {
            position: absolute;
            right: 38px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border: none;
            background: none;
            color: var(--text-secondary);
            padding: 4px;
            border-radius: 50%;
            line-height: 1;
        }

        .clear-search.visible {
            opacity: 0.7;
            pointer-events: auto;
        }

        .clear-search:hover {
            opacity: 1;
        }

        /* 操作按钮组 */
        .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }

        .btn {
            padding: 9px 16px;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            font-family: inherit;
            white-space: nowrap;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e8615c, #f0887a);
            color: #fff;
            box-shadow: 0 4px 14px rgba(232, 97, 92, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 22px rgba(232, 97, 92, 0.45);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: var(--bg-card);
            border: 2px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: rotate(15deg);
        }

        .theme-toggle {
            font-size: 1.3rem;
            position: relative;
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            transition: all 0.4s;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        [data-theme="dark"] .theme-toggle .icon-sun {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(0deg);
        }

        [data-theme="dark"] .theme-toggle .icon-moon {
            opacity: 0;
            transform: translate(-50%, -50%) rotate(-90deg);
        }

        .theme-toggle .icon-sun {
            opacity: 0;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .theme-toggle .icon-moon {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(0deg);
        }

        /* 统计条 */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 16px 0 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .stat-badge {
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 5px 12px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 0.85rem;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 分类标签导航 */
        .category-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 6px 0 16px;
            position: sticky;
            top: 94px;
            z-index: 50;
            background: var(--bg);
            transition: background 0.5s;
            padding-top: 10px;
        }

        @media (max-width: 768px) {
            .category-nav {
                top: 80px;
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                padding-bottom: 10px;
                mask-image: linear-gradient(to right, transparent 0%, black 3%, black 97%, transparent 100%);
                -webkit-mask-image: linear-gradient(to right, transparent 0%, black 3%, black 97%, transparent 100%);
            }

            .category-nav::-webkit-scrollbar {
                display: none;
            }
        }

        .cat-tag {
            padding: 9px 17px;
            border-radius: 22px;
            cursor: pointer;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-weight: 600;
            font-size: 0.88rem;
            white-space: nowrap;
            transition: all 0.3s;
            user-select: none;
            position: relative;
            letter-spacing: 0.01em;
        }

        .cat-tag:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .cat-tag.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 6px 20px var(--card-glow);
            animation: tagPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes tagPop {
            0% {
                transform: scale(0.85);
            }

            60% {
                transform: scale(1.06);
            }

            100% {
                transform: scale(1);
            }
        }

        .cat-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--category-dot);
            margin-right: 6px;
            vertical-align: middle;
            position: relative;
            top: -1px;
        }

        .cat-tag.active .cat-dot {
            background: #fff;
        }

        /* 无结果 */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            display: none;
        }

        .no-results.show {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        .no-results .emoji-big {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
            animation: bounce 1.5s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        /* 卡片网格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            padding: 10px 0 40px;
        }

        @media (min-width: 1600px) {
            .cards-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (max-width: 1200px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        @media (max-width: 380px) {
            .cards-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
        }

        /* 风格卡片 */
        .style-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 20px 16px;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            overflow: hidden;
            text-align: center;
            user-select: none;
            transform-style: preserve-3d;
            perspective: 800px;
            animation: cardAppear 0.6s ease-out forwards;
            opacity: 0;
        }

        .style-card.visible {
            opacity: 1;
            animation: cardAppear 0.6s ease-out forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .style-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--card-glow) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            z-index: 0;
        }

        .style-card:hover::before {
            opacity: 1;
        }

        .style-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
            transform: translateY(-6px) scale(1.03);
            z-index: 10;
        }

        .style-card:active {
            transform: scale(0.95);
            transition: transform 0.15s;
        }

        .style-card .card-emoji {
            font-size: 2.6rem;
            display: block;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            transition: transform 0.4s;
        }

        .style-card:hover .card-emoji {
            transform: scale(1.2) rotate(-8deg);
        }

        .style-card .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            position: relative;
            z-index: 1;
            letter-spacing: 0.01em;
        }

        .style-card .card-cat {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 4px;
            position: relative;
            z-index: 1;
            opacity: 0.8;
        }

        .style-card .card-actions-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.3s;
        }

        .style-card:hover .card-actions-row {
            opacity: 1;
            transform: translateY(0);
        }

        .card-action-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.25s;
            background: var(--tag-bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-action-dot:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.15);
        }

        .card-action-dot.fav-active {
            background: #ffe0dc;
            color: #e8615c;
        }

        [data-theme="dark"] .card-action-dot.fav-active {
            background: #4a2020;
            color: #f07b75;
        }

        .style-card.favorited {
            border-color: #f0a58b;
            box-shadow: 0 0 0 4px rgba(240, 165, 139, 0.15);
        }

        /* 混搭弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--modal-bg);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            transform: translateY(30px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.open .modal {
            transform: translateY(0);
        }

        .modal h2 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .modal .mashup-result {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e8615c, #f0a58b, #e8b86d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 16px 0;
            letter-spacing: 0.02em;
        }

        .modal .mashup-detail {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal .btn-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 50%;
            transition: all 0.3s;
            line-height: 1;
        }

        .modal .btn-close:hover {
            background: var(--tag-bg);
            color: var(--text);
        }

        .modal .sparkle {
            font-size: 3rem;
            animation: sparkleBounce 0.7s ease-out;
        }

        @keyframes sparkleBounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            60% {
                transform: scale(1.4);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            z-index: 300;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.9rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 回到顶部 */
        .back-to-top {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            cursor: pointer;
            z-index: 90;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s;
            color: var(--text);
        }

        .back-to-top.visible {
            opacity: 0.9;
            pointer-events: auto;
        }

        .back-to-top:hover {
            opacity: 1;
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar);
            border-radius: 10px;
        }

        /* 移动端底部导航 */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            justify-content: space-around;
            gap: 4px;
        }

        @media (max-width: 768px) {
            .mobile-nav {
                display: flex;
            }

            .back-to-top {
                bottom: 80px;
            }

            body {
                padding-bottom: 70px;
            }

            .cards-grid {
                padding-bottom: 80px;
            }
        }

        .mobile-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;

    </nav>
    <script>
        (function () {
            // ============ 数据定义 - 完整102种风格 ============
            const categoriesData = [{
                id: '摄影写真',
                name: '摄影写真风格',
                icon: '📷',
                emoji: ['📸', '🎞️', '🌅', '💃', '🕶️', '✨', '🌊', '🏙️', '🌿', '🖤', '🎬', '⚡', '🤿', '🚁', '☀️',

                    '美式复古/西部风', '港风复古', '昭和风/平成风', '新中式', '纯欲风', '甜酷风',
                    '废土风', 'Y2K', '赛博朋克', '老钱风', '知识分子风', '芭蕾风/芭蕾美学',
                    '运动老钱/网球风', '爷青回/千禧年', '剧场感/电影感', '闪光灯直闪', '水下摄影',
                    '航拍/上帝视角', '光影大片', '逆光/发丝光', '剪影', '黑白摄影'
                ]
            }, {
                id: '滤镜调色',
                name: '滤镜调色风格',
                icon: '🎨',
                emoji: ['🔵', '🌲', '🧈', '🍂', '🌈', '🩶', '🫧', '🔍', '💡', '🌃', '🌇', '📻'],
                items: [
                    '蓝调/日系蓝', '森绿/暗调绿', '奶油暖调', '美拉德', '多巴胺', '格雷系/灰调',
                    '清冷灰调', '原生感/原图感', '柔光朦胧', '夜景霓虹', '晚霞/落日灯', 'Lofi低保真'
                ]
            }, {
                id: '插画设计',
                name: '插画设计风格',
                icon: '🖌️',
                emoji: ['🔲', '🔺', '✏️', '🖌️', '🐉', '🖋️', '🌊', '📏', '🧸', '✍️', '🫧', '👾', '💿', '📺',
                    '🖼️', '✂️', '📰', '🌈', '🪟', '🫧', '💎', '🖼️'
                ],
                items: [
                    '扁平化矢量', '孟菲斯风格', '手绘涂鸦风', '水彩淡彩', '国潮插画', '水墨风',
                    '浮世绘风', '线描/单线风', '治愈系Q版', '简笔画+手写字', '黏土风/橡皮泥风', '像素风',
                    '酸性设计', '蒸汽波/故障艺术', '波普艺术', '剪纸/纸艺风', '复古拼贴画', '弥散光/模糊渐变',
                    '玻璃拟态/毛玻璃', '3D气泡质感', 'C4D/Blender立体', '厚涂油画风'
                ]
            }, {
                id: '排版构图',
                name: '排版构图文案风格',
                icon: '📐',
                emoji: ['📝', '🖼️', '📰', '💬', '🎞️', '📢', '⬜', '🖍️', '📒', '💭', '📋', '🔍'],
                items: [
                    'Plog风', '便签/拍立得拼贴', '杂志内页风', '备忘录/聊天记录风', '上下分镜/Panel切图',
                    '大字报/标题党风', '极简留白+小字', '荧光笔标注风', '手账风', '涂鸦互动风', '目录/清单风',
                    '找茬/对比图风'
                ]
            }, {
                id: '主题场景',
                name: '主题场景与内容方向',
                icon: '🎬',
                emoji: ['👗', '📦', '💄', '🏠', '📚', '🍽️', '☕', '📊', '🧴', '📱', '📅', '✂️'],
                items: [
                    'OOTD/穿搭对镜自拍', '开箱/Flat Lay平铺', 'GRWM(跟我一起准备)', 'Room Tour/居家美学',
                    '书桌分享/Studygram', '美食/暗调料理', '咖啡探店记录', '调色教程/参数截图',
                    '护肤空瓶/铁皮记录', '电子手账/Goodnotes风', '日签/日历打卡', 'ootd抠图穿搭'
                ]
            }, {
                id: 'AI生成',
                name: 'AI生成与合成创意风格',
                icon: '🤖',
                emoji: ['🫧', '🎓', '🧸', '🐱', '🧶', '🧱', '🏙️', '🖌️', '⚔️', '👥'],
                items: [
                    '黏土滤镜风', '90年代毕业照/年鉴照', '拟人化/万物变人', '骑行动物合成', '针织/羊毛毡世界',
                    '乐高/积木世界', '微缩模型/移轴效果', '水彩渲染现实', '赛博/光剑变装', '数字克隆/多自我合影'
                ]
            }, {
                id: '情绪板',
                name: '情绪板与抽象视觉',
                icon: '💭',
                emoji: ['📐', '🔬', '🌫️', '🌤️', '🎨', '🗺️'],
                items: [
                    '极简几何构图', '宏观微距', '模糊动态', '蓝天/日落渐变', '单色情绪', '地图/旅行印记'
                ]
            }];

            // 构建扁平化数据
            const allStyles = [];
            categoriesData.forEach(cat => {
                cat.items.forEach((item, idx) => {
                    allStyles.push({
                        id: `${cat.id}-${idx}`,
                        name: item,
                        category: cat.id,
                        categoryName: cat.name,
                        emoji: cat.emoji[idx] || cat.icon
                    });
                });
            });

            // ============ DOM引用 ============
            const cardsGrid = document.getElementById('cardsGrid');
            const categoryNav = document.getElementById('categoryNav');
            const searchInput = document.getElementById('searchInput');
            const clearSearch = document.getElementById('clearSearch');
            const noResults = document.getElementById('noResults');
            const totalCount = document.getElementById('totalCount');
            const filteredBadge = document.getElementById('filteredBadge');
            const filteredCount = document.getElementById('filteredCount');
            const favCountBadge = document.getElementById('favCountBadge');
            const favCountNum = document.getElementById('favCountNum');
            const btnMashup = document.getElementById('btnMashup');
            const modalOverlay = document.getElementById('modalOverlay');
            const btnCloseModal = document.getElementById('btnCloseModal');
            const btnReroll = document.getElementById('btnReroll');
            const mashupResult = document.getElementById('mashupResult');
            const mashupDetail = document.getElementById('mashupDetail');
            const modalSparkle = document.getElementById('modalSparkle');
            const toast = document.getElementById('toast');
            const backToTop = document.getElementById('backToTop');
            const themeToggle = document.getElementById('themeToggle');
            const topBar = document.getElementById('topBar');
            const mobileNav = document.getElementById('mobileNav');
            const particleCanvas = document.getElementById('particleCanvas');
            const ctx = particleCanvas.getContext('2d');

            let currentCat = 'all';
            let currentSearch = '';
            let favorites = JSON.parse(localStorage.getItem('xhs_favs') || '{}');
            let toastTimer = null;

            // ============ 粒子背景 ============
            let particles = [];
            const isMobile = window.innerWidth < 768;
            const particleCount = isMobile ? 35 : 80;

            function resizeCanvas() {
                particleCanvas.width = window.innerWidth;
                particleCanvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * particleCanvas.width;
                    this.y = Math.random() * particleCanvas.height;
                    this.size = Math.random() * 2.5 + 1;
                    this.speedX = (Math.random() - 0.5) * 0.6;
                    this.speedY = (Math.random() - 0.5) * 0.6;
                    this.opacity = Math.random() * 0.5 + 0.15;
                    this.pulseSpeed = Math.random() * 0.02 + 0.005;
                    this.pulseOffset = Math.random() * Math.PI * 2;
                }
                update(time) {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < -20) this.x = particleCanvas.width + 20;
                    if (this.x > particleCanvas.width + 20) this.x = -20;
                    if (this.y < -20) this.y = particleCanvas.height + 20;
                    if (this.y > particleCanvas.height + 20) this.y = -20;
                    this.currentOpacity = this.opacity + Math.sin(time * this.pulseSpeed + this.pulseOffset) * 0.2;
                    this.currentOpacity = Math.max(0.05, Math.min(0.7, this.currentOpacity));
                }
                draw(ctx) {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    const r = isDark ? 220 : 180;
                    const g = isDark ? 180 : 130;
                    const b = isDark ? 170 : 120;
                    ctx.fillStyle = `rgba(${r},${g},${b},${this.currentOpacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function animateParticles(time) {
                ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                particles.forEach(p => {
                    p.update(time);
                    p.draw(ctx);
                });
                // 连线
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 100) {
                            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                            const alpha = (1 - dist / 100) * 0.12;
                            ctx.strokeStyle = isDark ?
                                `rgba(200,170,160,${alpha})` :
                                `rgba(180,140,120,${alpha})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animateParticles);
            }
            requestAnimationFrame(animateParticles);

            // ============ 渲染分类标签 ============
            function renderCategoryNav() {
                const existingTags = categoryNav.querySelectorAll('.cat-tag');
                existingTags.forEach(t => { if (t.dataset.cat !== 'all') t.remove(); });
                categoriesData.forEach(cat => {
                    const tag = document.createElement('span');
                    tag.className = 'cat-tag';
                    tag.dataset.cat = cat.id;
                    tag.innerHTML = `<span class="cat-dot"></span>${cat.name.split('风格')[0]}`;
                    tag.addEventListener('click', () => {
                        document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove(
                            'active'));
                        tag.classList.add('active');
                        document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList
                            .remove('active'));
                        const mbtn = document.querySelector(`.mobile-nav-btn[data-mcat="${cat.id}"]`);
                        if (mbtn) mbtn.classList.add('active');
                        currentCat = cat.id;
                        renderCards();
                        updateStats();
                        cardsGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                    categoryNav.appendChild(tag);
                });
                // 全部标签
                const allTag = categoryNav.querySelector('.cat-tag[data-cat="all"]');
                if (allTag) {
                    allTag.addEventListener('click', () => {
                        document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
                        allTag.classList.add('active');
                        document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove(
                            'active'));
                        const mbtn = document.querySelector('.mobile-nav-btn[data-mcat="all"]');
                        if (mbtn) mbtn.classList.add('active');
                        currentCat = 'all';
                        renderCards();
                        updateStats();
                        cardsGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    });
                }
            }

            // ============ 渲染卡片 ============
            function renderCards() {
                cardsGrid.innerHTML = '';
                let filtered = allStyles;
                if (currentCat !== 'all') {
                    filtered = filtered.filter(s => s.category === currentCat);
                }
                if (currentSearch.trim()) {
                    const kw = currentSearch.trim().toLowerCase();
                    filtered = filtered.filter(s =>
                        s.name.toLowerCase().includes(kw) ||
                        s.categoryName.toLowerCase().includes(kw) ||
                        s.category.toLowerCase().includes(kw)
                    );
                }

                if (filtered.length === 0) {
                    noResults.classList.add('show');
                } else {
                    noResults.classList.remove('show');
                }

                filtered.forEach((style, index) => {
                    const card = document.createElement('div');
                    card.className = 'style-card';
                    card.style.animationDelay = `${index * 0.025}s`;
                    card.dataset.styleId = style.id;
                    if (favorites[style.id]) {
                        card.classList.add('favorited');
                    }
                    card.innerHTML = `
                        <span class="card-emoji">${style.emoji}</span>
                        <div class="card-title">${style.name}</div>
                        <div class="card-cat">${style.categoryName}</div>
                        <div class="card-actions-row">
                            <button class="card-action-dot fav-btn ${favorites[style.id] ? 'fav-active' : ''}" data-action="fav" title="收藏">💾</button>
                            <button class="card-action-dot copy-btn" data-action="copy" title="复制名称">📋</button>
                        </div>
                    `;
                    // 鼠标跟踪光效
                    card.addEventListener('mousemove', (e) => {
                        const rect = card.getBoundingClientRect();
                        const x = ((e.clientX - rect.left) / rect.width) * 100;
                        const y = ((e.clientY - rect.top) / rect.height) * 100;
                        card.style.setProperty('--mouse-x', x + '%');
                        card.style.setProperty('--mouse-y', y + '%');
                        // 3D倾斜
                        const tiltX = ((y - 50) / 50) * -8;
                        const tiltY = ((x - 50) / 50) * 8;
                        card.style.transform =
                            `translateY(-6px) scale(1.03) perspective(800px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                    });
                    card.addEventListener('mouseleave', () => {
                        card.style.transform = '';
                        card.style.setProperty('--mouse-x', '50%');
                        card.style.setProperty('--mouse-y', '50%');
                    });
                    // 点击事件委托
                    card.addEventListener('click', (e) => {
                        const target = e.target.closest('[data-action]');
                        if (target) {
                            e.stopPropagation();
                            const action = target.dataset.action;
                            if (action === 'fav') {
                                toggleFav(style.id, card, target);
                            } else if (action === 'copy') {
                                copyStyleName(style.name);
                            }
                        } else {
                            // 点击卡片本身复制名称
                            copyStyleName(style.name);
                        }
                    });
                    // 触摸设备长按提示
                    card.addEventListener('touchstart', function (e) {
                        if (e.target.closest('[data-action]')) return;
                        card.style.transform = 'scale(0.96)';
                    }, { passive: true });
                    card.addEventListener('touchend', function () {
                        card.style.transform = '';
                    });
                    cardsGrid.appendChild(card);
                    // 延迟触发可见动画
                    requestAnimationFrame(() => {
                        card.classList.add('visible');
                    });
                });

                updateStats(filtered.length);
            }

            function updateStats(filteredLen = null) {
                totalCount.textContent = allStyles.length;
                const favCount = Object.keys(favorites).filter(k => favorites[k]).length;
                if (favCount > 0) {
                    favCountBadge.style.display = 'inline';
                    favCountNum.textContent = favCount;
                } else {
                    favCountBadge.style.display = 'none';
                }
                if (filteredLen !== null && (currentCat !== 'all' || currentSearch.trim())) {
                    filteredBadge.style.display = 'inline';
                    filteredCount.textContent = filteredLen;
                } else if (filteredLen === null && (currentCat !== 'all' || currentSearch.trim())) {
                    filteredBadge.style.display = 'inline';
                } else {
                    filteredBadge.style.display = 'none';
                }
            }

            function toggleFav(styleId, card, btnEl) {
                if (favorites[styleId]) {
                    delete favorites[styleId];
                    card.classList.remove('favorited');
                    if (btnEl) btnEl.classList.remove('fav-active');
                    showToast('已取消收藏');
                } else {
                    favorites[styleId] = true;
                    card.classList.add('favorited');
                    if (btnEl) btnEl.classList.add('fav-active');
                    showToast('⭐ 已收藏！');
                }
                localStorage.setItem('xhs_favs', JSON.stringify(favorites));
                updateStats();
            }

            function copyStyleName(name) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(name).then(() => {
                        showToast('📋 已复制: ' + name);
                    }).catch(() => {
                        fallbackCopy(name);
                    });
                } else {
                    fallbackCopy(name);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('📋 已复制: ' + text);
                } catch (e) { showToast('复制失败，请手动选择'); }
                document.body.removeChild(ta);
            }

            function showToast(msg) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ============ 混搭弹窗 ============
            function openMashup() {
                doMashup();
                modalOverlay.classList.add('open');
                modalSparkle.textContent = ['💡', '✨', '🌟', '🎯', '💫'][Math.floor(Math.random() * 5)];
                modalSparkle.style.animation = 'none';
                void modalSparkle.offsetWidth;
                modalSparkle.style.animation = 'sparkleBounce 0.7s ease-out';
            }

            function closeMashup() {
                modalOverlay.classList.remove('open');
            }

            function doMashup() {
                const cat1 = categoriesData[Math.floor(Math.random() * categoriesData.length)];
                let cat2 = categoriesData[Math.floor(Math.random() * categoriesData.length)];
                while (cat2.id === cat1.id && categoriesData.length > 1) {
                    cat2 = categoriesData[Math.floor(Math.random() * categoriesData.length)];
                }
                const style1 = cat1.items[Math.floor(Math.random() * cat1.items.length)];
                const style2 = cat2.items[Math.floor(Math.random() * cat2.items.length)];
                const comboName = style1.split('/')[0].split('风')[0] + ' × ' + style2.split('/')[0].split('风')[0];
                mashupResult.textContent = comboName;
                mashupDetail.textContent =
                    `将「${cat1.name}」中的【${style1}】与「${cat2.name}」中的【${style2}】进行混搭叠加，创造独特的差异化视觉效果。试试看吧！`;
            }

            btnMashup.addEventListener('click', openMashup);
            btnCloseModal.addEventListener('click', closeMashup);
            btnReroll.addEventListener('click', () => {
                doMashup();
                modalSparkle.textContent = ['💡', '✨', '🌟', '🎯', '💫'][Math.floor(Math.random() * 5)];
                modalSparkle.style.animation = 'none';
                void modalSparkle.offsetWidth;
                modalSparkle.style.animation = 'sparkleBounce 0.7s ease-out';
            });
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeMashup();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMashup();
            });

            // ============ 搜索 ============
            searchInput.addEventListener('input', () => {
                currentSearch = searchInput.value;
                if (currentSearch.trim()) {
                    clearSearch.classList.add('visible');
                } else {
                    clearSearch.classList.remove('visible');
                }
                renderCards();
                updateStats();
            });
            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                currentSearch = '';
                clearSearch.classList.remove('visible');
                renderCards();
                updateStats();
                searchInput.focus();
            });

            // ============ 主题切换 ============
            function setTheme(dark) {
                if (dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('xhs_theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('xhs_theme', 'light');
                }
            }
            const savedTheme = localStorage.getItem('xhs_theme');
            if (savedTheme === 'dark') {
                setTheme(true);
            } else if (savedTheme === 'light') {
                setTheme(false);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark);
            }
            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                setTheme(!isDark);
                themeToggle.style.transform = 'rotate(360deg)';
                setTimeout(() => { themeToggle.style.transform = ''; }, 400);
            });

            // ============ 回到顶部 ============
            function checkBackToTop() {
                if (window.scrollY > 500) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
                if (window.scrollY > 40) {
                    topBar.classList.add('scrolled');
                } else {
                    topBar.classList.remove('scrolled');
                }
            }
            backToTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            window.addEventListener('scroll', checkBackToTop, { passive: true });

            // ============ 移动端底部导航 ============
            mobileNav.querySelectorAll('.mobile-nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mcat = btn.dataset.mcat;
                    mobileNav.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList
                        .remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
                    if (mcat === 'all') {
                        currentCat = 'all';
                        const allTag = categoryNav.querySelector('.cat-tag[data-cat="all"]');
                        if (allTag) allTag.classList.add('active');
                    } else {
                        currentCat = mcat;
                        const tag = categoryNav.querySelector(`.cat-tag[data-cat="${mcat}"]`);
                        if (tag) tag.classList.add('active');
                    }
                    renderCards();
                    updateStats();
                    cardsGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            // 同步移动端导航与分类标签
            const syncMobileNav = () => {
                mobileNav.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove('active'));
                if (currentCat === 'all') {
                    const btn = mobileNav.querySelector('.mobile-nav-btn[data-mcat="all"]');
                    if (btn) btn.classList.add('active');
                } else {
                    const btn = mobileNav.querySelector(`.mobile-nav-btn[data-mcat="${currentCat}"]`);
                    if (btn) btn.classList.add('active');
                }
            };
            const origRenderCards = renderCards;
            renderCards = function () {
                origRenderCards();
                syncMobileNav();
            };

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'm') {
                    e.preventDefault();
                    openMashup();
                }
            });

            // ============ 初始化 ============
            function init() {
                renderCategoryNav();
                renderCards();
                updateStats();
                checkBackToTop();
                if (currentSearch.trim()) clearSearch.classList.add('visible');
                syncMobileNav();
            }
            init();

            // ============ 窗口大小变化时重渲染粒子 ============
            let resizeDebounce;
            window.addEventListener('resize', () => {
                clearTimeout(resizeDebounce);
                resizeDebounce = setTimeout(() => {
                    resizeCanvas();
                    const newCount = window.innerWidth < 768 ? 35 : 80;
                    while (particles.length < newCount) particles.push(new Particle());
                    while (particles.length > newCount) particles.pop();
                }, 300);
            });

            console.log('✨ 小红书灵感图鉴已就绪！');
            console.log('   📷 共收录 ' + allStyles.length + ' 种风格，分属 ' + categoriesData.length + ' 大类');
            console.log('   🎲 试试点击"混搭灵感"按钮获取创意组合');
            console.log('   ⌨️ 快捷键: Ctrl+K 搜索 | Ctrl+M 混搭');
            console.log('   💾 点击卡片上的 💾 可收藏风格');
            console.log('   🌙 点击右上角切换暗色模式');
        })();
    </script>
</body>

</html>
