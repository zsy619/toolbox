<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="PromptLens">
  <meta property="og:description" content="丢视频，得提示词">
  <meta property="og:type" content="website">
  <title>PromptLens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #2563EB20; border: 2px solid #2563EB; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #7C3AED; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #2563EB; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #2563EB, #7C3AED); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; cursor: pointer; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #2563EB20, #7C3AED20); border: 2px solid #2563EB; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#2563EB10 1px, transparent 1px), linear-gradient(90deg, #2563EB10 1px, transparent 1px), linear-gradient(#7C3AED08 1px, transparent 1px), linear-gradient(90deg, #7C3AED08 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #7C3AED; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">

    <div class="features">
      <div class="feature-row"><div class="feature-icon">📹</div><div class="feature-text"><strong>视频分析</strong> — 上传视频，AI 自动提取关键帧并分析画面内容</div></div>
      <div class="feature-row"><div class="feature-icon">🖼️</div><div class="feature-text"><strong>图片分析</strong> — 支持单图或多图批量分析，抽取视觉元素</div></div>
      <div class="feature-row"><div class="feature-icon">📝</div><div class="feature-text"><strong>台词提取</strong> — 视频里的台词、旁白直接提取成文本，无需手动听写</div></div>
      <div class="feature-row"><div class="feature-icon">🤖</div><div class="feature-text"><strong>多 API 支持</strong> — 智谱AI、Gemini、OpenRouter，灵活选择</div></div>
    </div>

    <div class="highlight-box"><p>不知道如何描述视频画面？<br>丢进去，AI 帮你写提示词</p></div>

    <div class="cta-group">
      <a href="https://github.com/raojiacui/prompt-lens" target="_blank" class="cta-btn">GitHub</a>
    </div>

  </div>
</body>
</html>
