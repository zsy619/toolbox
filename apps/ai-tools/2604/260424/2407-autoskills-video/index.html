        .gradient-text { background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .image-viewer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;background:linear-gradient(180deg,rgba(0,0,0,0.95) 0%,rgba(20,20,30,0.98) 100%);backdrop-filter:blur(20px);overflow:hidden}

        .viewer-zoom-slider-container{display:flex;align-items:center;gap:0.75rem;background:rgba(255,255,255,0.08);border-radius:0.75rem;padding:0.25rem 1rem;border:1px solid rgba(255,255,255,0.1)}

        .viewer-main{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:grab;min-height:0}
        .viewer-main:active{cursor:grabbing}
        .viewer-canvas{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:visible}
        .viewer-image-container{position:absolute;transform-origin:center center;user-select:none;transition:transform 0.1s ease-out}
        .viewer-image{display:block;max-width:92vw;max-height:75vh;object-fit:contain;pointer-events:none;user-select:none;border-radius:0.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
        .viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:4rem;height:4rem;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;border:1px solid rgba(255,255,255,0.15);color:white;font-size:1.5rem;z-index:10}
        .viewer-nav:hover{background:rgba(255,255,255,0.2);transform:translateY(-50%) scale(1.1)}
        .viewer-nav.prev{left:1.5rem}.viewer-nav.next{right:1.5rem}
        .viewer-bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:1rem 1.5rem;background:linear-gradient(0deg,rgba(0,0,0,0.8) 0%,transparent 100%);display:flex;justify-content:center;flex-shrink:0}
        .viewer-info{display:flex;align-items:center;gap:1rem;font-size:0.9rem;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);padding:0.5rem 1.25rem;border-radius:2rem;border:1px solid rgba(255,255,255,0.1)}
        .viewer-thumbnail-strip{display:flex;gap:0.75rem;padding:1rem 1.5rem;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);overflow-x:auto;max-height:120px;min-height:100px;border-top:1px solid rgba(255,255,255,0.05);flex-shrink:0}
        .viewer-thumbnail{width:80px;height:60px;border-radius:0.5rem;object-fit:cover;cursor:pointer;opacity:0.4;transition:all 0.3s;border:2px solid transparent;flex-shrink:0}
        .viewer-thumbnail:hover{opacity:0.7;transform:scale(1.05)}
        .viewer-thumbnail.active{opacity:1;border-color:#06B6D4;box-shadow:0 0 20px rgba(6,182,212,0.4)}
        .viewer-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);color:white;padding:1rem 2rem;border-radius:1rem;font-size:1.1rem;pointer-events:none;opacity:0;transition:all 0.3s ease;z-index:10002;border:1px solid rgba(255,255,255,0.1)}
        .viewer-toast.show{opacity:1}
        .viewer-loading{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);gap:1rem;color:white;font-size:1rem;z-index:100}
        .viewer-loading.active{display:flex}
        .viewer-loading-spinner{width:3rem;height:3rem;border:3px solid rgba(255,255,255,0.2);border-top-color:#06B6D4;border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <div id="imageViewer" class="image-viewer"><div class="viewer-toolbar"><div class="viewer-toolbar-left"><button class="viewer-toolbar-btn" onclick="closeImageViewer()" title="关闭 (ESC)"><i class="fas fa-times"></i></button><div class="viewer-toolbar-divider"></div><button class="viewer-toolbar-btn" onclick="rotateImage(-90)" title="向左旋转"><i class="fas fa-undo"></i></button><button class="viewer-toolbar-btn" onclick="rotateImage(90)" title="向右旋转"><i class="fas fa-redo"></i></button></div><div class="viewer-toolbar-center"><button class="viewer-toolbar-btn" onclick="zoomOut()" title="缩小 (-)"><i class="fas fa-search-minus"></i></button><div class="viewer-zoom-slider-container"><input type="range" id="zoomSlider" class="viewer-zoom-slider" min="10" max="500" value="100"><span id="zoomDisplay" class="viewer-zoom-display">100%</span></div><button class="viewer-toolbar-btn" onclick="zoomIn()" title="放大 (+)"><i class="fas fa-search-plus"></i></button><button class="viewer-toolbar-btn" onclick="fitToScreen()" title="适应屏幕"><i class="fas fa-expand-arrows-alt"></i></button></div><div class="viewer-toolbar-right"><button class="viewer-toolbar-btn" onclick="downloadImage()" title="下载"><i class="fas fa-download"></i></button><button class="viewer-toolbar-btn" onclick="openInNewTab()" title="新窗口打开"><i class="fas fa-external-link-alt"></i></button></div></div><div class="viewer-main" id="viewerMain"><div class="viewer-canvas" id="viewerCanvas"><div class="viewer-image-container" id="imageContainer"><img id="viewerImage" class="viewer-image" alt=""></div></div><div class="viewer-loading" id="viewerLoading"><div class="viewer-loading-spinner"></div><span>加载中...</span></div><button class="viewer-nav prev" onclick="prevImage()"><i class="fas fa-chevron-left"></i></button><button class="viewer-nav next" onclick="nextImage()"><i class="fas fa-chevron-right"></i></button></div><div class="viewer-thumbnail-strip" id="thumbnailStrip"></div><div id="viewerToast" class="viewer-toast"></div></div>
    <script>let images=[],currentIndex=0,scale=1,rotation=0,flipX=1,flipY=1,translateX=0,translateY=0,isDragging=false,startX=0,startY=0;function collectImages(){const imgs=[];const seen=new Set();document.querySelectorAll('img').forEach(img=>{if(!seen.has(img.src)&&img.src&&!img.src.includes('data:')&&img.id!=='viewerImage'){seen.add(img.src);imgs.push({src:img.src,title:img.alt||'图片',thumbnail:img.src})}});return imgs};function openImageViewer(index){images=collectImages();if(images.length===0)return;currentIndex=Math.max(0,Math.min(index,images.length-1));resetViewState();loadImage(currentIndex);buildThumbnailStrip();updateUI();document.getElementById('imageViewer').classList.add('active');document.body.style.overflow='hidden'};function closeImageViewer(){document.getElementById('imageViewer').classList.remove('active');document.body.style.overflow=''};function resetViewState(){scale=1;rotation=0;flipX=1;flipY=1;translateX=0;translateY=0;updateSliderValue()};function loadImage(index){const loading=document.getElementById('viewerLoading'),img=document.getElementById('viewerImage');if(loading)loading.classList.add('active');const tempImg=new Image();tempImg.onload=()=>{img.src=images[index].src;if(loading)loading.classList.remove('active');updateImageInfo();updateTransform()};tempImg.onerror=()=>{if(loading)loading.classList.remove('active')};tempImg.src=images[index].src};function prevImage(){if(images.length<=1)return;currentIndex=(currentIndex-1+images.length)%images.length;resetViewState();loadImage(currentIndex);updateUI()};function nextImage(){if(images.length<=1)return;currentIndex=(currentIndex+1)%images.length;resetViewState();loadImage(currentIndex);updateUI()};function zoom(delta){const newScale=Math.max(0.1,Math.min(5,scale+delta));if(newScale!==scale){scale=newScale;updateTransform();updateZoomDisplay();updateSliderValue()}};function zoomIn(){zoom(0.25)};function zoomOut(){zoom(-0.25)};function fitToScreen(){resetViewState();updateTransform();updateZoomDisplay();updateSliderValue()};function rotateImage(deg){rotation=(rotation+deg)%360;updateTransform()};function downloadImage(){const link=document.createElement('a');link.href=images[currentIndex].src;link.download=images[currentIndex].title||'image';link.target='_blank';document.body.appendChild(link);link.click();document.body.removeChild(link)};function openInNewTab(){window.open(images[currentIndex].src,'_blank')};function showToast(text){const toast=document.getElementById('viewerToast');if(!toast)return;toast.textContent=text;toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show')},2000)};function updateTransform(){const container=document.getElementById('imageContainer');if(container)container.style.transform=`translate(${translateX}px,${translateY}px) rotate(${rotation}deg) scaleX(${flipX}) scaleY(${flipY}) scale(${scale})`};function buildThumbnailStrip(){const strip=document.getElementById('thumbnailStrip');if(!strip)return;strip.innerHTML='';images.forEach((img,index)=>{const thumb=document.createElement('img');thumb.className='viewer-thumbnail'+(index===currentIndex?' active':'');thumb.src=img.thumbnail;thumb.alt=img.title;thumb.onclick=()=>{currentIndex=index;resetViewState();loadImage(currentIndex);updateUI()};strip.appendChild(thumb)})};function updateUI(){document.querySelectorAll('.viewer-thumbnail').forEach((thumb,index)=>{thumb.classList.toggle('active',index===currentIndex)});updateImageInfo()};function updateImageInfo(){const counterEl=document.getElementById('imageCounter');if(counterEl)counterEl.textContent=(currentIndex+1)+' / '+images.length};function updateZoomDisplay(){const display=document.getElementById('zoomDisplay');if(display)display.textContent=Math.round(scale*100)+'%'};function updateSliderValue(){const slider=document.getElementById('zoomSlider');if(slider)slider.value=scale*100};function bindViewerEvents(){const canvas=document.getElementById('viewerMain'),zoomSlider=document.getElementById('zoomSlider');if(!canvas)return;canvas.addEventListener('mousedown',(e)=>{if(e.button===0){isDragging=true;startX=e.clientX-translateX;startY=e.clientY-translateY;canvas.style.cursor='grabbing'}});document.addEventListener('mousemove',(e)=>{if(isDragging){translateX=e.clientX-startX;translateY=e.clientY-startY;updateTransform()}});document.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='grab'});canvas.addEventListener('wheel',(e)=>{e.preventDefault();zoom(e.deltaY>0?-0.15:0.15)},{passive:false});canvas.addEventListener('dblclick',()=>{if(scale!==1)fitToScreen();else{scale=2;updateTransform();updateZoomDisplay();updateSliderValue()}});if(zoomSlider)zoomSlider.addEventListener('input',(e)=>{scale=e.target.value/100;updateTransform();updateZoomDisplay()});document.addEventListener('keydown',(e)=>{if(!document.getElementById('imageViewer').classList.contains('active'))return;switch(e.key){case'Escape':closeImageViewer();break;case'ArrowLeft':prevImage();break;case'ArrowRight':nextImage();break;case'+':case'=':zoomIn();break;case'-':zoomOut();break;case'0':fitToScreen();break}});canvas.addEventListener('touchstart',(e)=>{if(e.touches.length===1){startX=e.touches[0].clientX-translateX;startY=e.touches[0].clientY-translateY}},{passive:true});canvas.addEventListener('touchmove',(e)=>{if(e.touches.length===1){translateX=e.touches[0].clientX-startX;translateY=e.touches[0].clientY-startY;updateTransform()}},{passive:true})};document.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{images=collectImages();if(images.length===0)return;buildThumbnailStrip();bindViewerEvents()},100)});</script>
