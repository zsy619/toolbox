<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="design.md">
  <meta property="og:description" content="Design Tokens 的双层结构革命">
  <meta property="og:type" content="website">
  <title>design.md</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #60A5FA 0%, #A78BFA 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #60A5FA20; border: 2px solid #60A5FA; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #A78BFA; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #60A5FA; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #60A5FA, #A78BFA); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; cursor: pointer; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #60A5FA20, #A78BFA20); border: 2px solid #60A5FA; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#60A5FA10 1px, transparent 1px), linear-gradient(90deg, #60A5FA10 1px, transparent 1px), linear-gradient(#A78BFA08 1px, transparent 1px), linear-gradient(90deg, #A78BFA08 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #A78BFA; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">

    <div class="features">
      <div class="feature-row"><div class="feature-icon">⚙️</div><div class="feature-text"><strong>YAML Front Matter</strong> — 机器可读的精确 token 数值：colors、typography、spacing...</div></div>
      <div class="feature-row"><div class="feature-icon">📝</div><div class="feature-text"><strong>Markdown Body</strong> — 人类可读的设计 rationale，解释为什么和如何应用</div></div>
    </div>

    <div class="highlight-box"><p>机器可读 token + 人类可读 rationale<br>让 AI 既能获取精确值，又能理解设计意图</p></div>

    <div class="links">
      <span>Google Labs · 开源设计规范</span>
    </div>

    <div class="cta-group">
      <a href="https://github.com/google-labs-co/design.md" target="_blank" class="cta-btn">GitHub</a>
    </div>

  </div>
</body>
</html>
