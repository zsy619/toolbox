<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>X导师.skill - 封面图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1920px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; }
    .container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; position: relative; }
    
    /* 装饰圆形 */
    .circle { position: absolute; border-radius: 50%; opacity: 0.1; }
    .circle-1 { width: 600px; height: 600px; background: #e94560; top: -200px; right: -200px; }
    .circle-2 { width: 400px; height: 400px; background: #0f3460; bottom: -100px; left: -100px; }
    .circle-3 { width: 200px; height: 200px; background: #f39c12; top: 400px; left: 50px; }
    
    /* 顶部标签 */
    .badge { background: linear-gradient(135deg, #e94560, #ff6b6b); color: white; padding: 12px 32px; border-radius: 30px; font-size: 24px; font-weight: bold; margin-bottom: 60px; box-shadow: 0 10px 40px rgba(233, 69, 96, 0.4); }
    
    /* 主标题 */
    .title { font-size: 140px; font-weight: 900; color: white; text-align: center; line-height: 1.1; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .title .skill { color: #e94560; }
    
    /* 副标题 */
    .subtitle { font-size: 48px; color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 80px; font-weight: 300; }
    
    /* 分隔线 */
    .divider { width: 200px; height: 4px; background: linear-gradient(90deg, #e94560, #f39c12); border-radius: 2px; margin-bottom: 80px; }
    
    /* 6位导师 */
    .mentors { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 80px; max-width: 900px; }
    .mentor { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 16px 28px; border-radius: 25px; color: white; font-size: 26px; font-weight: 500; border: 1px solid rgba(255,255,255,0.2); }
    
    /* 数据亮点 */
    .stats { display: flex; justify-content: center; gap: 60px; margin-bottom: 80px; }
    .stat { text-align: center; }
    .stat-number { font-size: 72px; font-weight: 900; color: #e94560; }
    .stat-label { font-size: 24px; color: rgba(255,255,255,0.7); margin-top: 8px; }
    
    /* 底部安装命令 */
    .install { background: rgba(255,255,255,0.1); padding: 24px 48px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.3); margin-top: auto; }
    .install-text { font-size: 32px; color: rgba(255,255,255,0.9); font-family: 'SF Mono', Monaco, 'Courier New', monospace; }
    .install-text .cmd { color: #00d9ff; }
    
    /* Logo */
    .logo { position: absolute; bottom: 60px; right: 80px; font-size: 24px; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="container">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
    
    <div class="badge">⭐ AI 运营导师</div>
    
    <div class="title">X导师<span class="skill">.skill</span></div>
    <div class="subtitle">你的第一人工智能X运营导师</div>
    
    <div class="divider"></div>
    
    <div class="mentors">
      <div class="mentor">Nicolas Cole</div>
      <div class="mentor">Dickie Bush</div>
      <div class="mentor">Sahil Bloom</div>
      <div class="mentor">Justin Welsh</div>
      <div class="mentor">Dan Koe</div>
      <div class="mentor">Alex Hormozi</div>
    </div>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-number">6</div>
        <div class="stat-label">核心心智模型</div>
      </div>
      <div class="stat">
        <div class="stat-number">10</div>
        <div class="stat-label">决策启发式</div>
      </div>
      <div class="stat">
        <div class="stat-number">150x</div>
        <div class="stat-label">算法权重</div>
      </div>
    </div>
    
    <div class="install">
      <div class="install-text">npx skills add alchaincyf/x-mentor-skill</div>
    </div>
    
    <div class="logo">女娲.skill</div>
  </div>
</body>
</html>
