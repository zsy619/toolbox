<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfiniteTalk - 无限时长说话视频生成</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      overflow-x: hidden;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      padding: 40px 20px;
    }
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .content { position: relative; z-index: 1; max-width: 800px; }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      color: #60a5fa;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 64px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .tagline {
      font-size: 24px;
      color: #a1a1aa;
      margin-bottom: 32px;
    }
    .desc {
      font-size: 18px;
      color: #a1a1aa;
      line-height: 1.8;
      max-width: 600px;
      margin: 0 auto 40px;
    }
    .stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .stat {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #fbbf24;
    }
    .stat-label {
      font-size: 14px;
      color: #71717a;
      margin-top: 4px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 700px;
      margin: 0 auto 40px;
    }
    .feature {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
    }
    .feature-icon { font-size: 28px; margin-bottom: 12px; }
    .feature-title {
      font-size: 16px;
      font-weight: 600;
      color: #f0f0f5;
      margin-bottom: 8px;
    }
    .feature-desc { font-size: 14px; color: #71717a; line-height: 1.6; }
    .highlight-box {
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(167,139,250,0.15));
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 16px;
      padding: 24px;
      margin: 0 auto 40px;
      max-width: 600px;
    }
    .highlight-box p {
      font-size: 16px;
      color: #a1a1aa;
      margin: 0;
      line-height: 1.8;
    }
    .cta {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
      border: none;
    }
    .btn-primary:hover { background: #2563eb; }
    @media (max-width: 640px) {
      h1 { font-size: 42px; }
      .tagline { font-size: 18px; }
      .stats { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <canvas id="bg-canvas"></canvas>
    <div class="content">
      <div class="badge">🔥 6196 Stars · Wan2.1</div>
      <h1>InfiniteTalk</h1>
      <p class="tagline">无限时长说话视频生成</p>
      <p class="desc">
        稀疏帧视频配音框架<br>
        输入视频和音频，生成口型准确的新视频
      </p>
      <div class="stats">
        <div class="stat">
          <div class="stat-value">6196</div>
          <div class="stat-label">Stars</div>
        </div>
        <div class="stat">
          <div class="stat-value">∞</div>
          <div class="stat-label">无限时长</div>
        </div>
        <div class="stat">
          <div class="stat-value">480P/720P</div>
          <div class="stat-label">分辨率</div>
        </div>
      </div>
      <div class="features">
        <div class="feature">
          <div class="feature-icon">💬</div>
          <div class="feature-title">稀疏帧视频配音</div>
          <div class="feature-desc">口型+头部+身体+表情全同步</div>
        </div>
        <div class="feature">
          <div class="feature-icon">⏱️</div>
          <div class="feature-title">无限时长</div>
          <div class="feature-desc">打破几秒钟的限制</div>
        </div>
        <div class="feature">
          <div class="feature-icon">📸</div>
          <div class="feature-title">静态照片说话</div>
          <div class="feature-desc">照片+音频=说话视频</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🛡️</div>
          <div class="feature-title">高稳定性</div>
          <div class="feature-desc">身份一致，减少变形</div>
        </div>
      </div>
      <div class="highlight-box">
        <p>💡 基于 Wan2.1 基础模型<br>支持 Gradio + ComfyUI</p>
      </div>
      <div class="cta">
        <a href="https://github.com/MeiGen-AI/InfiniteTalk" class="btn btn-primary">GitHub</a>
        <a href="https://huggingface.co/MeiGen-AI/infiniteTalk" class="btn btn-primary">Hugging Face</a>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    const geometry = new THREE.BufferGeometry();
    const count = 200;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 10;
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ color: 0x3b82f6, size: 0.02 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);
    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
