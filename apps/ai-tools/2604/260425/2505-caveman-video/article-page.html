<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>caveman - 节省75% tokens的AI代码助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    .badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid #fbbf24;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      color: #fbbf24;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .meta { font-size: 14px; color: #71717a; }
    .hook {
      background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.15));
      border-left: 4px solid #fbbf24;
      padding: 20px 24px;
      margin-bottom: 40px;
      border-radius: 0 12px 12px 0;
    }
    .hook p {
      font-size: 18px;
      color: #a1a1aa;
      font-style: italic;
    }
    .section { margin-bottom: 40px; }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #f0f0f5;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #fbbf24;
      display: inline-block;
    }
    p {
      font-size: 16px;
      color: #a1a1aa;
      line-height: 1.9;
      margin-bottom: 16px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }
    .feature-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
    }
    .feature-icon { font-size: 24px; margin-bottom: 8px; }
    .feature-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f5;
      margin-bottom: 6px;
    }
    .feature-desc { font-size: 13px; color: #71717a; line-height: 1.6; }
    .highlight-box {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }
    .highlight-box p {
      font-size: 15px;
      color: #a1a1aa;
      margin: 0;
    }
    .footer {
      text-align: center;
      padding: 40px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: #71717a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">🪨 43684 Stars</div>
      <h1>caveman</h1>
      <p class="meta">节省 75% tokens 的 AI 代码助手</p>
    </header>

    <div class="hook">
      <p>why use many token when few do trick</p>
    </div>

    <section class="section">
      <h2>效果对比</h2>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-title">普通 AI</div>
          <div class="feature-desc">69 tokens</div>
        </div>
        <div class="feature-card">
          <div class="feature-title">caveman</div>
          <div class="feature-desc">19 tokens</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>强度级别</h2>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">🪶</div>
          <div class="feature-title">Lite</div>
          <div class="feature-desc">轻度压缩</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🪨</div>
          <div class="feature-title">Full</div>
          <div class="feature-desc">完全穴居人</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🔥</div>
          <div class="feature-title">Ultra</div>
          <div class="feature-desc">极度精简</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📜</div>
          <div class="feature-title">文言文</div>
          <div class="feature-desc">古文模式</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>核心优势</h2>
      <div class="highlight-box">
        <p>💡 Claude Code: `claude plugin install caveman@caveman`</p>
      </div>
    </section>

    <footer class="footer">
      <p>GitHub: <a href="https://github.com/JuliusBrussee/caveman" style="color:#fbbf24">JuliusBrussee/caveman</a></p>
      <p>43684 Stars · 开源项目</p>
    </footer>
  </div>
</body>
</html>
