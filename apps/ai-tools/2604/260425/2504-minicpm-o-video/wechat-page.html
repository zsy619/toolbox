<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>MiniCPM-o 端侧多模态大模型新标杆</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      font-size: 17px;
      line-height: 1.8;
      color: #333333;
      background: #FFFFFF;
      margin: 0;
      padding: 0;
    }
    .container { max-width: 677px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 30px 0 20px; border-bottom: 1px solid #E5E5E5; }
    .header-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin: 0 0 10px; line-height: 1.4; }
    .header-meta { font-size: 14px; color: #999999; }
    .hook { background: #EFF6FF; border-left: 4px solid #3B82F6; padding: 16px 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
    .hook-text { font-size: 18px; font-weight: 500; color: #1E40AF; margin: 0; }
    .section { margin: 24px 0; }
    .section-title { font-size: 20px; font-weight: 700; color: #1a1a1a; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #3B82F6; display: inline-block; }
    .section-title::before { content: "▶ "; color: #3B82F6; }
    p { margin: 12px 0; color: #333333; }
    .feature-grid { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    .feature-card { flex: 1 1 calc(50% - 6px); background: #F9FAFB; border: 1px solid #E5E5E5; border-radius: 8px; padding: 16px; }
    .feature-icon { font-size: 18px; margin-bottom: 6px; }
    .feature-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .feature-desc { font-size: 13px; color: #666666; margin: 4px 0 0; }
    .highlight-box { background: #EFF6FF; border-left: 4px solid #3B82F6; padding: 16px 20px; margin: 16px 0; border-radius: 0 8px 8px 0; text-align: center; }
    .highlight-box p { margin: 0; color: #1E40AF; font-size: 16px; font-weight: 600; }
    .footer { text-align: center; padding: 24px 0; border-top: 1px solid #E5E5E5; color: #999999; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">

        </div>
        <div class="feature-card">

          <div class="feature-desc">4B 参数，超越 GPT-4.1-mini</div>

        <div class="feature-card">

          <div class="feature-desc">中英双语实时交互</div>

    </section>

    <section class="section">
      <h2 class="section-title">相关链接</h2>
      <p>GitHub: OpenBMB/MiniCPM-o</p>
      <p>Hugging Face: openbmb/MiniCPM-o-4_5</p>

    <section class="section">
      <div class="highlight-box">
        <p>24389 Stars，开源项目！</p>
      </div>

</body>
</html>
