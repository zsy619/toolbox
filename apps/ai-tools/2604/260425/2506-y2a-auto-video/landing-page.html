<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2A-Auto - YouTube自动搬运到AcFun/bilibili</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #0a0a0f;
      color: #f0f0f5;
      overflow-x: hidden;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      text-align: center;
      padding: 40px 20px;
    }
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .content { position: relative; z-index: 1; max-width: 800px; }
    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      color: #3b82f6;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 64px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .tagline {
      font-size: 24px;
      color: #a1a1aa;
      margin-bottom: 32px;
    }
    .desc {
      font-size: 18px;
      color: #a1a1aa;
      line-height: 1.8;
      max-width: 600px;
      margin: 0 auto 40px;
    }
    .stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .stat {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
    }
    .stat-value { font-size: 32px; font-weight: 700; color: #3b82f6; }
    .stat-label { font-size: 14px; color: #71717a; margin-top: 4px; }
    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .flow-step {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      color: #60a5fa;
    }
    .flow-arrow { color: #71717a; font-size: 20px; }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 700px;
      margin: 0 auto 40px;
    }
    .feature {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
    }
    .feature-icon { font-size: 28px; margin-bottom: 12px; }
    .feature-title { font-size: 16px; font-weight: 600; color: #f0f0f5; margin-bottom: 8px; }
    .feature-desc { font-size: 14px; color: #71717a; line-height: 1.6; }
    .cta { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: white; border: none; }
    .btn-primary:hover { background: #2563eb; }
    @media (max-width: 640px) {
      h1 { font-size: 42px; }
      .tagline { font-size: 18px; }
      .stats { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <canvas id="bg-canvas"></canvas>
    <div class="content">
      <div class="badge">📺 265 Stars</div>
      <h1>Y2A-Auto</h1>
      <p class="tagline">YouTube 自动搬运到 AcFun / bilibili</p>
      <p class="desc">
        全流程自动化工具<br>
        下载 → ASR → 字幕 → 翻译 → 审核 → 上传
      </p>
      <div class="stats">
        <div class="stat"><div class="stat-value">6</div><div class="stat-label">支持平台</div></div>
        <div class="stat"><div class="stat-value">AI</div><div class="stat-label">智能处理</div></div>
        <div class="stat"><div class="stat-value">Docker</div><div class="stat-label">一键部署</div></div>
      </div>
      <div class="flow">
        <div class="flow-step">下载</div><div class="flow-arrow">→</div>
        <div class="flow-step">ASR</div><div class="flow-arrow">→</div>
        <div class="flow-step">字幕</div><div class="flow-arrow">→</div>
        <div class="flow-step">翻译</div><div class="flow-arrow">→</div>
        <div class="flow-step">审核</div><div class="flow-arrow">→</div>
        <div class="flow-step">上传</div>
      </div>
      <div class="features">
        <div class="feature">
          <div class="feature-icon">🎙️</div>
          <div class="feature-title">ASR 语音识别</div>
          <div class="feature-desc">Whisper / Voxtral / FireRedASR2S</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🔤</div>
          <div class="feature-title">AI 字幕翻译</div>
          <div class="feature-desc">多语言翻译 + 质检</div>
        </div>
        <div class="feature">
          <div class="feature-icon">🛡️</div>
          <div class="feature-title">内容审核</div>
          <div class="feature-desc">阿里云 Green 安全检测</div>
        </div>
        <div class="feature">
          <div class="feature-icon">📊</div>
          <div class="feature-title">Web 管理后台</div>
          <div class="feature-desc">可视化任务管理</div>
        </div>
      </div>
      <div class="cta">
        <a href="https://github.com/fqscfqj/Y2A-Auto" class="btn btn-primary">GitHub</a>
      </div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    const geometry = new THREE.BufferGeometry();
    const count = 200;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 10;
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ color: 0x3b82f6, size: 0.02 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);
    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
