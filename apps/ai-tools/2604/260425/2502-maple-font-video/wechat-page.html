<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maple Font 程序员的专属字体</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      font-size: 17px;
      line-height: 1.8;
      color: #333333;
      background: #FFFFFF;
      margin: 0;
      padding: 0;
    }
    .container { max-width: 677px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 30px 0 20px; border-bottom: 1px solid #E5E5E5; }
    .header-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin: 0 0 10px; line-height: 1.4; }
    .header-meta { font-size: 14px; color: #999999; }
    .hook { background: #EFF6FF; border-left: 4px solid #5F7FFF; padding: 16px 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
    .hook-text { font-size: 18px; font-weight: 500; color: #3B51E0; margin: 0; }
    .section { margin: 24px 0; }
    .section-title { font-size: 20px; font-weight: 700; color: #1a1a1a; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 2px solid #5F7FFF; display: inline-block; }
    .section-title::before { content: "▶ "; color: #5F7FFF; }
    p { margin: 12px 0; color: #333333; }
    .feature-grid { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
    .feature-card { flex: 1 1 calc(50% - 6px); background: #F9FAFB; border: 1px solid #E5E5E5; border-radius: 8px; padding: 16px; }
    .feature-icon { font-size: 18px; margin-bottom: 6px; }
    .feature-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .feature-desc { font-size: 13px; color: #666666; margin: 4px 0 0; }
    .highlight-box { background: #EFF6FF; border-left: 4px solid #5F7FFF; padding: 16px 20px; margin: 16px 0; border-radius: 0 8px 8px 0; text-align: center; }
    .highlight-box p { margin: 0; color: #3B51E0; font-size: 16px; font-weight: 600; }
    .footer { text-align: center; padding: 24px 0; border-top: 1px solid #E5E5E5; color: #999999; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header-title">Maple Font 程序员的专属字体</h1>
      <div class="header-meta">作者：元曜科技 · 2026-04-23</div>
    </header>

    <div class="hook">
      <p class="hook-text">25390 Stars 的开源等宽字体</p>
    </div>

    <section class="section">
      <h2 class="section-title">为什么程序员都在用？</h2>
      <div class="feature-grid">
        <div class="feature-card">
          <div class="feature-icon">🎨</div>
          <div class="feature-name">圆角设计</div>
          <div class="feature-desc">视觉更柔和</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🤙🏻</div>
          <div class="feature-name">连字支持</div>
          <div class="feature-desc">代码更美观</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📦</div>
          <div class="feature-name">小巧体积</div>
          <div class="feature-desc">加载更快速</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✨</div>
          <div class="feature-name">渲染一流</div>
          <div class="feature-desc">Fira Code 级</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">安装方式</h2>
      <p>macOS：`brew install --cask font-maple`</p>
      <p>Arch Linux：`paru -S ttf-maple`</p>
      <p>其他平台：GitHub Releases 下载</p>
    </section>

    <section class="section">
      <div class="highlight-box">
        <p>GitHub: subframe7536/maple-font · 25390 Stars</p>
      </div>
    </section>

    <footer class="footer">
      <p>视频号：元曜科技</p>
    </footer>
  </div>
</body>
</html>
