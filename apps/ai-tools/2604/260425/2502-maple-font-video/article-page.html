<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maple Font - 圆角等宽字体的开源新选择</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #1a1a2e;
      color: #f0f0f5;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    .badge {
      display: inline-block;
      background: rgba(95, 127, 255, 0.2);
      border: 1px solid #5F7FFF;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      color: #8BA4FF;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #5F7FFF, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .meta { font-size: 14px; color: #71717a; }
    .hook {
      background: linear-gradient(135deg, rgba(95,127,255,0.15), rgba(167,139,250,0.15));
      border-left: 4px solid #5F7FFF;
      padding: 20px 24px;
      margin-bottom: 40px;
      border-radius: 0 12px 12px 0;
    }
    .hook p {
      font-size: 18px;
      color: #a1a1aa;
      font-style: italic;
    }
    .section { margin-bottom: 40px; }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #f0f0f5;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #5F7FFF;
      display: inline-block;
    }
    p {
      font-size: 16px;
      color: #a1a1aa;
      line-height: 1.9;
      margin-bottom: 16px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }
    .feature-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
    }
    .feature-icon { font-size: 24px; margin-bottom: 8px; }
    .feature-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f5;
      margin-bottom: 6px;
    }
    .feature-desc { font-size: 13px; color: #71717a; line-height: 1.6; }
    .highlight-box {
      background: rgba(95,127,255,0.1);
      border: 1px solid rgba(95,127,255,0.3);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }
    .highlight-box p {
      font-size: 15px;
      color: #a1a1aa;
      margin: 0;
    }
    .footer {
      text-align: center;
      padding: 40px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      color: #71717a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">🔥 25390 Stars · Open Source</div>
      <h1>Maple Font</h1>
      <p class="meta">圆角等宽字体的开源新选择</p>
    </header>

    <div class="hook">
      <p>专为 IDE 和终端设计的开源等宽字体</p>
    </div>

    <section class="section">
      <h2>核心特点</h2>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">🎨</div>
          <div class="feature-title">全新造型</div>
          <div class="feature-desc">重新设计符号外观</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🤙🏻</div>
          <div class="feature-title">更多连字</div>
          <div class="feature-desc">支持多种连字组合</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📦</div>
          <div class="feature-title">小巧体积</div>
          <div class="feature-desc">精简字体文件</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✨</div>
          <div class="feature-title">优秀渲染</div>
          <div class="feature-desc">Fira Code Retina 级</div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>安装方式</h2>
      <div class="highlight-box">
        <p>💡 macOS: brew install --cask font-maple<br>Arch: paru -S ttf-maple</p>
      </div>
    </section>

    <footer class="footer">
      <p>GitHub: <a href="https://github.com/subframe7536/maple-font" style="color:#5F7FFF">subframe7536/maple-font</a></p>
      <p>25390 Stars · 开源项目</p>
    </footer>
  </div>
</body>
</html>
