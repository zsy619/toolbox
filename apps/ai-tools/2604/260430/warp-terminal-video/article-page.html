<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warp Terminal - AI 开发环境</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      background: #0D0D1A;
      color: #E0E0E0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 420px; margin: 0 auto; }
    .header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 1px solid #1A1A3A;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 20px;
      color: #00FFFF;
      text-shadow: 0 0 20px #00FFFF40;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .header .subtitle { font-size: 14px; color: #8888AA; }
    .section {
      background: #12121F;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #1A1A3A;
    }
    .section-title {
      font-size: 16px;
      color: #00FFFF;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #1A1A3A;
    }
    .feature-item:last-child { border-bottom: none; }
    .feature-icon { font-size: 18px; flex-shrink: 0; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .stat-card {
      background: #0D0D1A;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      border: 1px solid #1A1A3A;
    }
    .stat-value { font-size: 16px; color: #00FFFF; font-weight: bold; }
    .stat-label { font-size: 11px; color: #8888AA; margin-top: 4px; }
    .footer { text-align: center; padding: 24px 0; color: #8888AA; font-size: 12px; }
    .footer a { color: #00FFFF; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Agentic Development Environment</h1>
      <p class="subtitle">终端里的 AI 开发环境</p>
    </div>

    <div class="section">
      <div class="section-title">🤖 核心特性</div>
      <div class="feature-item"><span class="feature-icon">🤖</span><span>内置编码 Agent</span></div>
      <div class="feature-item"><span class="feature-icon">🔗</span><span>多 Agent 支持</span></div>
      <div class="feature-item"><span class="feature-icon">🌐</span><span>完全开源</span></div>
      <div class="feature-item"><span class="feature-icon">💻</span><span>跨平台支持</span></div>
    </div>

    <div class="section">
      <div class="section-title">🔗 多 Agent 集成</div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value">Claude Code</div><div class="stat-label">Anthropic</div></div>
        <div class="stat-card"><div class="stat-value">Codex</div><div class="stat-label">OpenAI</div></div>
        <div class="stat-card"><div class="stat-value">Gemini CLI</div><div class="stat-label">Google</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📋 开源透明</div>
      <div class="feature-item"><span class="feature-icon">📋</span><span>UI 框架：MIT 许可</span></div>
      <div class="feature-item"><span class="feature-icon">⚙️</span><span>后端代码：AGPL v3</span></div>
      <div class="feature-item"><span class="feature-icon">📦</span><span>客户端代码完全开源</span></div>
    </div>

    <div class="section">
      <div class="section-title">💻 快速开始</div>
      <div class="feature-item"><span class="feature-icon">🌐</span><span>warp.dev/download</span></div>
    </div>

    <div class="footer">
      <p>来源：<a href="https://github.com/warpdotdev/warp">GitHub</a></p>
    </div>
  </div>
</body>
</html>
