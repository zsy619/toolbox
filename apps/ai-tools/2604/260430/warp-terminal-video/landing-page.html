<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warp Terminal - AI 开发环境</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .neon-text { text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF; }
    .neon-border { box-shadow: 0 0 20px #00FFFF; }
    .cyber-grid { background-image: linear-gradient(#1A1A3A 1px, transparent 1px), linear-gradient(90deg, #1A1A3A 1px, transparent 1px); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen cyber-grid">
  <div class="max-w-lg mx-auto px-4 py-8">
    <!-- Hero -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-cyan-400 neon-text mb-4">🤖 Agentic Development Environment</h1>
      <p class="text-gray-400">终端里的 AI 开发环境</p>
    </div>

    <!-- Features -->
    <div class="bg-gray-900 rounded-xl p-6 border border-cyan-900 mb-6">
      <div class="text-center mb-4">
        <h2 class="text-xl font-bold text-white">核心特性</h2>
      </div>
      <div class="space-y-3">
        <div class="flex items-center gap-3"><span>🤖</span><span>内置编码 Agent</span></div>
        <div class="flex items-center gap-3"><span>🔗</span><span>多 Agent 支持</span></div>
        <div class="flex items-center gap-3"><span>🌐</span><span>完全开源</span></div>
        <div class="flex items-center gap-3"><span>💻</span><span>跨平台支持</span></div>
      </div>
    </div>

    <!-- Agents -->
    <div class="bg-gray-900 rounded-xl p-6 border border-purple-900 mb-6">
      <div class="text-center mb-4">
        <h2 class="text-xl font-bold text-purple-400">多 Agent 集成</h2>
      </div>
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-gray-800 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">📝</div>
          <div class="text-sm text-white">Claude Code</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">🤖</div>
          <div class="text-sm text-white">Codex</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4 text-center">
          <div class="text-2xl mb-2">💎</div>
          <div class="text-sm text-white">Gemini CLI</div>
        </div>
      </div>
    </div>

    <!-- Open Source -->
    <div class="bg-gray-900 rounded-xl p-6 border border-green-900 mb-6">
      <div class="text-center mb-4">
        <h2 class="text-xl font-bold text-green-400">开源透明</h2>
      </div>
      <div class="space-y-3">
        <div class="flex items-center gap-3"><span>📋</span><span>UI 框架：MIT 许可</span></div>
        <div class="flex items-center gap-3"><span>⚙️</span><span>后端代码：AGPL v3</span></div>
        <div class="flex items-center gap-3"><span>📦</span><span>客户端代码完全开源</span></div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="https://warp.dev/download" target="_blank" class="inline-block bg-cyan-500 hover:bg-cyan-600 text-gray-900 font-bold py-3 px-8 rounded-full neon-border">
        立即下载 →
      </a>
    </div>

    <div class="text-center mt-8 text-gray-500 text-sm">
      <p>Source: <a href="https://github.com/warpdotdev/warp" class="text-cyan-400 hover:underline">GitHub</a></p>
    </div>
  </div>
</body>
</html>
