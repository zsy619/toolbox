<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Cookbook - 快速搭建AI系统手册</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0D0221 0%, #1a0a2e 50%, #0D0221 100%);
      min-height: 100vh;
      color: #fff;
    }
    .container { max-width: 540px; margin: 0 auto; padding: 20px; }
    .hero {
      text-align: center;
      padding: 60px 0 40px;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #00FFFF, #FF00FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .title {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #00FFFF, #FF00FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .subtitle {
      color: #8888AA;
      font-size: 18px;
      line-height: 1.6;
    }
    .author {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      padding: 12px 24px;
      border-radius: 50px;
      margin-top: 24px;
    }
    .author-icon { font-size: 20px; }
    .author-name {
      font-size: 18px;
      font-weight: 600;
      color: #00FFFF;
    }
    .features { padding: 40px 0; }
    .feature {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: all 0.3s;
    }
    .feature:hover {
      border-color: #00FFFF;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
    }
    .feature-title {
      font-size: 20px;
      font-weight: 700;
      color: #00FFFF;
      margin-bottom: 8px;
    }
    .feature-desc { color: #8888AA; font-size: 15px; line-height: 1.6; }
    .cta {
      text-align: center;
      padding: 40px 0;
    }
    .cta-btn {
      display: inline-block;
      background: linear-gradient(135deg, #00FFFF, #9D00FF);
      color: #0D0221;
      font-size: 18px;
      font-weight: 700;
      padding: 16px 48px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .cta-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0,255,255,0.5);
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
    }
    .link {
      color: #8888AA;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .link:hover { color: #00FFFF; }
    .footer {
      text-align: center;
      padding: 40px 0;
      color: #8888AA;
      font-size: 14px;
    }
    @media (max-width: 480px) {
      .title { font-size: 36px; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hero -->
    <div class="hero">
      <div class="badge">🔥 GitHub Trending</div>
      <h1 class="title">AI Cookbook</h1>
      <p class="subtitle">快速搭建 AI 系统手册</p>
      <div class="author">
        <span class="author-icon">📺</span>
        <span class="author-name">Dave · 25.5万+粉丝</span>
      </div>
    </div>

    <!-- Features -->
    <div class="features">
      <div class="feature">
        <div class="feature-title">📋 真实项目级代码</div>
        <div class="feature-desc">不是玩具代码，是 Dave 在真实项目中验证过的代码</div>
      </div>
      <div class="feature">
        <div class="feature-title">📋 可复制粘贴</div>
        <div class="feature-desc">代码经过实战验证，可以直接集成到你的项目中</div>
      </div>
      <div class="feature">
        <div class="feature-title">🚀 立刻用到项目</div>
        <div class="feature-desc">不是纸上谈兵，是真实可用的解决方案</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta">
      <a href="https://github.com/daveebbelaar/ai-cookbook" class="cta-btn">立即体验 →</a>
      <div class="links">
        <a href="https://github.com/daveebbelaar/ai-cookbook" class="link">GitHub</a>
        <a href="https://www.youtube.com/@daveebbelaar" class="link">YouTube</a>
        <a href="https://datalumina.com" class="link">官网</a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>完全开源 · 完全免费</p>
      <p style="margin-top:8px;">Made with ❤️ by Dave (Datalumina)</p>
    </div>
  </div>
</body>
</html>
