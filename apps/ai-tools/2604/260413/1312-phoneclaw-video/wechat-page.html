<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhoneClaw - iPhone 本地运行 Gemma 4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #FFFFFF;
      color: #333333;
      line-height: 1.8;
      max-width: 100%;
      overflow-x: hidden;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); margin: 0 -20px; }
    .header h1 { color: #3B82F6; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
    .header .subtitle { color: #94A3B8; font-size: 14px; }
    .cover-img { width: 100%; border-radius: 12px; margin: 30px 0; }
    .section { margin: 30px 0; }
    .section-title { font-size: 20px; font-weight: bold; color: #1A1A1A; margin-bottom: 15px; padding-left: 15px; border-left: 4px solid #3B82F6; }
    .section p { font-size: 16px; color: #4A4A4A; text-align: justify; }
    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
    .feature-card { background: #F0F9FF; border-radius: 12px; padding: 20px; text-align: center; }
    .feature-icon { font-size: 28px; margin-bottom: 8px; }
    .feature-title { color: #3B82F6; font-weight: bold; font-size: 14px; }
    .highlight-box { background: #F0FDF4; border-radius: 12px; padding: 20px; margin: 20px 0; }
    .highlight-title { color: #10B981; font-weight: bold; margin-bottom: 8px; }
    .footer { text-align: center; padding: 40px 20px; color: #999999; font-size: 12px; }
    .footer-url { font-family: monospace; color: #3B82F6; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>iPhone 本地跑 Gemma 4 了！</h1>
      <p class="subtitle">20 tokens/s 零联网</p>
    </div>

    <img src="assets/cover.png" alt="PhoneClaw 封面图" class="cover-img">

    <div class="section">
      <div class="section-title">项目简介</div>
      <p>iPhone 上完全本地跑通 Google Gemma 4 了！PhoneClaw 实现离线运行，速度最高 20 tokens/s。</p>
    </div>

    <div class="section">
      <div class="section-title">核心亮点</div>
      <div class="feature-grid">
        <div class="feature-card">
          <div class="feature-icon">⚡</div>
          <div class="feature-title">20 tokens/s</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🔒</div>
          <div class="feature-title">零联网</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🤖</div>
          <div class="feature-title">Agent 能力</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">隐私优先</div>
      <p>所有数据都在本地处理，不上传任何服务器。</p>
    </div>

    <div class="highlight-box">
      <div class="highlight-title">移动端本地 AI 新时代</div>
      <p>MIT 开源协议</p>
    </div>

    <div class="footer">
      <p>PhoneClaw - iPhone 本地运行 Gemma 4</p>
      <p class="footer-url">github.com/phoneclaw</p>
    </div>
  </div>
</body>
</html>
