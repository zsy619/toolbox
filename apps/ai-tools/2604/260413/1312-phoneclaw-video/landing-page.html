<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneClaw - iPhone 本地运行 Gemma 4</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }
    .badge {
      background: rgba(59,130,246,0.2);
      color: #3B82F6;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 16px;
      display: inline-block;
      margin-bottom: 40px;
      border: 1px solid #3B82F6;
    }
    h1 {
      font-size: 70px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #3B82F6;
      text-shadow: 0 0 30px rgba(59,130,246,0.5);
      text-align: center;
    }
    .subtitle {
      font-size: 24px;
      color: #94A3B8;
      margin-bottom: 30px;
      text-align: center;
    }
    .divider {
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3B82F6, transparent);
      margin: 0 auto 50px;
    }
    .video-container {
      max-width: 400px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 2px solid rgba(59,130,246,0.3);
      margin-bottom: 50px;
    }
    .video-container video {
      width: 100%;
      display: block;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      max-width: 800px;
      width: 100%;
      margin-bottom: 50px;
    }
    .feature-card {
      background: rgba(59,130,246,0.08);
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
    }
    .feature-icon { font-size: 36px; margin-bottom: 15px; }
    .feature-title { font-size: 18px; color: #3B82F6; font-weight: bold; }
    .cta-section {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      margin-bottom: 50px;
      width: 100%;
      max-width: 600px;
    }
    .cta-section h2 { color: #10B981; font-size: 28px; margin-bottom: 15px; }
    .cta-section p { color: #94A3B8; font-size: 16px; }
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #64748B;
      font-size: 14px;
      border-top: 1px solid rgba(59,130,246,0.1);
    }
    .footer-url { color: #3B82F6; font-family: monospace; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="badge">📱 本地 AI</div>
    <h1>PhoneClaw</h1>
    <p class="subtitle">iPhone 本地运行 Gemma 4</p>
    <div class="divider"></div>
    
    <div class="video-container">
      <video controls poster="assets/cover.png">
        <source src="assets/phoneclaw_final_with_subtitles.mp4" type="video/mp4">
      </video>
    </div>
    
    <div class="features-grid">
      <div class="feature-card">
        <div class="feature-icon">⚡</div>
        <div class="feature-title">20 tokens/s</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🔒</div>
        <div class="feature-title">零联网</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🤖</div>
        <div class="feature-title">Agent 能力</div>
      </div>
    </div>
    
    <div class="cta-section">
      <h2>MIT 开源协议</h2>
      <p>移动端本地 AI 新时代</p>
    </div>
  </div>
  
  <div class="footer">
    <p>PhoneClaw - iPhone 本地运行 Gemma 4</p>
    <p class="footer-url">github.com/phoneclaw</p>
  </div>
</body>
</html>
