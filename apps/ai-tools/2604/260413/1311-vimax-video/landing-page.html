<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViMax - 香港大学 AI 视频生成框架</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }
    .badge {
      background: rgba(139,92,246,0.2);
      color: #8B5CF6;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 16px;
      display: inline-block;
      margin-bottom: 40px;
      border: 1px solid #8B5CF6;
    }
    h1 {
      font-size: 80px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #8B5CF6;
      text-shadow: 0 0 30px rgba(139,92,246,0.5);
      text-align: center;
    }
    .subtitle {
      font-size: 24px;
      color: #94A3B8;
      margin-bottom: 30px;
      text-align: center;
    }
    .divider {
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #8B5CF6, transparent);
      margin: 0 auto 50px;
    }
    .video-container {
      max-width: 400px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 2px solid rgba(139,92,246,0.3);
      margin-bottom: 50px;
    }
    .video-container video {
      width: 100%;
      display: block;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      max-width: 800px;
      width: 100%;
      margin-bottom: 50px;
    }
    .feature-card {
      background: rgba(139,92,246,0.08);
      border: 2px solid rgba(139,92,246,0.3);
      border-radius: 20px;
      padding: 30px 25px;
      text-align: center;
      transition: transform 0.3s;
    }
    .feature-card:hover {
      transform: translateY(-5px);
    }
    .feature-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }
    .feature-title {
      font-size: 22px;
      color: #8B5CF6;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .feature-desc {
      font-size: 16px;
      color: #94A3B8;
    }
    .cta-section {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      margin-bottom: 50px;
      width: 100%;
      max-width: 600px;
    }
    .cta-section h2 {
      color: #10B981;
      font-size: 28px;
      margin-bottom: 15px;
    }
    .cta-section p {
      color: #94A3B8;
      font-size: 16px;
    }
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #64748B;
      font-size: 14px;
      border-top: 1px solid rgba(139,92,246,0.1);
    }
    .footer-url {
      color: #8B5CF6;
      font-family: monospace;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="badge">🎬 AI 视频生成</div>
    
    <h1>ViMax</h1>
    <p class="subtitle">香港大学开源的多智能体视频框架</p>
    <div class="divider"></div>
    
    <div class="video-container">
      <video controls poster="assets/cover.png">
        <source src="assets/vimax_final_with_subtitles.mp4" type="video/mp4">
      </video>
    </div>
    
    <div class="features-grid">
      <div class="feature-card">
        <div class="feature-icon">💡</div>
        <div class="feature-title">Idea2Video</div>
        <div class="feature-desc">一句话生成视频</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📚</div>
        <div class="feature-title">Novel2Video</div>
        <div class="feature-desc">小说转视频</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🎬</div>
        <div class="feature-title">Script2Video</div>
        <div class="feature-desc">剧本转视频</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🎭</div>
        <div class="feature-title">AutoCameo</div>
        <div class="feature-desc">智能分镜生成</div>
      </div>
    </div>
    
    <div class="cta-section">
      <h2>MIT 开源协议 · GitHub 1.4k+ ⭐</h2>
      <p>多智能体协作 · 分钟级长视频 · 角色场景一致</p>
    </div>
  </div>
  
  <div class="footer">
    <p>ViMax - 香港大学数据科学实验室</p>
    <p class="footer-url">github.com/HKUDS/ViMax</p>
  </div>
</body>
</html>
