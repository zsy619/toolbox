<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medvi - AI 一人独角兽神话</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1a1a2e 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }
    .badge {
      background: rgba(251,191,36,0.2);
      color: #FBBF24;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 16px;
      display: inline-block;
      margin-bottom: 40px;
      border: 1px solid #FBBF24;
    }
    h1 {
      font-size: 80px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #FBBF24;
      text-shadow: 0 0 30px rgba(251,191,36,0.5);
      text-align: center;
    }
    .subtitle {
      font-size: 24px;
      color: #94A3B8;
      margin-bottom: 30px;
      text-align: center;
    }
    .divider {
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #FBBF24, transparent);
      margin: 0 auto 50px;
    }
    .video-container {
      max-width: 400px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 2px solid rgba(251,191,36,0.3);
      margin-bottom: 50px;
    }
    .video-container video {
      width: 100%;
      display: block;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 700px;
      width: 100%;
      margin-bottom: 50px;
    }
    .stat-card {
      background: rgba(251,191,36,0.08);
      border: 2px solid rgba(251,191,36,0.3);
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
    }
    .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #FBBF24;
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 16px;
      color: #94A3B8;
    }
    .warning-section {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      margin-bottom: 50px;
    }
    .warning-title {
      font-size: 24px;
      color: #EF4444;
      margin-bottom: 15px;
    }
    .warning-text {
      font-size: 16px;
      color: #94A3B8;
      line-height: 1.6;
    }
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: #64748B;
      font-size: 14px;
      border-top: 1px solid rgba(251,191,36,0.1);
    }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="badge">⚡ AI 创业神话</div>
    
    <h1>$401M</h1>
    <p class="subtitle">2万美元如何一年干出4亿美元</p>
    <div class="divider"></div>
    
    <div class="video-container">
      <video controls poster="assets/cover.png">
        <source src="assets/medvi_final_with_subtitles.mp4" type="video/mp4">
      </video>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">$20K</div>
        <div class="stat-label">启动资金</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">2人</div>
        <div class="stat-label">全职团队</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">25万</div>
        <div class="stat-label">客户数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">16.2%</div>
        <div class="stat-label">净利润率</div>
      </div>
    </div>
    
    <div class="warning-section">
      <div class="warning-title">⚠️ 警示</div>
      <div class="warning-text">
        神话背后也踩满了监管红线<br/>
        AI能放大效率，但不能替代合规
      </div>
    </div>
  </div>
  
  <div class="footer">
    <p>Medvi - AI 一人独角兽神话</p>
  </div>
</body>
</html>
