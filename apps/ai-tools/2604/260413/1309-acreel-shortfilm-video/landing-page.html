<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcReel - AI 短剧自动化制作工具</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .hero {
      padding: 80px 20px;
      text-align: center;
    }
    .badge {
      background: rgba(139,92,246,0.2);
      color: #8B5CF6;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 30px;
      border: 1px solid #8B5CF6;
    }
    h1 {
      font-size: 100px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #8B5CF6;
      text-shadow: 0 0 30px rgba(139,92,246,0.5);
      letter-spacing: -2px;
    }
    .subtitle {
      font-size: 28px;
      color: #94A3B8;
      margin-bottom: 40px;
    }
    .features {
      padding: 60px 20px;
    }
    .feature-card {
      background: rgba(139,92,246,0.08);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
      transition: transform 0.3s;
    }
    .feature-card:hover {
      transform: translateY(-5px);
    }
    .feature-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }
    .feature-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #8B5CF6;
    }
    .feature-desc {
      color: #94A3B8;
      font-size: 16px;
    }
    .pipeline {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 40px 0;
    }
    .pipeline-step {
      background: rgba(139,92,246,0.1);
      border: 2px solid #8B5CF6;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 18px;
      color: #F8FAFC;
    }
    .pipeline-arrow {
      display: flex;
      align-items: center;
      color: #8B5CF6;
      font-size: 24px;
    }
    .cta-section {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px;
      padding: 50px;
      text-align: center;
      margin: 40px 0;
    }
    .cta-btn {
      background: linear-gradient(135deg, #8B5CF6, #6366F1);
      color: white;
      padding: 16px 40px;
      border-radius: 30px;
      font-size: 18px;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }
    .video-container {
      max-width: 400px;
      margin: 40px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 2px solid rgba(139,92,246,0.3);
    }
    .video-container video {
      width: 100%;
      display: block;
    }
    .footer {
      text-align: center;
      padding: 40px 20px;
      color: #64748B;
      font-size: 14px;
    }
    .url {
      color: #8B5CF6;
      font-family: monospace;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="badge">🎬 AI 短剧</div>
      <h1>ArcReel</h1>
      <p class="subtitle">AI 短剧自动化制作工具</p>
      
      <div class="video-container">
        <video controls poster="assets/cover.png">
          <source src="assets/acreel_final_with_subtitles.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <div class="features">
      <h2 style="text-align: center; margin-bottom: 40px; color: #8B5CF6;">自动化流水线</h2>
      <div class="pipeline">
        <div class="pipeline-step">上传小说</div>
        <div class="pipeline-arrow">→</div>
        <div class="pipeline-step">剧本生成</div>
        <div class="pipeline-arrow">→</div>
        <div class="pipeline-step">角色设计</div>
        <div class="pipeline-arrow">→</div>
        <div class="pipeline-step">分镜绘制</div>
        <div class="pipeline-arrow">→</div>
        <div class="pipeline-step">视频片段</div>
        <div class="pipeline-arrow">→</div>
        <div class="pipeline-step">合成成片</div>
      </div>
    </div>

    <div class="features">
      <h2 style="text-align: center; margin-bottom: 40px; color: #8B5CF6;">核心能力</h2>
      <div class="row">
        <div class="col-md-4">
          <div class="feature-card" style="text-align: center;">
            <div class="feature-icon">🎭</div>
            <div class="feature-title">角色一致性</div>
            <div class="feature-desc">同一角色不同镜头长得一样</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="feature-card" style="text-align: center;">
            <div class="feature-icon">🔄</div>
            <div class="feature-title">多模型支持</div>
            <div class="feature-desc">Gemini / Grok / OpenAI 随时切换</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="feature-card" style="text-align: center;">
            <div class="feature-icon">✂️</div>
            <div class="feature-title">剪映导出</div>
            <div class="feature-desc">一键导出剪映草稿</div>
          </div>
        </div>
      </div>
    </div>

    <div class="cta-section">
      <h2>GitHub 开源免费</h2>
      <p style="font-size: 20px; color: #94A3B8; margin-top: 20px;">可通过 Docker 快速部署</p>
      <a href="#" class="cta-btn">查看 GitHub</a>
    </div>

    <div class="footer">
      <p>AI 短剧 · 从小说到成片</p>
      <p class="url">github.com/acreel</p>
      <p style="margin-top: 20px;">视频演示 · AI 短剧自动化制作工具</p>
    </div>
  </div>
</body>
</html>
