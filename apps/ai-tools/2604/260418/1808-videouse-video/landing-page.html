<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Use - Claude Code 专业视频编辑</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #EF4444; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(239,68,68,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(239,68,68,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .stars-badge { display: inline-block; background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--primary); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; color: #fff; margin-bottom: 1rem; letter-spacing: -2px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .cta-section { padding: 4rem 2rem; text-align: center; background: var(--card); }
    .code-block { background: #000; border-radius: 12px; padding: 1rem 1.5rem; font-family: 'SF Mono', Monaco, monospace; font-size: 1rem; color: var(--primary); display: inline-block; margin-top: 1rem; border: 1px solid rgba(239,68,68,0.3); }
    @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="stars-badge">🎬 Claude Code × 专业视频编辑</div>
      <h1>Video Use</h1>
      <p class="subtitle">Browser Use 开源 · 100%免费 · 告别付费编辑软件</p>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">🎤</div>
          <div class="feature-name">说话输出</div>
          <div class="feature-desc">对着镜头说话，直接输出最终视频</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✂️</div>
          <div class="feature-name">自动剪辑</div>
          <div class="feature-desc">自动剪掉填充词、调色、添加字幕</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎬</div>
          <div class="feature-name">动画效果</div>
          <div class="feature-desc">集成 Manim 和 Remotion 动画</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✅</div>
          <div class="feature-name">自我评估</div>
          <div class="feature-desc">渲染前进行质量评估</div>
        </div>
      </div>
    </div>
  </section>
  <section class="cta-section">
    <div style="font-size:1.25rem;font-weight:700;margin-bottom:1rem;">立即体验</div>
    <div class="code-block">npx @browser-use/video-use</div>
    <div style="margin-top:2rem;">
      <a href="https://github.com/browser-use/video-use" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">GitHub →</a>
    </div>
  </section>
</body>
</html>
