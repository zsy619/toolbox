<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Comic Builder</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0F172A; color: #F8FAFC; font-family: 'PingFang SC', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #8B5CF6, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-20 text-center">
    <div class="text-6xl mb-6">🎭</div>
    <h1 class="text-5xl font-bold mb-4 gradient-text">AI Comic Builder</h1>
    <p class="text-xl text-gray-400 mb-8">AI 漫剧生成器 · 全流程打通</p>
  </div>
  <div class="container mx-auto px-6 py-16">
    <h2 class="text-3xl font-bold text-center mb-12">流水线</h2>
    <div class="grid md:grid-cols-4 gap-4">
      <div class="bg-purple-900/30 rounded-xl p-4 text-center">📝<br/>剧本导入</div>
      <div class="bg-purple-900/30 rounded-xl p-4 text-center">👥<br/>角色提取</div>
      <div class="bg-purple-900/30 rounded-xl p-4 text-center">🎬<br/>智能分镜</div>
      <div class="bg-pink-900/30 rounded-xl p-4 text-center">🎥<br/>视频生成</div>
    </div>
  </div>
</body>
</html>
