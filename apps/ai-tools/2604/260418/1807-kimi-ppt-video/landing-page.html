<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi AI + PPT</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0F172A; color: #F8FAFC; font-family: 'PingFang SC', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #10B981, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-20 text-center">
    <div class="text-6xl mb-6">📊</div>
    <h1 class="text-5xl font-bold mb-4 gradient-text">Kimi AI + PPT</h1>
    <p class="text-xl text-gray-400 mb-8">Excel 变麦肯锡级报告</p>
  </div>
  <div class="container mx-auto px-6 py-16">
    <h2 class="text-3xl font-bold text-center mb-12">秘诀</h2>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="bg-emerald-900/30 rounded-xl p-6 text-center">
        <div class="text-3xl mb-4">C</div>
        <div class="text-xl font-bold">Context</div>
        <div class="text-gray-400">背景</div>
      </div>
      <div class="bg-blue-900/30 rounded-xl p-6 text-center">
        <div class="text-3xl mb-4">D</div>
        <div class="text-xl font-bold">Data</div>
        <div class="text-gray-400">数据</div>
      </div>
      <div class="bg-emerald-900/30 rounded-xl p-6 text-center">
        <div class="text-3xl mb-4">V</div>
        <div class="text-xl font-bold">Visual</div>
        <div class="text-gray-400">视觉参考</div>
      </div>
    </div>
  </div>
</body>
</html>
