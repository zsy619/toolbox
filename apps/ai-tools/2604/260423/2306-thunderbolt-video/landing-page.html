<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunderbolt - 跨平台 AI 客户端</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #06B6D4, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="text-white">
    <section class="min-h-screen flex items-center justify-center px-6 py-20 text-center">
        <div>
            <div class="text-6xl mb-8">⚡</div>
            <h1 class="text-5xl font-black mb-6"><span class="gradient-text">Thunderbolt</span></h1>
            <p class="text-xl text-gray-300 mb-4">跨平台 AI 客户端</p>
            <p class="text-lg text-gray-400">Thunderbird 团队出品</p>
        </div>
    </section>
    <section class="py-20 px-6">
        <div class="max-w-4xl mx-auto text-center mb-12">
            <h2 class="text-3xl font-bold">核心亮点</h2>
        </div>
        <div class="grid md:grid-cols-3 gap-6">
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">📱</div><h3 class="font-bold">全平台支持</h3><p class="text-gray-400 text-sm">Web/iOS/Android/Mac/Linux/Windows</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🤖</div><h3 class="font-bold">灵活接入</h3><p class="text-gray-400 text-sm">云端API + Ollama本地模型</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🐳</div><h3 class="font-bold">自建后端</h3><p class="text-gray-400 text-sm">Docker/Kubernetes部署</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🔐</div><h3 class="font-bold">数据自控</h3><p class="text-gray-400 text-sm">数据存放在自己的服务器</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🦅</div><h3 class="font-bold">Thunderbird</h3><p class="text-gray-400 text-sm">老牌邮件客户端团队</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🔒</div><h3 class="font-bold">隐私自由</h3><p class="text-gray-400 text-sm">数据隐私和模型自由</p></div>
        </div>
    </section>
    <section class="py-20 px-6 text-center bg-black/30">
        <p class="text-xl text-gray-400 mb-8">适合对数据隐私有极高要求的你</p>
        <a href="https://github.com/thunderbird/thunderbolt" class="inline-block px-10 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-full font-bold">Try Thunderbolt</a>
    </section>
    <footer class="py-12 px-6 border-t border-gray-800 text-center text-gray-500 text-sm">
        <p>Thunderbolt - 跨平台 AI 客户端 | Thunderbird 团队</p>
    </footer>
</body>
</html>
