<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDataLoader PDF - 100页/秒 PDF转Markdown</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #06B6D4, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="text-white">
    <section class="min-h-screen flex items-center justify-center px-6 py-20 text-center">
        <div>
            <div class="text-6xl mb-8">📄</div>
            <h1 class="text-5xl font-black mb-6"><span class="gradient-text">OpenDataLoader PDF</span></h1>
            <p class="text-xl text-gray-300 mb-4">100页/秒 🤯</p>
            <p class="text-lg text-gray-400">PDF 转 Markdown 新神器</p>
        </div>
    </section>
    <section class="py-20 px-6">
        <div class="max-w-4xl mx-auto text-center mb-12">
            <h2 class="text-3xl font-bold">核心亮点</h2>
        </div>
        <div class="grid md:grid-cols-3 gap-6">
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">⚡</div><h3 class="font-bold">100页/秒</h3><p class="text-gray-400 text-sm">极速转换</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">📊</div><h3 class="font-bold">表格完美提取</h3><p class="text-gray-400 text-sm">Benchmark第一</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🔧</div><h3 class="font-bold">破损布局自动修复</h3><p class="text-gray-400 text-sm">结构化输出</p></div>
        </div>
    </section>
    <section class="py-20 px-6 text-center bg-black/30">
        <p class="text-xl text-gray-400 mb-4">不需要 GPU</p>

        <p class="text-xl text-gray-400 mb-8">一夜之间消除 90% 的手动数据清理</p>
        <a href="https://github.com/opendataloader-project/opendataloader-pdf" class="inline-block px-10 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-full font-bold">Star on GitHub</a>
    </section>
    <footer class="py-12 px-6 border-t border-gray-800 text-center text-gray-500 text-sm">
        <p>OpenDataLoader PDF - PDF 转 Markdown 新神器</p>
    </footer>

</html>
