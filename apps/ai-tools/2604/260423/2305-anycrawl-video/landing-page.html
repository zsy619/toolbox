<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyCrawl - 高性能爬虫神器</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #06B6D4, #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(6, 182, 212, 0.2); }
    </style>
</head>
<body class="text-white">
    <section class="min-h-screen flex items-center justify-center px-6 py-20 text-center">
        <div>
            <div class="text-6xl mb-8">🕷️</div>
            <h1 class="text-5xl font-black mb-6"><span class="gradient-text">AnyCrawl</span></h1>
            <p class="text-xl text-gray-300 mb-4">高性能爬虫神器</p>
            <p class="text-lg text-gray-400">三引擎打包，采集更省心</p>
        </div>
    </section>
    <section class="py-20 px-6">
        <div class="max-w-4xl mx-auto text-center mb-12">
            <h2 class="text-3xl font-bold">核心能力</h2>
        </div>
        <div class="grid md:grid-cols-3 gap-6">
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🔄</div><h3 class="font-bold">多引擎切换</h3><p class="text-gray-400 text-sm">静态解析与JS渲染按需切换</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🔍</div><h3 class="font-bold">SERP批量抓取</h3><p class="text-gray-400 text-sm">批量采集Google等搜索引擎</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🏗️</div><h3 class="font-bold">站点级爬虫</h3><p class="text-gray-400 text-sm">单页到整站智能遍历</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🚀</div><h3 class="font-bold">高性能并发</h3><p class="text-gray-400 text-sm">多线程/多进程架构</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🌐</div><h3 class="font-bold">代理支持</h3><p class="text-gray-400 text-sm">内置HTTP/SOCKS代理</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🤖</div><h3 class="font-bold">面向LLM</h3><p class="text-gray-400 text-sm">大模型数据处理优化</p></div>
        </div>
    </section>
    <section class="py-20 px-6 text-center bg-black/30">
        <p class="text-xl text-gray-400 mb-8">Docker一键部署 | 配置轻量 | 上手快</p>
        <a href="https://github.com/any4ai/anycrawl" class="inline-block px-10 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-full font-bold">Try AnyCrawl</a>
    </section>
    <footer class="py-12 px-6 border-t border-gray-800 text-center text-gray-500 text-sm">
        <p>AnyCrawl - 高性能爬虫神器 | GitHub: any4ai/anycrawl</p>
    </footer>
</body>
</html>
