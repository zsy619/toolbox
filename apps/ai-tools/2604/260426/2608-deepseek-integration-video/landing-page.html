<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek 实用集成 - 将大模型能力接入各类软件</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0F172A; font-family: system-ui, -apple-system, sans-serif; }
    .gradient-text { background: linear-gradient(90deg, #2563EB, #22D3EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(37, 99, 235, 0.3); }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="container mx-auto px-4 py-12 max-w-2xl">
    <!-- Hero Section -->
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold mb-4">DeepSeek <span class="gradient-text">实用集成</span></h1>
      <p class="text-xl text-gray-400">将大模型能力接入各类软件</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-4 mb-12">
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl font-bold text-blue-500">60+</div>
        <div class="text-gray-400 text-sm">精选项目</div>
      </div>
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl font-bold text-cyan-400">16</div>
        <div class="text-gray-400 text-sm">集成类别</div>
      </div>
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl font-bold text-emerald-400">100%</div>
        <div class="text-gray-400 text-sm">开源免费</div>
      </div>
    </div>

    <!-- Categories -->
    <div class="mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">涵盖类别</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="card rounded-lg p-4 flex items-center gap-3">
          <span class="text-2xl">💻</span>
          <span>AI 客户端</span>
        </div>
        <div class="card rounded-lg p-4 flex items-center gap-3">
          <span class="text-2xl">🔗</span>
          <span>AI Agent 框架</span>
        </div>
        <div class="card rounded-lg p-4 flex items-center gap-3">
          <span class="text-2xl">📚</span>
          <span>RAG 框架</span>
        </div>
        <div class="card rounded-lg p-4 flex items-center gap-3">
          <span class="text-2xl">🔒</span>
          <span>安全工具</span>
        </div>
        <div class="card rounded-lg p-4 flex items-center gap-3">
          <span class="text-2xl">🛠️</span>
          <span>开发插件</span>
        </div>
        <div class="card rounded-lg p-4 flex items-center gap-3">
          <span class="text-2xl">📦</span>
          <span>更多集成</span>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="https://platform.deepseek.com/" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl text-xl">
        访问 DeepSeek 开放平台
      </a>
      <p class="text-gray-500 mt-4 text-sm">获取 API Key，开始集成</p>
    </div>

    <!-- Footer -->
    <div class="mt-16 text-center text-gray-600 text-sm">
      <p>来源：<a href="https://github.com/deepseek-ai/awesome-deepseek-integration" class="text-blue-500 hover:underline">GitHub</a></p>
    </div>
  </div>
</body>
</html>
