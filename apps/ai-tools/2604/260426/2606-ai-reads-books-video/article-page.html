<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reads Books - 文章</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold mb-4">
                <span class="gradient-text">让 AI 帮你读书</span>
            </h1>
            <p class="text-gray-400">逐页分析 PDF，自动提取知识精华</p>
        </div>

        <!-- Content -->
        <article class="space-y-6">
            <section class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-3">📚 自动化 PDF 分析</h2>
                <p class="text-gray-300">智能逐页处理，深入理解每一页内容</p>
            </section>

            <section class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-3">🤖 AI 知识提取</h2>
                <p class="text-gray-300">使用 OpenAI API 进行智能分析，准确提取关键信息</p>
            </section>

            <section class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-3">💾 持久化知识库</h2>
                <p class="text-gray-300">JSON 格式存储，支持断点续传</p>
            </section>

            <section class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-3">📝 Markdown 摘要</h2>
                <p class="text-gray-300">生成格式化的摘要，支持间隔摘要和最终摘要</p>
            </section>

            <section class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-xl font-bold mb-3">🚫 智能内容过滤</h2>
                <p class="text-gray-300">自动跳过目录页、索引页等无关内容</p>
            </section>
        </article>

        <!-- Footer -->
        <div class="mt-12 text-center">
            <a href="https://github.com/echohive42/AI-reads-books-page-by-page" target="_blank" class="text-purple-400 hover:text-purple-300">
                在 GitHub 查看 →
            </a>
        </div>
    </div>
</body>
</html>
