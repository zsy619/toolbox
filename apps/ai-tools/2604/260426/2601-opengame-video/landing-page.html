<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="OpenGame">
  <meta property="og:description" content="一句话 prompt，生成完整可玩网页游戏">
  <meta property="og:type" content="website">
  <title>OpenGame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #8B5CF620; border: 2px solid #8B5CF6; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #6D28D9; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #8B5CF6; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #8B5CF620, #6D28D920); border: 2px solid #8B5CF6; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#8B5CF610 1px, transparent 1px), linear-gradient(90deg, #8B5CF610 1px, transparent 1px), linear-gradient(#6D28D908 1px, transparent 1px), linear-gradient(90deg, #6D28D908 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #6D28D9; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    
    <div class="stats">
      <div class="stat-item"><div class="stat-num">150+</div><div class="stat-label">游戏覆盖</div></div>
      <div class="stat-item"><div class="stat-num">27B</div><div class="stat-label">游戏引擎模型</div></div>
      <div class="stat-item"><div class="stat-num">SOTA</div><div class="stat-label">多项基准</div></div>
    </div>

    <div class="features">
      <div class="feature-row"><div class="feature-icon">🎮</div><div class="feature-text"><strong>GameCoder-27B</strong> — 专攻游戏引擎代码生成</div></div>
      <div class="feature-row"><div class="feature-icon">🛠️</div><div class="feature-text"><strong>Game Skill</strong> — Template + Debug 技能系统</div></div>
      <div class="feature-row"><div class="feature-icon">🚀</div><div class="feature-text"><strong>150+ Games</strong> — 多样化游戏实测 SOTA</div></div>
    </div>

    <div class="highlight-box"><p>一句话 prompt<br>生成完整可玩网页游戏</p></div>

    <div class="cta-group">
      <a href="https://github.com/leigest519/OpenGame" target="_blank" class="cta-btn">GitHub</a>
    </div>

  </div>
</body>
</html>
