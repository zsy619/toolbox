<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Money With AI - 用AI变现工具大全</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0D0D1A; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .gradient-text { background: linear-gradient(90deg, #00FFFF, #FF00FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: rgba(26, 0, 51, 0.8); border: 1px solid rgba(157, 0, 255, 0.3); }
    .neon-cyan { color: #00FFFF; text-shadow: 0 0 20px #00FFFF; }
    .neon-magenta { color: #FF00FF; text-shadow: 0 0 20px #FF00FF; }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="container mx-auto px-4 py-12 max-w-2xl">
    <!-- Hero -->
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold mb-4 gradient-text">Make Money With AI</h1>
      <p class="text-xl text-gray-400">用AI把开源变成收入</p>
    </div>

    <!-- Stats -->
    <div class="bg-cyan-900 bg-opacity-30 rounded-xl p-6 mb-8 border border-cyan-500 border-opacity-50">
      <p class="text-center text-3xl text-cyan-400 font-bold">167 个 AI 变现项目</p>
      <p class="text-center text-gray-400 mt-2">精选列表，收录将 AI 工具转化为收入</p>
    </div>

    <!-- Categories -->
    <div class="mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">主要分类</h2>
      <div class="grid grid-cols-2 gap-4">
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">🤖</div>
          <div class="text-lg font-bold neon-cyan">AI Agent</div>
          <div class="text-gray-400 text-sm mt-1">AutoGPT / LangChain</div>
        </div>
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">🎨</div>
          <div class="text-lg font-bold neon-cyan">图片创意</div>
          <div class="text-gray-400 text-sm mt-1">Stable Diffusion</div>
        </div>
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">💻</div>
          <div class="text-lg font-bold neon-cyan">本地LLM</div>
          <div class="text-gray-400 text-sm mt-1">Ollama / Open-WebUI</div>
        </div>
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">🔍</div>
          <div class="text-lg font-bold neon-cyan">RAG平台</div>
          <div class="text-gray-400 text-sm mt-1">LlamaIndex / RAGFlow</div>
        </div>
      </div>
    </div>

    <!-- Monetization -->
    <div class="mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">变现模式</h2>
      <div class="space-y-3">
        <div class="card rounded-lg p-4 border-l-4 border-cyan-500">
          <strong class="text-cyan-400">SaaS产品</strong>
          <p class="text-gray-400 text-sm mt-1">基于AI工具构建SaaS</p>
        </div>
        <div class="card rounded-lg p-4 border-l-4 border-magenta-500">
          <strong class="text-magenta-400" style="color:#FF00FF">API服务</strong>
          <p class="text-gray-400 text-sm mt-1">提供AI API服务</p>
        </div>
        <div class="card rounded-lg p-4 border-l-4 border-cyan-500">
          <strong class="text-cyan-400">自动化工作流</strong>
          <p class="text-gray-400 text-sm mt-1">为企业定制自动化</p>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="#" class="inline-block bg-gradient-to-r from-cyan-500 to-purple-500 hover:opacity-90 text-white font-bold py-4 px-8 rounded-xl text-xl">
        立即开始
      </a>
    </div>
  </div>
</body>
</html>
