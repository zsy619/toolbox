<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Indie - 独立开发者资源大全</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0D0D1A; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .gradient-text { background: linear-gradient(90deg, #00FFFF, #FF00FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: rgba(26, 0, 51, 0.8); border: 1px solid rgba(157, 0, 255, 0.3); }
    .neon-cyan { color: #00FFFF; text-shadow: 0 0 20px #00FFFF; }
    .neon-magenta { color: #FF00FF; text-shadow: 0 0 20px #FF00FF; }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="container mx-auto px-4 py-12 max-w-2xl">
    <!-- Hero -->
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold mb-4 gradient-text">Awesome Indie</h1>
      <p class="text-xl text-gray-400">独立开发者资源大全</p>
    </div>

    <!-- Core Message -->
    <div class="bg-cyan-900 bg-opacity-30 rounded-xl p-6 mb-8 border border-cyan-500 border-opacity-50">
      <p class="text-center text-xl text-cyan-400 font-bold">
        用代码赚钱从未如此简单
      </p>
      <p class="text-center text-gray-400 mt-2">
        Making money from your own code has never been easier
      </p>
    </div>

    <!-- Core Philosophy -->
    <div class="mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">核心理念</h2>
      <div class="card rounded-xl p-6">
        <p class="text-center text-2xl text-white font-bold mb-4">项目不需要大，只需要盈利</p>
        <p class="text-center text-gray-400">
          项目可以产生被动收入，帮助你达到财务自由
        </p>
      </div>
    </div>

    <!-- Key Actions -->
    <div class="text-center mb-12">
      <p class="text-3xl font-bold neon-magenta">MAKE and TRY stuff!</p>
    </div>

    <!-- Resources -->
    <div class="mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">核心资源</h2>
      <div class="grid grid-cols-2 gap-4">
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">🌐</div>
          <div class="text-lg font-bold neon-cyan">社区</div>
          <div class="text-gray-400 text-sm mt-1">IndieHackers</div>
        </div>
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">📚</div>
          <div class="text-lg font-bold neon-cyan">书籍</div>
          <div class="text-gray-400 text-sm mt-1">Getting Real</div>
        </div>
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">🎯</div>
          <div class="text-lg font-bold neon-cyan">案例</div>
          <div class="text-gray-400 text-sm mt-1">NomadList</div>
        </div>
        <div class="card rounded-xl p-5 text-center">
          <div class="text-2xl mb-2">🛠️</div>
          <div class="text-lg font-bold neon-cyan">工具</div>
          <div class="text-gray-400 text-sm mt-1">free-for-dev</div>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="#" class="inline-block bg-gradient-to-r from-cyan-500 to-purple-500 hover:opacity-90 text-white font-bold py-4 px-8 rounded-xl text-xl">
        立即探索
      </a>
    </div>
  </div>
</body>
</html>
