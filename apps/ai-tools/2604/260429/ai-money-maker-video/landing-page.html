<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI副业赚钱方案博物馆</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0D0D1A; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .gradient-text { background: linear-gradient(90deg, #00FFFF, #FF00FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: rgba(26, 0, 51, 0.8); border: 1px solid rgba(157, 0, 255, 0.3); }
    .neon-cyan { color: #00FFFF; text-shadow: 0 0 20px #00FFFF; }
    .neon-magenta { color: #FF00FF; text-shadow: 0 0 20px #FF00FF; }
  </style>
</head>
<body class="min-h-screen text-white">
  <div class="container mx-auto px-4 py-12 max-w-2xl">
    <!-- Hero -->
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold mb-4 gradient-text">AI副业赚钱</h1>
      <p class="text-xl text-gray-400">兼职赚钱方案博物馆</p>
    </div>

    <!-- Strategy -->
    <div class="bg-cyan-900 bg-opacity-30 rounded-xl p-6 mb-8 border border-cyan-500 border-opacity-50">
      <p class="text-center text-xl text-cyan-400 font-bold">
        自媒体流量是当下AI副业的最亲民路径
      </p>
    </div>

    <!-- Four Rules -->
    <div class="mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">四条黄金建议</h2>
      <div class="space-y-4">
        <div class="card rounded-lg p-4 border-l-4 border-cyan-500">
          <strong class="text-cyan-400">做内容搞流量</strong>
          <p class="text-gray-400 text-sm mt-1">找到需要产品的用户，合作促成交易</p>
        </div>
        <div class="card rounded-lg p-4 border-l-4 border-magenta-500">
          <strong class="text-magenta-400" style="color:#FF00FF">卖铲子而非挖金子</strong>
          <p class="text-gray-400 text-sm mt-1">挖金子风险大，卖工具更容易</p>
        </div>
        <div class="card rounded-lg p-4 border-l-4 border-cyan-500">
          <strong class="text-cyan-400">不想花钱就花时间</strong>
          <p class="text-gray-400 text-sm mt-1">通过时间不断试错</p>
        </div>
        <div class="card rounded-lg p-4 border-l-4 border-magenta-500">
          <strong class="text-magenta-400" style="color:#FF00FF">做资产而不是卖时间</strong>
          <p class="text-gray-400 text-sm mt-1">积累持续收益的资产</p>
        </div>
      </div>
    </div>

    <!-- Categories -->
    <div class="grid grid-cols-2 gap-4 mb-12">
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl mb-2">🛠️</div>
        <div class="text-xl font-bold neon-cyan">技术方案</div>
        <div class="text-gray-400 text-sm mt-2">套壳站 / API聚合 / SaaS</div>
      </div>
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl mb-2">📱</div>
        <div class="text-xl font-bold neon-magenta">自媒体方案</div>
        <div class="text-gray-400 text-sm mt-2">AI图片 / 直播 / 音频</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="#" class="inline-block bg-gradient-to-r from-cyan-500 to-purple-500 hover:opacity-90 text-white font-bold py-4 px-8 rounded-xl text-xl">
        立即行动
      </a>
    </div>
  </div>
</body>
</html>
