<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rsync - 让备份速度快10倍</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0D1117 0%, #1a1f36 100%);
            min-height: 100vh;
        }
        .gradient-text {
            background: linear-gradient(135deg, #60A5FA, #7C3AED);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(96, 165, 250, 0.2);
            backdrop-filter: blur(10px);
        }
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
        }
    </style>
</head>
<body class="text-white">
    <section class="min-h-screen flex items-center justify-center px-6 py-20">
        <div class="max-w-4xl mx-auto text-center">
            <div class="text-6xl mb-8">⚡</div>
            <h1 class="text-5xl md:text-7xl font-black mb-6">
                <span class="gradient-text">rsync</span>
            </h1>
            <p class="text-xl md:text-2xl text-gray-300 mb-8">
                让备份速度快10倍的命令
            </p>
            <p class="text-lg text-gray-400">
                但90%的人都不知道这个参数
            </p>
        </div>
    </section>

    <section class="py-20 px-6">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-3xl font-bold text-center mb-16">基础参数</h2>
            <div class="grid md:grid-cols-3 gap-8">
                <div class="card rounded-2xl p-8 text-center">
                    <div class="text-5xl mb-6">a</div>
                    <h3 class="text-xl font-bold mb-4">Archive</h3>
                    <p class="text-gray-400">保留所有权限和时间</p>
                </div>
                <div class="card rounded-2xl p-8 text-center">
                    <div class="text-5xl mb-6">v</div>
                    <h3 class="text-xl font-bold mb-4">Verbose</h3>
                    <p class="text-gray-400">显示详细信息</p>
                </div>
                <div class="card rounded-2xl p-8 text-center">
                    <div class="text-5xl mb-6">z</div>
                    <h3 class="text-xl font-bold mb-4">Compress</h3>
                    <p class="text-gray-400">压缩传输</p>
                </div>
            </div>
        </div>
    </section>

    <section class="py-20 px-6 bg-black/30">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-bold text-center mb-12">隐藏技巧</h2>
            <div class="space-y-6">
                <div class="card rounded-xl p-6">
                    <code class="text-lg">rsync -avz --delete source/ dest/</code>
                    <p class="text-gray-400 mt-2">目标端多余文件会被删除</p>
                </div>
                <div class="card rounded-xl p-6">
                    <code class="text-lg">rsync -avz --exclude='*.log' source/ dest/</code>
                    <p class="text-gray-400 mt-2">排除特定文件</p>
                </div>
                <div class="card rounded-xl p-6">
                    <code class="text-lg">rsync -avzP source/ dest/</code>
                    <p class="text-gray-400 mt-2">显示进度</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-12 px-6 border-t border-gray-800">
        <div class="max-w-4xl mx-auto text-center text-gray-500 text-sm">
            <p>rsync - 让备份速度快10倍的命令</p>
        </div>
    </footer>
</body>
</html>
