<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Level Up Tips - 离谱的英语学习指南</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --primary: #10B981; --secondary: #059669; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #34D399; --gold: #FBBF24; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'PingFang SC', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 680px; margin: 0 auto; padding: 2rem 1rem; }
    .header { text-align: center; margin-bottom: 2rem; padding: 2rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .badge { display: inline-block; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 50px; padding: 6px 16px; font-size: 13px; color: var(--accent); margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 900; margin-bottom: 0.5rem; background: linear-gradient(135deg, #10B981, #34D399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .meta { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .stars { color: var(--gold); font-size: 1.1rem; margin: 0.5rem 0; }
    .section { background: var(--card); border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--accent); }
    p { color: var(--muted); line-height: 1.7; margin-bottom: 0.75rem; }
    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .feature-item { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2); border-radius: 10px; padding: 0.75rem; text-align: center; }
    .feature-item .icon { font-size: 1.25rem; }
    .feature-item .name { font-weight: 700; font-size: 0.9rem; }
    .quote { background: rgba(16,185,129,0.1); border: 2px solid var(--primary); border-radius: 12px; padding: 1rem; text-align: center; margin-top: 1rem; font-style: italic; color: var(--muted); line-height: 1.8; }
    .footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">📚 离谱的英语学习指南</div>
      <h1>English Level Up Tips</h1>
      <p class="meta">系统提升听、说、读、写、译能力</p>
      <div class="stars">⭐ 32k+ Stars</div>
    </div>

    <div class="section">
      <h2>📖 核心内容</h2>
      <div class="feature-grid">
        <div class="feature-item">
          <div class="icon">👂</div>
          <div class="name">听力训练</div>
        </div>
        <div class="feature-item">
          <div class="icon">🗣️</div>
          <div class="name">口语表达</div>
        </div>
        <div class="feature-item">
          <div class="icon">📖</div>
          <div class="name">阅读理解</div>
        </div>
        <div class="feature-item">
          <div class="icon">✍️</div>
          <div class="name">写作技巧</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>💻 程序员专项</h2>
      <p>• 程序员英语词汇</p>
      <p>• 技术文档阅读</p>
      <p>• 代码注释规范</p>
    </div>

    <div class="quote">
      "我们每个人都生活在各自的过去中，人们会用一分钟的时间去认识一个人，用一小时的时间去喜欢一个人，再用一天的时间去爱上一个人，到最后呢，却要用一辈子的时间去忘记一个人。"
      <p style="margin-top:0.75rem;font-size:0.85rem;color:var(--accent);font-style:normal;">— 献给曾经挚爱 W.</p>
    </div>

    <div class="footer">
      <p>github.com/byoungd/English-level-up-tips</p>
    </div>
  </div>
</body>
</html>
