<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Level Up Tips - 离谱的英语学习指南</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #10B981; --secondary: #059669; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #34D399; --gold: #FBBF24; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #064E3B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(16,185,129,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(52,211,153,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .badge { display: inline-block; background: rgba(16,185,129,0.2); border: 1px solid rgba(16,185,129,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--accent); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900; background: linear-gradient(135deg, #10B981, #34D399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; letter-spacing: -1px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .stars { font-size: 2rem; color: var(--gold); margin-bottom: 1rem; }
    .highlight { background: rgba(251,191,36,0.1); border: 2px solid var(--gold); border-radius: 16px; padding: 1.5rem 2rem; display: inline-block; margin-top: 1.5rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(16,185,129,0.3); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .quote-section { padding: 4rem 2rem; background: var(--card); text-align: center; }
    @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="badge">📚 离谱的英语学习指南</div>
      <h1>English Level Up Tips</h1>
      <p class="subtitle">系统提升听、说、读、写、译能力</p>
      <div class="stars">⭐ 32k+ Stars</div>
      <div class="highlight">
        <div style="font-size:1.1rem;font-weight:700;color:var(--gold);">🎯 系统化学习</div>
        <div style="font-size:0.9rem;color:var(--muted);margin-top:0.5rem;">不是碎片化记忆</div>
      </div>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">👂</div>
          <div class="feature-name">听力训练</div>
          <div class="feature-desc">系统化听力技巧</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🗣️</div>
          <div class="feature-name">口语表达</div>
          <div class="feature-desc">实用口语技巧</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📖</div>
          <div class="feature-name">阅读理解</div>
          <div class="feature-desc">技术文档阅读</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✍️</div>
          <div class="feature-name">写作技巧</div>
          <div class="feature-desc">专业写作规范</div>
        </div>
      </div>
    </div>
  </section>
  <section class="quote-section">
    <div style="max-width:500px;margin:0 auto;">
      <p style="font-size:1rem;font-style:italic;color:var(--muted);line-height:1.8;">
        "我们每个人都生活在各自的过去中，人们会用一分钟的时间去认识一个人，用一小时的时间去喜欢一个人，再用一天的时间去爱上一个人，到最后呢，却要用一辈子的时间去忘记一个人。"
      </p>
      <p style="font-size:0.85rem;color:var(--accent);margin-top:1rem;">— 献给曾经挚爱 W.</p>
    </div>
  </section>
</body>
</html>
