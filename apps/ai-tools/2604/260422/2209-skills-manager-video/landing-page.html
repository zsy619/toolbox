<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Manager - 志辉开源的Skills管理神器</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: linear-gradient(135deg, #0D1117 0%, #1a1f36 100%); min-height: 100vh; }
        .gradient-text { background: linear-gradient(135deg, #60A5FA, #7C3AED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(96, 165, 250, 0.2); }
    </style>
</head>
<body class="text-white">
    <section class="min-h-screen flex items-center justify-center px-6 py-20 text-center">
        <div>
            <div class="text-6xl mb-8">🛠️</div>
            <h1 class="text-5xl font-black mb-6"><span class="gradient-text">Skills Manager</span></h1>
            <p class="text-xl text-gray-300 mb-4">志辉开源的Skills管理神器</p>
            <p class="text-lg text-gray-400">打磨两周，解决平时痛点</p>
        </div>
    </section>
    <section class="py-20 px-6">
        <div class="max-w-4xl mx-auto text-center mb-12">
            <h2 class="text-3xl font-bold">六大功能</h2>
        </div>
        <div class="grid md:grid-cols-3 gap-6">
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">📁</div><h3 class="font-bold">全局管理</h3><p class="text-gray-400 text-sm">~/.agents/skills</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">⚡</div><h3 class="font-bold">一键安装</h3><p class="text-gray-400 text-sm">GitHub仓库</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🖥️</div><h3 class="font-bold">全局项目</h3><p class="text-gray-400 text-sm">电脑项目skills</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🏪</div><h3 class="font-bold">Skills市场</h3><p class="text-gray-400 text-sm">官方+最佳推荐</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">🤖</div><h3 class="font-bold">多平台支持</h3><p class="text-gray-400 text-sm">Coding Agent</p></div>
            <div class="card rounded-xl p-6 text-center"><div class="text-4xl mb-4">✨</div><h3 class="font-bold">AI解释</h3><p class="text-gray-400 text-sm">AI解释skills</p></div>
        </div>
    </section>
    <section class="py-20 px-6 text-center bg-black/30">
        <p class="text-xl text-gray-400 mb-4">有问题来开喷，好的坏的都接受</p>
        <p class="text-xl text-gray-400 mb-8">欢迎一起来共建！</p>
        <a href="#" class="inline-block px-10 py-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full font-bold">Star on GitHub</a>
    </section>
    <footer class="py-12 px-6 border-t border-gray-800 text-center text-gray-500 text-sm">
        <p>Skills Manager - 志辉开源</p>
    </footer>
</body>
</html>
