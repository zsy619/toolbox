<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlowBoard - 智能任务管理看板</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #0F172A; color: #F8FAFC; }
    .gradient-text { background: linear-gradient(135deg, #2563EB 0%, #22D3EE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1E293B; border: 1px solid #334155; border-radius: 16px; }
    .btn-primary { background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%); border-radius: 12px; padding: 14px 32px; font-weight: 600; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .glow { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col">
    <!-- Hero -->
    <section class="relative flex-1 flex flex-col items-center justify-center text-center px-6 py-20 overflow-hidden">
      <div class="glow" style="width:600px;height:600px;background:rgba(37,99,235,0.15);top:-100px;left:50%;transform:translateX(-50%);"></div>
      <div class="glow" style="width:400px;height:400px;background:rgba(124,58,237,0.1);bottom:-100px;right:-100px;"></div>
      <div class="relative z-10">
        <h1 class="text-6xl md:text-8xl font-extrabold tracking-tight mb-6 gradient-text">FlowBoard</h1>
        <p class="text-2xl md:text-3xl text-slate-400 mb-10">智能任务管理看板</p>
        <div class="flex flex-wrap justify-center gap-4 mb-16">
          <span class="px-5 py-2 rounded-full text-cyan-400 text-lg" style="background:rgba(37,99,235,0.15);border:1px solid rgba(37,99,235,0.3)">React 18</span>
          <span class="px-5 py-2 rounded-full text-cyan-400 text-lg" style="background:rgba(37,99,235,0.15);border:1px solid rgba(37,99,235,0.3)">TypeScript</span>
          <span class="px-5 py-2 rounded-full text-cyan-400 text-lg" style="background:rgba(37,99,235,0.15);border:1px solid rgba(37,99,235,0.3)">本地存储</span>
        </div>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
          <a href="https://github.com/sakimi-9/FlowBoard" class="btn-primary inline-block text-white text-xl">GitHub</a>
          <a href="https://sakimi-9.github.io/project_FlowBoard/" class="btn-primary inline-block text-white text-xl">在线演示</a>
        </div>
      </div>
    </section>

    <!-- Features -->
    <section class="px-6 py-20 max-w-4xl mx-auto">
      <h2 class="text-3xl font-bold text-center mb-12">五大核心能力</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="card p-8">
          <div class="text-4xl mb-4">📅</div>
          <h3 class="text-2xl font-bold mb-2">时间感知</h3>
          <p class="text-slate-400">智能识别任务时间，到期自动提醒</p>
        </div>
        <div class="card p-8">
          <div class="text-4xl mb-4">🔍</div>
          <h3 class="text-2xl font-bold mb-2">多维过滤</h3>
          <p class="text-slate-400">按标签、按优先级、按状态，随心所欲筛选</p>
        </div>
        <div class="card p-8">
          <div class="text-4xl mb-4">📆</div>
          <h3 class="text-2xl font-bold mb-2">日历快览</h3>
          <p class="text-slate-400">日历视图一览无余，时间分布尽在掌握</p>
        </div>
        <div class="card p-8">
          <div class="text-4xl mb-4">✋</div>
          <h3 class="text-2xl font-bold mb-2">拖拽交互</h3>
          <p class="text-slate-400">流畅拖拽调整任务状态和顺序，体验丝滑</p>
        </div>
        <div class="card p-8 md:col-span-2">
          <div class="text-4xl mb-4">🌙</div>
          <h3 class="text-2xl font-bold mb-2">主题切换</h3>
          <p class="text-slate-400">亮色暗色一键切换，白天夜晚都舒适</p>
        </div>
      </div>
    </section>

    <!-- Offline -->
    <section class="px-6 py-20 text-center">
      <div class="text-6xl mb-6">💾</div>
      <h2 class="text-3xl font-bold mb-4">完全离线可用</h2>
      <p class="text-xl text-slate-400 max-w-xl mx-auto">所有数据本地持久化，保护你的隐私，告别云端依赖</p>
    </section>

    <!-- Footer -->
    <footer class="text-center py-10 text-slate-500 text-sm">
      <p>GitHub · github.com/sakimi-9/FlowBoard</p>
    </footer>
  </div>
</body>
</html>
