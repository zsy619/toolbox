<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dify - AI 智能体开发平台</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-bg { background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%); }
    .card-glow { box-shadow: 0 0 60px rgba(102, 126, 234, 0.3); }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.4); } 50% { box-shadow: 0 0 40px rgba(102, 126, 234, 0.8); } }
    .float-animation { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .particle { position: absolute; border-radius: 50%; background: rgba(102, 126, 234, 0.6); animation: particle-float 8s linear infinite; }
    @keyframes particle-float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">
  <div id="particles" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12">
    
    <div class="text-center max-w-lg mx-auto mb-12">
      <div class="inline-block px-4 py-2 rounded-full bg-purple-500/20 border border-purple-500/30 text-purple-300 text-sm mb-6 float-animation">
        🚀 开源项目 · Linux Foundation 旗下
      </div>
      
      <h1 class="text-5xl font-black mb-4">
        <span class="gradient-text">Dify</span>
      </h1>
      
      <p class="text-xl text-gray-300 mb-2">
        不用写代码，也能搭 AI 助手
      </p>
      
      <p class="text-gray-500">
        开源的 LLM 应用开发平台<br>
        拖拽组件，零基础也能用
      </p>
    </div>

    <div class="grid grid-cols-3 gap-4 max-w-lg mx-auto mb-12">
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-4 text-center border border-white/10">
        <div class="text-3xl font-black gradient-text">100+</div>
        <div class="text-xs text-gray-400 mt-1">支持模型</div>
      </div>
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-4 text-center border border-white/10">
        <div class="text-3xl font-black gradient-text">50+</div>
        <div class="text-xs text-gray-400 mt-1">内置工具</div>
      </div>
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-4 text-center border border-white/10">
        <div class="text-3xl font-black gradient-text">0</div>
        <div class="text-xs text-gray-400 mt-1">编程要求</div>
      </div>
    </div>

    <div class="space-y-4 max-w-lg mx-auto mb-12">
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-white/10 card-glow">
        <div class="flex items-center gap-4">
          <span class="text-3xl">🎯</span>
          <div>
            <h3 class="font-bold text-lg">可视化工作流</h3>
            <p class="text-sm text-gray-400 mt-1">拖拽组件即可搭建 AI 应用，无需编程基础</p>
          </div>
        </div>
      </div>
      
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-white/10">
        <div class="flex items-center gap-4">
          <span class="text-3xl">🌐</span>
          <div>
            <h3 class="font-bold text-lg">百种模型支持</h3>
            <p class="text-sm text-gray-400 mt-1">GPT、Llama3、Mistral 等主流模型全覆盖</p>
          </div>
        </div>
      </div>
      
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-white/10">
        <div class="flex items-center gap-4">
          <span class="text-3xl">🛠️</span>
          <div>
            <h3 class="font-bold text-lg">RAG 管道</h3>
            <p class="text-sm text-gray-400 mt-1">轻松处理文档，构建知识库</p>
          </div>
        </div>
      </div>
      
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-white/10">
        <div class="flex items-center gap-4">
          <span class="text-3xl">💰</span>
          <div>
            <h3 class="font-bold text-lg">变现机会</h3>
            <p class="text-sm text-gray-400 mt-1">帮商家搭建 AI 客服，收搭建费+月费</p>
          </div>
        </div>
      </div>
    </div>

    <a href="https://github.com/langgenius/dify" target="_blank" 
       class="inline-flex items-center gap-3 px-8 py-4 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 font-bold text-lg text-white hover:opacity-90 transition pulse-glow">
      <span>GitHub 获取</span>
      <span>→</span>
    </a>

    <div class="mt-16 text-center text-gray-500 text-sm">
      <p>MIT 许可证 · 完全免费 · LangGenius</p>
    </div>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.width = particle.style.height = Math.random() * 6 + 2 + 'px';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
