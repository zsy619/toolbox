<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erduo Skills - AI Agent 技能库</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0F172A; color: #F8FAFC; }
    .gradient-text { background: linear-gradient(135deg, #22D3EE, #10B981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1E293B; border: 1px solid #334155; }
    .feature-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #22D3EE, #10B981); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-16 max-w-4xl">
    <div class="text-center mb-12">
      <div class="inline-block px-4 py-2 rounded-full bg-cyan-500/20 text-cyan-400 text-sm mb-6">🤖 AI Agent 技能库</div>
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Erduo Skills</h1>
      <p class="text-xl text-gray-400 mb-2">耳朵技能库</p>
      <p class="text-gray-500">为 AI Agent 赋能，提供结构化能力与智能工作流</p>
    </div>

    <!-- Skills Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-12">
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">🗞</div>
        <div class="font-bold text-white">每日日报</div>
        <div class="text-xs text-gray-400 mt-1">多源抓取自动生成</div>
      </div>
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">📰</div>
        <div class="font-bold text-white">RSS 精选</div>
        <div class="text-xs text-gray-400 mt-1">10分制打分过滤</div>
      </div>
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">✍️</div>
        <div class="font-bold text-white">转录精修师</div>
        <div class="text-xs text-gray-400 mt-1">保留原汁原味</div>
      </div>
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">🌐</div>
        <div class="font-bold text-white">翻译精修师</div>
        <div class="text-xs text-gray-400 mt-1">四步工作流双向翻译</div>
      </div>
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">🔗</div>
        <div class="font-bold text-white">Web To Markdown</div>
        <div class="text-xs text-gray-400 mt-1">干净Markdown输出</div>
      </div>
      <div class="card rounded-xl p-4 text-center">
        <div class="text-3xl mb-2">🖼</div>
        <div class="font-bold text-white">Gemini 水印移除</div>
        <div class="text-xs text-gray-400 mt-1">像素级还原</div>
      </div>
    </div>

    <!-- Install -->
    <div class="card rounded-2xl p-8 mb-12 text-center">
      <h2 class="text-2xl font-bold mb-4">🚀 安装方式</h2>
      <div class="bg-black/30 rounded-xl py-4 px-6 inline-block">
        <code class="text-cyan-400 text-lg">npx skills add rookie-ricardo/erduo-skills</code>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="https://github.com/rookie-ricardo/erduo-skills" target="_blank" class="inline-block px-8 py-4 bg-gradient-to-r from-cyan-500 to-emerald-500 rounded-xl font-bold text-lg hover:opacity-90 transition">
        GitHub 开源地址 →
      </a>
      <p class="text-gray-500 mt-4">⭐ 欢迎 Star · MIT License</p>
    </div>
  </div>
</body>
</html>
