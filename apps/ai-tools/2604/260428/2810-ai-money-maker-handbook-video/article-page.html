<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 副业赚钱手册</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">
                <span class="gradient-text">AI 副业赚钱手册</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">从认知到变现的完整路径</p>
        </header>

        <article class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-green-400 mb-2">认知逻辑</h3>
                <p class="text-gray-300 text-sm">做资产而非卖时间 · 卖铲子而非挖金子</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-2">技术变现</h3>
                <p class="text-gray-300 text-sm">OpenClaw/Claude Code · 插件/SaaS · API聚合站</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-yellow-400 mb-2">内容生产</h3>
                <p class="text-gray-300 text-sm">视频（虚拟人口播、小说推文）+ 图文（AI绘本、LOGO）</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-purple-400 mb-2">创业实务</h3>
                <p class="text-gray-300 text-sm">PMF · 单位经济模型(LTV/CAC) · 出海合规(GDPR)</p>
            </div>
        </article>
    </div>
</body>
</html>
