<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DouyinLiveRecorder - 多平台直播录制工具</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #00FFFF 0%, #FF00FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .gradient-bg { background: linear-gradient(135deg, #0D0221 0%, #1a0a2e 50%, #0D0221 100%); }
    .card-glow { box-shadow: 0 0 60px rgba(0, 255, 255, 0.3); }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); } 50% { box-shadow: 0 0 40px rgba(0, 255, 255, 0.8); } }
    .particle { position: absolute; border-radius: 50%; background: rgba(0, 255, 255, 0.6); animation: particle-float 8s linear infinite; }
    @keyframes particle-float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">
  <div id="particles" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12">
    
    <div class="text-center max-w-lg mx-auto mb-12">
      <div class="inline-block px-4 py-2 rounded-full bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 text-sm mb-6">
        🚀 开源项目 · FFmpeg 驱动
      </div>
      
      <h1 class="text-5xl font-black mb-4">
        <span class="gradient-text">DouyinLiveRecorder</span>
      </h1>
      
      <p class="text-xl text-gray-300 mb-2">
        多平台直播录制工具
      </p>
      
      <p class="text-gray-500">
        自动监测 · 批量录制 · 循环值守
      </p>
    </div>

    <div class="grid grid-cols-3 gap-4 max-w-lg mx-auto mb-12">
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-4 text-center border border-cyan-500/30">
        <div class="text-3xl font-black gradient-text">40+</div>
        <div class="text-xs text-gray-400 mt-1">支持平台</div>
      </div>
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-4 text-center border border-magenta-500/30">
        <div class="text-3xl font-black gradient-text">FFmpeg</div>
        <div class="text-xs text-gray-400 mt-1">录制引擎</div>
      </div>
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-4 text-center border border-yellow-500/30">
        <div class="text-3xl font-black gradient-text">Docker</div>
        <div class="text-xs text-gray-400 mt-1">一键部署</div>
      </div>
    </div>

    <div class="space-y-4 max-w-lg mx-auto mb-12">
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-cyan-500/30 card-glow">
        <h3 class="font-bold text-lg text-cyan-400">🎯 多平台支持</h3>
        <p class="text-sm text-gray-400 mt-1">抖音、TikTok、B站、快手、斗鱼、虎牙、YouTube 等 40+ 平台</p>
      </div>
      
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-magenta-500/30">
        <h3 class="font-bold text-lg text-magenta-400">⚡ 自动监测</h3>
        <p class="text-sm text-gray-400 mt-1">自动监测直播状态，开播即录制</p>
      </div>
      
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-yellow-500/30">
        <h3 class="font-bold text-lg text-yellow-400">🔄 循环值守</h3>
        <p class="text-sm text-gray-400 mt-1">七乘二十四小时运行，不错过任何直播</p>
      </div>
      
      <div class="bg-white/5 backdrop-blur-sm rounded-2xl p-5 border border-green-500/30">
        <h3 class="font-bold text-lg text-green-400">📦 批量录制</h3>
        <p class="text-sm text-gray-400 mt-1">同时录制多个主播，一键管理</p>
      </div>
    </div>

    <a href="https://github.com/ihmily/DouyinLiveRecorder" target="_blank" 
       class="inline-flex items-center gap-3 px-8 py-4 rounded-full bg-gradient-to-r from-cyan-600 to-magenta-600 font-bold text-lg text-white hover:opacity-90 transition pulse-glow">
      <span>GitHub 获取</span>
      <span>→</span>
    </a>

    <div class="mt-16 text-center text-gray-500 text-sm">
      <p>MIT 许可证 · 完全免费</p>
    </div>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.width = particle.style.height = Math.random() * 6 + 2 + 'px';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
