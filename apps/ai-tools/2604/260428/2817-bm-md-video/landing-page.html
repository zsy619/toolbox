<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="bm.md - 写完Markdown之后，专治排版烦恼">
  <meta property="og:description" content="不是新的编辑器，而是排版神器。实时预览、14种样式、14种代码主题，一键适配。">
  <meta property="og:type" content="website">
  <title>bm.md - 写完Markdown之后，专治排版烦恼</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 80px; font-weight: 800; margin-bottom: 30px; background: linear-gradient(135deg, #FF0080 0%, #00FFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; }
    .subtitle { font-size: 36px; color: #808090; margin-bottom: 60px; line-height: 1.5; }
    .features { text-align: left; max-width: 900px; margin: 0 auto 60px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 24px; }
    .feature-icon { width: 48px; height: 48px; background: #FF008020; border: 2px solid #FF0080; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 28px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #00FFFF; }
    .stats { display: flex; justify-content: center; gap: 60px; margin: 60px 0; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 56px; font-weight: 800; color: #FF0080; }
    .stat-label { font-size: 22px; color: #808090; margin-top: 8px; }
    .cta-group { display: flex; justify-content: center; gap: 24px; margin-top: 60px; }
    .cta-btn { display: inline-block; padding: 18px 48px; background: linear-gradient(135deg, #FF0080, #8A2BE2); color: white; border-radius: 50px; font-size: 28px; text-decoration: none; font-weight: 600; border: none; }
    .highlight-box { background: linear-gradient(135deg, #FF008020, #00FFFF20); border: 2px solid #FF0080; border-radius: 16px; padding: 30px 40px; margin: 40px auto; max-width: 700px; }
    .highlight-box p { font-size: 28px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#FF008010 1px, transparent 1px), linear-gradient(90deg, #FF008010 1px, transparent 1px), linear-gradient(#00FFFF08 1px, transparent 1px), linear-gradient(90deg, #00FFFF08 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 60px; font-size: 22px; color: #808090; }
    .links a { color: #00FFFF; text-decoration: none; margin: 0 16px; }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <h1>bm.md<br>排版神器</h1>
    <p class="subtitle">写完Markdown之后<br>专治排版烦恼</p>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-num">14</div>
        <div class="stat-label">种样式</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">14</div>
        <div class="stat-label">种代码主题</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">1键</div>
        <div class="stat-label">一键适配</div>
      </div>
    </div>

    <div class="features">
      <div class="feature-row">
        <div class="feature-icon">🔍</div>
        <div class="feature-text"><strong>实时预览</strong> — 写完直接看效果，不用来回手调</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">🎨</div>
        <div class="feature-text"><strong>14 种样式</strong> — 多种主题可选，一键切换</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">💻</div>
        <div class="feature-text"><strong>14 种代码主题</strong> — 代码高亮，适配各种代码风格</div>
      </div>
      <div class="feature-row">
        <div class="feature-icon">⚡</div>
        <div class="feature-text"><strong>一键适配</strong> — 自动排版，省时省力</div>
      </div>
    </div>

    <div class="highlight-box">
      <p>注意力终于可以留给内容<br>而不是留给格式</p>
    </div>

    <div class="cta-group">
      <a href="https://github.com/miantiao-me/bm.md" target="_blank" class="cta-btn">GitHub</a>
    </div>

    <div class="links">
      <a href="https://github.com/miantiao-me/bm.md" target="_blank">GitHub</a>
    </div>
  </div>
</body>
</html>
