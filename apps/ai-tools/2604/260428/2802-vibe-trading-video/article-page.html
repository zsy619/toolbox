<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe-Trading - AI 量化交易智能体</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">
                <span class="gradient-text">Vibe-Trading</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">AI 量化交易智能体</p>
        </header>

        <article class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-green-400 mb-2">多智能体协作</h3>
                <p class="text-gray-300 text-sm">29 种交易团队配置 · 71 种金融分析技能</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-2">自然语言回测</h3>
                <p class="text-gray-300 text-sm">输入策略，自动生成代码并输出收益对比图</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-purple-400 mb-2">MCP 协议支持</h3>
                <p class="text-gray-300 text-sm">接入 OpenClaw、Cursor、Claude Desktop</p>
            </div>
        </article>
    </div>
</body>
</html>
