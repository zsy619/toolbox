<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe-Trading - AI 量化交易智能体</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-16 max-w-4xl">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">
                <span class="gradient-text">Vibe-Trading</span>
            </h1>
            <p class="text-xl text-gray-400">AI 量化交易智能体</p>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 mb-8">
            <h2 class="text-xl font-bold mb-4 text-purple-400">多智能体协作网络</h2>
            <div class="grid grid-cols-3 gap-4 mb-4">
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <p class="text-2xl font-bold text-green-400">29</p>
                    <p class="text-sm text-gray-400">交易团队配置</p>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <p class="text-2xl font-bold text-yellow-400">71</p>
                    <p class="text-sm text-gray-400">金融分析技能</p>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <p class="text-2xl font-bold text-blue-400">5</p>
                    <p class="text-sm text-gray-400">数据源</p>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-green-400 mb-3">AI 内部辩论</h3>
                <p class="text-gray-300 text-sm mb-2">基本面分析师 · 技术派 · 风控总监</p>
                <p class="text-gray-400 text-xs">交叉评估，给出综合参考</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-3">自然语言回测</h3>
                <p class="text-gray-300 text-sm mb-2">输入策略，自动生成代码</p>
                <p class="text-gray-400 text-xs">输出收益对比图</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-yellow-400 mb-3">5 大数据源</h3>
                <p class="text-gray-300 text-sm mb-2">A股 · 港美股 · 加密货币</p>
                <p class="text-gray-400 text-xs">期货 · 外汇</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-purple-400 mb-3">MCP 协议支持</h3>
                <p class="text-gray-300 text-sm mb-2">OpenClaw · Cursor</p>
                <p class="text-gray-400 text-xs">Claude Desktop</p>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 text-center">
            <p class="text-lg mb-4">安装</p>
            <code class="text-green-400 text-xl">pip install vibe-trading-ai</code>
        </div>
    </div>
</body>
</html>
