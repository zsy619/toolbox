<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent Team - 让 AI 各司其职</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0F172A; color: #F8FAFC; }
    .gradient-text { background: linear-gradient(135deg, #8B5CF6, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1E293B; border: 1px solid #334155; }
    .feature-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #8B5CF6, #06B6D4); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-16 max-w-4xl">
    <div class="text-center mb-12">
      <div class="inline-block px-4 py-2 rounded-full bg-purple-500/20 text-purple-400 text-sm mb-6">🤖 Multi-Agent</div>
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Multi-Agent Team</h1>
      <p class="text-xl text-gray-400 mb-2">让 AI 各司其职</p>
      <p class="text-gray-500">为什么一个 AI 身兼多职效率低下？各司其职才是正解</p>
    </div>

    <!-- Problem -->
    <div class="card rounded-2xl p-8 mb-8">
      <h2 class="text-2xl font-bold mb-4 text-center text-red-400">❌ 一个 AI 身兼多职的问题</h2>
      <div class="text-center text-gray-400 mb-4">研究员 + 作家 + 程序员 + 项目经理 + 运营者</div>
      <div class="text-center text-red-400 text-lg">→ 人格混乱，效率低下</div>
    </div>

    <!-- Solution -->
    <div class="card rounded-2xl p-8 mb-8">
      <h2 class="text-2xl font-bold mb-6 text-center text-green-400">✅ Multi-Agent Team</h2>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-3xl mb-2">🔬</div>
          <div class="font-bold text-white">研究员</div>
          <div class="text-xs text-gray-400">信息搜集</div>
        </div>
        <div class="text-center p-4 bg-blue-500/10 rounded-xl border border-blue-500/30">
          <div class="text-3xl mb-2">✍️</div>
          <div class="font-bold text-white">作家</div>
          <div class="text-xs text-gray-400">内容创作</div>
        </div>
        <div class="text-center p-4 bg-green-500/10 rounded-xl border border-green-500/30">
          <div class="text-3xl mb-2">💻</div>
          <div class="font-bold text-white">程序员</div>
          <div class="text-xs text-gray-400">代码编写</div>
        </div>
        <div class="text-center p-4 bg-orange-500/10 rounded-xl border border-orange-500/30">
          <div class="text-3xl mb-2">📊</div>
          <div class="font-bold text-white">项目经理</div>
          <div class="text-xs text-gray-400">任务协调</div>
        </div>
        <div class="text-center p-4 bg-cyan-500/10 rounded-xl border border-cyan-500/30">
          <div class="text-3xl mb-2">⚙️</div>
          <div class="font-bold text-white">运营</div>
          <div class="text-xs text-gray-400">执行落地</div>
        </div>
      </div>
    </div>

    <!-- Benefits -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl mb-3">🎯</div>
        <div class="font-bold text-white mb-1">专注力更强</div>
        <div class="text-gray-400 text-sm">每个 Agent 只做一件事</div>
      </div>
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl mb-3">🔄</div>
        <div class="font-bold text-white mb-1">一致性更高</div>
        <div class="text-gray-400 text-sm">不会人格混乱</div>
      </div>
      <div class="card rounded-xl p-6 text-center">
        <div class="text-3xl mb-3">📈</div>
        <div class="font-bold text-white mb-1">效率翻倍</div>
        <div class="text-gray-400 text-sm">各司其职，配合默契</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <div class="inline-block px-8 py-4 bg-gradient-to-r from-purple-500 to-cyan-500 rounded-xl font-bold text-lg">
        让 AI 各司其职，效率翻倍 →
      </div>
    </div>
  </div>
</body>
</html>
