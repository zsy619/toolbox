<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master-skill - 汉传祖师大德教学角色生成器</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-16 max-w-4xl">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">
                <span class="gradient-text">Master-skill</span>
            </h1>
            <p class="text-xl text-gray-400">汉传祖师大德教学角色生成器</p>
        </div>

        <div class="bg-red-900/30 rounded-xl p-6 border border-red-800 mb-8">
            <h2 class="text-xl font-bold mb-2 text-red-400">学习痛点</h2>
            <p class="text-gray-300">《瑜伽师地论》不知从何读起？文言难懂，出处难找？</p>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 mb-8">
            <h2 class="text-xl font-bold mb-2 text-green-400">解决方案</h2>
            <p class="text-gray-300">依据历代汉传祖师大德的教学风格，通达 AI 学习伙伴</p>
        </div>

        <div class="grid md:grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-purple-400 mb-2">8 位预置祖师</h3>
                <p class="text-gray-400 text-sm">虚云、智顗、玄奘、鸠摩罗什、慧能、法藏、印光、蕅益</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-2">经文溯源</h3>
                <p class="text-gray-400 text-sm">CBETA ID + 经证引用</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-yellow-400 mb-2">HARD-GATE 铁律</h3>
                <p class="text-gray-400 text-sm">无引证不得写入</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-green-400 mb-2">多平台支持</h3>
                <p class="text-gray-400 text-sm">Claude Code、Cursor、Codex CLI</p>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 text-center">
            <p class="text-lg mb-4">安装</p>
            <code class="text-green-400 text-xl">npx master-skill install --all</code>
        </div>
    </div>
</body>
</html>
