<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master-skill - 汉传祖师大德教学角色生成器</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">
                <span class="gradient-text">Master-skill</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">汉传祖师大德教学角色生成器</p>
        </header>

        <article class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-gray-300">基于佛教经典文献的法师教学角色生成器，由 FoJin 驱动</p>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-purple-400 mb-2">8 位预置祖师</h3>
                <p class="text-gray-300">虚云、智顗、玄奘、鸠摩罗什、慧能、法藏、印光、蕅益</p>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 text-center">
                <code class="text-green-400">npx master-skill install --all</code>
            </div>
        </article>
    </div>
</body>
</html>
