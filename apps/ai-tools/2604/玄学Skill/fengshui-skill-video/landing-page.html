<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>堪舆子 · 传统风水顾问</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-16 max-w-4xl">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">
                <span class="gradient-text">堪舆子</span>
            </h1>
            <p class="text-xl text-gray-400">传统风水顾问</p>
        </div>

        <div class="bg-red-900/30 rounded-xl p-6 border border-red-800 mb-8">
            <h2 class="text-xl font-bold mb-2 text-red-400">痛点</h2>
            <p class="text-gray-300">选房子、看方位缺乏专业参考？居住环境风水不知如何分析？</p>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 mb-8">
            <h2 class="text-xl font-bold mb-2 text-green-400">解决方案</h2>
            <p class="text-gray-300">以江南三元世家传人的视角，运用玄空飞星、八宅明镜、择日学等传统方法</p>
        </div>

        <div class="grid md:grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-purple-400 mb-2">玄空飞星</h3>
                <p class="text-gray-400 text-sm">排布飞星盘，判断旺位凶位</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-2">八宅明镜</h3>
                <p class="text-gray-400 text-sm">四吉四凶方布局建议</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-yellow-400 mb-2">择日学</h3>
                <p class="text-gray-400 text-sm">入宅、开业、动土吉日筛选</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                <h3 class="font-bold text-red-400 mb-2">煞气化解</h3>
                <p class="text-gray-400 text-sm">路冲、天斩、壁刀化解方案</p>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 text-center">
            <p class="text-lg mb-4">安装</p>
            <code class="text-green-400 text-xl">claude install-skill https://github.com/voidforall/fengshui.skill</code>
        </div>
    </div>
</body>
</html>
