<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Skill - AI 塔罗占卜</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0d0a1a; color: #F8FAFC; }
    .article-content { line-height: 1.8; }
    .article-content h2 { font-size: 1.5rem; font-weight: bold; margin: 1.5rem 0 1rem 0; color: #A78BFA; }
    .article-content p { margin-bottom: 1rem; color: #CBD5E1; }
    .highlight-box { background: #1a1428; border-left: 4px solid #8B5CF6; padding: 1rem; margin: 1rem 0; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-2xl mx-auto px-6 py-8">
    <div class="mb-8">
      <div class="text-sm text-purple-400 mb-2">🔮 AI 塔罗</div>
      <h1 class="text-3xl font-bold mb-4 gradient-text">Tarot Skill</h1>
      <p class="text-gray-400">AI 塔罗占卜 Agent Skill</p>
    </div>

    <div class="article-content">
      <div class="highlight-box">
        <p class="text-lg text-white font-medium mb-0">AI 塔罗占卜 Agent Skill，为 Cursor / Claude Code / OpenClaw 等 AI agent 提供专业级塔罗解读能力。</p>
      </div>

      <h2>78 张完整牌义</h2>
      <p>韦特 + 托特 + 现代心理塔罗三大系统融合，每张大阿卡纳含心理原型与托特视角。</p>

      <h2>6 种牌阵</h2>
      <p>单张 / 三牌阵 / 五牌阵 / 月亮牌阵 / 马蹄形 / 凯尔特十字</p>

      <h2>真随机抽牌脚本</h2>
      <p>Python 脚本 draw.py，密码学安全随机源，位置权重、时段因子、正逆位概率全内置。</p>
    </div>
  </div>
  <style>
    .gradient-text { background: linear-gradient(135deg, #8B5CF6, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</body>
</html>
