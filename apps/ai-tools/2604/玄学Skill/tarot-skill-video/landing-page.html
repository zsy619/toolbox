<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Skill - AI 塔罗占卜</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0d0a1a; color: #F8FAFC; }
    .gradient-text { background: linear-gradient(135deg, #8B5CF6, #A78BFA, #C4B5FD); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1a1428; border: 1px solid #4c1d95; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-16 max-w-4xl">
    <div class="text-center mb-12">
      <div class="inline-block px-4 py-2 rounded-full bg-purple-500/20 text-purple-400 text-sm mb-6">🔮 AI 塔罗</div>
      <h1 class="text-4xl md:text-5xl font-bold mb-4 gradient-text">Tarot Skill</h1>
      <p class="text-xl text-gray-400 mb-2">AI 塔罗占卜 Agent Skill</p>
      <p class="text-gray-500">专业级塔罗解读能力</p>
    </div>

    <!-- Problem -->
    <div class="card rounded-2xl p-8 mb-8">
      <h2 class="text-2xl font-bold mb-4 text-center text-purple-400">❌ 传统塔罗的困扰</h2>
      <div class="grid grid-cols-3 gap-4">
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-3xl mb-2">📚</div>
          <div class="font-bold text-white">牌义太多记不住</div>
        </div>
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-3xl mb-2">📋</div>
          <div class="font-bold text-white">牌阵太复杂</div>
        </div>
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-3xl mb-2">🎲</div>
          <div class="font-bold text-white">不知道怎么抽牌</div>
        </div>
      </div>
    </div>

    <!-- Features -->
    <div class="card rounded-2xl p-8 mb-8">
      <h2 class="text-2xl font-bold mb-6 text-center text-purple-400">✅ 核心特性</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-4xl mb-3">🔮</div>
          <div class="font-bold text-white mb-1">78 张完整牌义</div>
          <div class="text-xs text-gray-400">韦特 + 托特 + 现代心理塔罗</div>
        </div>
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-4xl mb-3">📋</div>
          <div class="font-bold text-white mb-1">6 种牌阵</div>
          <div class="text-xs text-gray-400">单张/三牌阵/凯尔特十字...</div>
        </div>
        <div class="text-center p-4 bg-purple-500/10 rounded-xl border border-purple-500/30">
          <div class="text-4xl mb-3">🎲</div>
          <div class="font-bold text-white mb-1">真随机抽牌</div>
          <div class="text-xs text-gray-400">密码学安全随机源</div>
        </div>
      </div>
    </div>

    <!-- Platforms -->
    <div class="card rounded-2xl p-8 mb-8">
      <h2 class="text-2xl font-bold mb-4 text-center text-purple-400">⚡ 支持平台</h2>
      <div class="flex flex-wrap justify-center gap-4">
        <div class="px-6 py-3 bg-purple-500/20 rounded-full text-purple-300 font-bold">Cursor</div>
        <div class="px-6 py-3 bg-purple-500/20 rounded-full text-purple-300 font-bold">Claude Code</div>
        <div class="px-6 py-3 bg-purple-500/20 rounded-full text-purple-300 font-bold">OpenClaw</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <div class="inline-block px-8 py-4 bg-gradient-to-r from-purple-500 to-indigo-500 rounded-xl font-bold text-lg">
        🔮 AI + 塔罗 → 专业级塔罗解读
      </div>
    </div>
  </div>
</body>
</html>
