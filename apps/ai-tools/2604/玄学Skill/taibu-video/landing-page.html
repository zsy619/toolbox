<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台布 (Taibu) - 高精度 AI 算命工具</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-16 max-w-4xl">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">
                <span class="gradient-text">台布 (Taibu)</span>
            </h1>
            <p class="text-xl text-gray-400">🔮 高精度 AI 算命工具</p>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 mb-8">
            <h2 class="text-xl font-bold mb-4 text-purple-400">中国传统术数</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">八字</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">紫微斗数</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">六爻</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">梅花易数</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">奇门遁甲</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">大六壬</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">小六壬</span>
                <span class="bg-gray-700 rounded px-3 py-2 text-sm">太乙神数</span>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-yellow-400 mb-3">西方占卜</h3>
                <p class="text-gray-300">占星术 · 塔罗</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-blue-400 mb-3">心理人格</h3>
                <p class="text-gray-300">MBTI · 面相 · 手相</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-green-400 mb-3">关系配对</h3>
                <p class="text-gray-300">合盘配对</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h3 class="font-bold text-red-400 mb-3">运势预测</h3>
                <p class="text-gray-300">每日/每月运势 · 周公解梦</p>
            </div>
        </div>

        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 text-center">
            <h2 class="text-xl font-bold mb-4 text-green-400">MCP + Skills 支持</h2>
            <p class="text-gray-300 mb-4">支持 MCP 服务和 Skills，接入 AI Agent 系统</p>
            <code class="text-green-400">github.com/hhszzzz/taibu</code>
        </div>
    </div>
</body>
</html>
