<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hue - AI品牌设计系统生成器</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #EC4899; --secondary: #DB2777; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #F472B6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(236,72,153,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(244,114,182,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .badge { display: inline-block; background: rgba(236,72,153,0.2); border: 1px solid rgba(236,72,153,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--accent); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #EC4899, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; letter-spacing: -2px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(236,72,153,0.3); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .cta-section { padding: 4rem 2rem; text-align: center; background: var(--card); }
    .cases { background: rgba(236,72,153,0.1); border: 2px solid var(--primary); border-radius: 16px; padding: 1.5rem 2rem; display: inline-block; margin-top: 1rem; }
    @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="badge">🎨 AI 品牌设计系统</div>
      <h1>hue</h1>
      <p class="subtitle">从网址、名称或截图学习任何品牌，转换为完整的设计系统</p>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">🎨</div>
          <div class="feature-name">色彩标识</div>
          <div class="feature-desc">完整的品牌色彩系统</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✍️</div>
          <div class="feature-name">字体排版</div>
          <div class="feature-desc">专业字体搭配方案</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📐</div>
          <div class="feature-name">间距系统</div>
          <div class="feature-desc">统一的间距规范</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🧩</div>
          <div class="feature-name">组件库</div>
          <div class="feature-desc">完整的 UI 组件系统</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🌓</div>
          <div class="feature-name">明暗模式</div>
          <div class="feature-desc">自动适配亮暗主题</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">⭐</div>
          <div class="feature-name">图标选择</div>
          <div class="feature-desc">统一的图标风格</div>
        </div>
      </div>
    </div>
  </section>
  <section class="cta-section">
    <div style="font-size:1.1rem;font-weight:700;color:var(--accent);">支持 Claude Code 和 Codex</div>
    <div style="font-size:0.9rem;color:var(--muted);margin:0.5rem 0 1rem;">克隆到本地，在对话中描述想要的风格即可</div>
    <div class="cases">
      <div style="font-size:1rem;font-weight:700;color:var(--accent);">17个品牌案例展示</div>
      <div style="font-size:0.85rem;color:var(--muted);margin-top:0.5rem;">每个案例都有设计模型文件和落地页 HTML</div>
    </div>
  </section>
</body>
</html>
