<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoResearch - Karpathy的AI自动研究项目</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #22C55E; --secondary: #16A34A; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #4ADE80; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(74,222,128,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .badge { display: inline-block; background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--accent); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #22C55E, #4ADE80); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; letter-spacing: -2px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .loop { font-size: 3rem; margin: 1.5rem 0; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(34,197,94,0.3); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .cta-section { padding: 4rem 2rem; text-align: center; background: var(--card); }
    .highlight { background: rgba(34,197,94,0.1); border: 2px solid var(--primary); border-radius: 16px; padding: 1.5rem 2rem; display: inline-block; margin-top: 1rem; }
    @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="badge">🧠 Karpathy AI 自动研究</div>
      <h1>AutoResearch</h1>
      <p class="subtitle">给 AI 智能体一个小型的真实 LLM 训练环境，让它通宵自主实验</p>
      <div class="loop">🔄 ↻ 😴 → 📈</div>
      <div style="font-size:1rem;color:var(--muted);margin-top:1rem;">
        修改代码 → 训练5分钟 → 检查结果 → 保留或丢弃 → 重复
      </div>
    </div>
  </section>
  <section class="cta-section">
    <div class="features-grid">
      <div class="feature-card">
        <div class="feature-icon">📝</div>
        <div class="feature-name">program.md</div>
        <div class="feature-desc">基线指令文件</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">⚡</div>
        <div class="feature-name">train.py</div>
        <div class="feature-desc">智能体编辑的唯一文件</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📦</div>
        <div class="feature-name">prepare.py</div>
        <div class="feature-desc">数据准备和运行时工具</div>
      </div>
      <div class="feature-card">
        <div class="feature-icon">⏱️</div>
        <div class="feature-name">5分钟</div>
        <div class="feature-desc">固定训练时间预算</div>
      </div>
    </div>
    <div class="highlight">
      <div style="font-size:1rem;font-weight:700;color:var(--accent);">早上醒来，就能看到实验日志和一个更好的模型</div>
    </div>
  </section>
</body>
</html>
