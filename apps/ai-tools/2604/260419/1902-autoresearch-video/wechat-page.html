<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoResearch - Karpathy的AI自动研究项目</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #fff; color: #1a1a1a; max-width: 680px; margin: 0 auto; padding: 1rem; }
    .header { text-align: center; padding: 2rem 1rem; border-bottom: 1px solid #eee; margin-bottom: 1.5rem; }
    .badge { display: inline-block; background: #f0fdf4; border-radius: 50px; padding: 4px 12px; font-size: 12px; color: #22C55E; margin-bottom: 0.75rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #111; }
    .meta { font-size: 0.8rem; color: #999; }
    .section { margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem; color: #111; border-left: 3px solid #22C55E; padding-left: 0.5rem; }
    p { font-size: 0.95rem; line-height: 1.8; color: #333; margin-bottom: 0.75rem; }
    .flow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .flow-item { background: #f8f9fa; border-radius: 8px; padding: 0.75rem; text-align: center; }
    .flow-item .icon { font-size: 1.25rem; }
    .flow-item .name { font-weight: 600; font-size: 0.85rem; }
    .flow-item .desc { font-size: 0.75rem; color: #666; }
    .footer { text-align: center; padding: 1.5rem; border-top: 1px solid #eee; margin-top: 1.5rem; font-size: 0.8rem; color: #999; }
    .footer a { color: #22C55E; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">🧠 Karpathy AI 自动研究</div>
    <h1>AutoResearch</h1>
    <p class="meta">让 AI 智能体通宵自主实验，早上醒来模型就变强了</p>
  </div>

  <div class="section">
    <h2>🔥 核心思想</h2>
    <p>给 AI 智能体一个小型的真实 LLM 训练环境，让它通宵自主实验。</p>
  </div>

  <div class="section">
    <h2>🔄 自主研究循环</h2>
    <p>修改代码 → 训练5分钟 → 检查结果 → 保留或丢弃 → 重复</p>
  </div>

  <div class="section">
    <h2>📂 项目结构</h2>
    <div class="flow-grid">
      <div class="flow-item">
        <div class="icon">📝</div>
        <div class="name">program.md</div>
        <div class="desc">基线指令文件</div>
      </div>
      <div class="flow-item">
        <div class="icon">⚡</div>
        <div class="name">train.py</div>
        <div class="desc">智能体编辑文件</div>
      </div>
      <div class="flow-item">
        <div class="icon">📦</div>
        <div class="name">prepare.py</div>
        <div class="desc">数据准备工具</div>
      </div>
      <div class="flow-item">
        <div class="icon">⏱️</div>
        <div class="name">5分钟</div>
        <div class="desc">固定训练预算</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>📊 评估指标</h2>
    <p>bits per byte 越低越好</p>
  </div>

  <div class="footer">
    <p>早上醒来，就能看到实验日志和一个更好的模型</p>
  </div>
</body>
</html>
