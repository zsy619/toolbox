<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI时代：不懂AI等于90年代文盲</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0F172A; color: #F8FAFC; font-family: 'PingFang SC', sans-serif; }
    .gradient-text { background: linear-gradient(135deg, #EF4444, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-20 text-center">
    <div class="text-6xl mb-6">⚡</div>
    <h1 class="text-5xl font-bold mb-4 gradient-text">AI时代</h1>
    <p class="text-xl text-gray-400 mb-8">不懂AI等于90年代"文盲"</p>
  </div>
  <div class="container mx-auto px-6 py-16">
    <h2 class="text-3xl font-bold text-center mb-12">三个公式</h2>
    <div class="grid gap-4">
      <div class="bg-red-900/30 rounded-xl p-4 text-center">公式一：AI文盲 = 生产力残疾</div>
      <div class="bg-red-900/30 rounded-xl p-4 text-center">公式二：职业淘汰遵循AI替代优先级</div>
      <div class="bg-red-900/30 rounded-xl p-4 text-center">公式三：AI素养 = 现代读写能力</div>
    </div>
    <h2 class="text-3xl font-bold text-center mb-12 mt-16">普通人破局三招</h2>
    <div class="grid gap-4">
      <div class="bg-emerald-900/30 rounded-xl p-4 text-center">每天30分钟</div>
      <div class="bg-emerald-900/30 rounded-xl p-4 text-center">只练三件事</div>
      <div class="bg-emerald-900/30 rounded-xl p-4 text-center">把AI焊在工作里</div>
    </div>
  </div>
</body>
</html>
