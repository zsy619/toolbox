<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant Alpha - AI界的iPhone时刻</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #10B981; --secondary: #059669; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #34D399; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(16,185,129,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(52,211,153,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .stars-badge { display: inline-block; background: rgba(16,185,129,0.2); border: 1px solid rgba(16,185,129,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--primary); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #10B981, #34D399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; letter-spacing: -2px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .stat-card { background: var(--card); border: 1px solid rgba(16,185,129,0.3); border-radius: 16px; padding: 1.5rem; text-align: center; }
    .stat-value { font-size: 2.5rem; font-weight: 900; color: var(--primary); }
    .stat-label { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .cta-section { padding: 4rem 2rem; text-align: center; background: var(--card); }
    .combo-box { background: rgba(16,185,129,0.1); border: 2px solid var(--primary); border-radius: 16px; padding: 1.5rem 2rem; display: inline-block; margin-top: 1rem; }
    .combo-text { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="stars-badge">🐘 OpenRouter匿名模型</div>
      <h1>Elephant Alpha</h1>
      <p class="subtitle">AI界的iPhone时刻？</p>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">377%</div>
          <div class="stat-label">Token使用量增长</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Top 10</div>
          <div class="stat-label">平台日活前十</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">50%</div>
          <div class="stat-label">Claude Opus消耗</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">33%</div>
          <div class="stat-label">GPT-5.4消耗</div>
        </div>
      </div>
    </div>
  </section>
  <section class="py-16 px-6" style="background: var(--bg);">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-3xl font-bold text-center mb-12">🚀 核心优势</h2>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">⚡</div>
          <div class="feature-name">速度飞快</div>
          <div class="feature-desc">完整代码直接输出，体感和Grok 4 Fast差不多</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">💰</div>
          <div class="feature-name">智效比拉满</div>
          <div class="feature-desc">相同输出质量，token消耗最低</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎯</div>
          <div class="feature-name">纯粹执行机器</div>
          <div class="feature-desc">256K上下文稳如狗，脏活累活全能干</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🤖</div>
          <div class="feature-name">模型分层</div>
          <div class="feature-desc">2026年AI玩家的核心竞争力</div>
        </div>
      </div>
    </div>
  </section>
  <section class="cta-section">
    <div class="combo-box">
      <div class="combo-text">Claude 管规划 · Elephant 管执行</div>
      <div style="font-size:0.9rem;color:var(--muted);margin-top:0.5rem;">效率翻3倍 · 成本砍到十分之一</div>
    </div>
  </section>
</body>
</html>
