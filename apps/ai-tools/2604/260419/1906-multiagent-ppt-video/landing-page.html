<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiAgentPPT - 多智能体协作PPT生成器</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #3B82F6; --secondary: #1E40AF; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #60A5FA; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(59,130,246,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(96,165,250,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .stars-badge { display: inline-block; background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--accent); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900; color: #fff; margin-bottom: 1rem; letter-spacing: -1px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(59,130,246,0.3); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .cta-section { padding: 4rem 2rem; text-align: center; background: var(--card); }
    .code-block { background: #000; border-radius: 12px; padding: 1rem 1.5rem; font-family: 'SF Mono', Monaco, monospace; font-size: 1rem; color: var(--accent); display: inline-block; margin-top: 1rem; border: 1px solid rgba(59,130,246,0.3); }
    .arch-box { background: rgba(59,130,246,0.1); border: 2px solid var(--primary); border-radius: 16px; padding: 1.5rem 2rem; display: inline-block; margin-top: 1rem; }
    @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="stars-badge">🤖 多智能体协作</div>
      <h1>MultiAgentPPT</h1>
      <p class="subtitle">从选题调研到排版成稿，全流程自动化</p>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">🤝</div>
          <div class="feature-name">多智能体分工</div>
          <div class="feature-desc">大纲构建、任务拆分、资料调研、内容汇总各就各位</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">⚡</div>
          <div class="feature-name">流式输出</div>
          <div class="feature-desc">生成过程实时可见，边生成边查看结果</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🔍</div>
          <div class="feature-name">外部检索</div>
          <div class="feature-desc">信息更全、内容更准、质量更稳</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✏️</div>
          <div class="feature-name">在线编辑</div>
          <div class="feature-desc">生成即成稿，细节随时调整</div>
        </div>
      </div>
    </div>
  </section>
  <section class="cta-section">
    <div class="arch-box">
      <div style="font-size:1.1rem;font-weight:700;color:var(--accent);">A2A + MCP + ADK 架构</div>
      <div style="font-size:0.9rem;color:var(--muted);margin-top:0.5rem;">工程化落地，稳定可靠</div>
    </div>
    <div style="margin-top:1.5rem;">
      <div class="code-block">Docker + 数据库一键部署</div>
    </div>
  </section>
</body>
</html>
