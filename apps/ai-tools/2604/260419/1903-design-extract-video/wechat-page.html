<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>designlang - 一行命令逆向网站设计系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #fff; color: #1a1a1a; max-width: 680px; margin: 0 auto; padding: 1rem; }
    .header { text-align: center; padding: 2rem 1rem; border-bottom: 1px solid #eee; margin-bottom: 1.5rem; }
    .badge { display: inline-block; background: #eef2ff; border-radius: 50px; padding: 4px 12px; font-size: 12px; color: #4F46E5; margin-bottom: 0.75rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #111; }
    .meta { font-size: 0.8rem; color: #999; }
    .section { margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem; color: #111; border-left: 3px solid #4F46E5; padding-left: 0.5rem; }
    p { font-size: 0.95rem; line-height: 1.8; color: #333; margin-bottom: 0.75rem; }
    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .feature-item { background: #f8f9fa; border-radius: 8px; padding: 0.75rem; text-align: center; }
    .feature-item .icon { font-size: 1.25rem; }
    .feature-item .name { font-weight: 600; font-size: 0.85rem; }
    .feature-item .desc { font-size: 0.75rem; color: #666; }
    .footer { text-align: center; padding: 1.5rem; border-top: 1px solid #eee; margin-top: 1.5rem; font-size: 0.8rem; color: #999; }
    .footer a { color: #4F46E5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">🔍 设计系统逆向工具</div>
    <h1>designlang</h1>
    <p class="meta">一行命令逆向任何网站的设计系统</p>
  </div>

  <div class="section">
    <h2>🔥 一行命令逆向设计系统</h2>
    <p>designlang——用无头浏览器爬取任何网站，从 DOM 提取计算样式，生成8个输出文件。</p>
    <p>支持 Claude Code、Cursor、Codex 等40+智能体。</p>
  </div>

  <div class="section">
    <h2>📦 8个输出文件</h2>
    <div class="feature-grid">
      <div class="feature-item">
        <div class="icon">📝</div>
        <div class="name">Markdown</div>
        <div class="desc">AI 优化</div>
      </div>
      <div class="feature-item">
        <div class="icon">🎨</div>
        <div class="name">HTML 预览</div>
        <div class="desc">视觉预览</div>
      </div>
      <div class="feature-item">
        <div class="icon">💨</div>
        <div class="name">Tailwind</div>
        <div class="desc">配置</div>
      </div>
      <div class="feature-item">
        <div class="icon">⚛️</div>
        <div class="name">React</div>
        <div class="desc">主题</div>
      </div>
      <div class="feature-item">
        <div class="icon">🎯</div>
        <div class="name">shadcn/ui</div>
        <div class="desc">主题</div>
      </div>
      <div class="feature-item">
        <div class="icon">✒️</div>
        <div class="name">Figma</div>
        <div class="desc">变量</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>✨ 独特功能</h2>
    <p>提取布局模式、WCAG 可访问性评分、4个断点响应行为。</p>
  </div>

  <div class="footer">
    <p>一行命令，生成完整设计系统</p>
  </div>
</body>
</html>
