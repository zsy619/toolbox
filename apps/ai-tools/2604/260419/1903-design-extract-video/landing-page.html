<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>designlang - 一行命令逆向网站设计系统</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    :root { --primary: #4F46E5; --secondary: #4338CA; --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --muted: #94A3B8; --accent: #818CF8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC', -apple-system, sans-serif; min-height: 100vh; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%); position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 50%, rgba(79,70,229,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(129,140,248,0.1) 0%, transparent 50%); }
    .hero-content { text-align: center; position: relative; z-index: 1; padding: 2rem; }
    .badge { display: inline-block; background: rgba(79,70,229,0.2); border: 1px solid rgba(79,70,229,0.4); border-radius: 50px; padding: 8px 20px; font-size: 14px; color: var(--accent); margin-bottom: 1.5rem; }
    .hero h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; background: linear-gradient(135deg, #4F46E5, #818CF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; letter-spacing: -2px; }
    .hero .subtitle { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .feature-card { background: var(--card); border: 1px solid rgba(79,70,229,0.3); border-radius: 16px; padding: 1.5rem; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .feature-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature-name { font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .feature-desc { font-size: 0.85rem; color: var(--muted); }
    .cta-section { padding: 4rem 2rem; text-align: center; background: var(--card); }
    .highlight { background: rgba(79,70,229,0.1); border: 2px solid var(--primary); border-radius: 16px; padding: 1.5rem 2rem; display: inline-block; margin-top: 1rem; }
    @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-content">
      <div class="badge">🔍 设计系统逆向工具</div>
      <h1>designlang</h1>
      <p class="subtitle">一行命令逆向任何网站的设计系统</p>
      <div class="features-grid">
        <div class="feature-card">
          <div class="feature-icon">📝</div>
          <div class="feature-name">Markdown</div>
          <div class="feature-desc">AI 优化的 Markdown 文件</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎨</div>
          <div class="feature-name">视觉预览</div>
          <div class="feature-desc">HTML 视觉预览</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">💨</div>
          <div class="feature-name">Tailwind</div>
          <div class="feature-desc">Tailwind 配置</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">⚛️</div>
          <div class="feature-name">React</div>
          <div class="feature-desc">React 主题</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎯</div>
          <div class="feature-name">shadcn/ui</div>
          <div class="feature-desc">shadcn/ui 主题</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">✒️</div>
          <div class="feature-name">Figma</div>
          <div class="feature-desc">Figma 变量</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🌐</div>
          <div class="feature-name">W3C 标识</div>
          <div class="feature-desc">W3C 设计标识符</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎪</div>
          <div class="feature-name">CSS</div>
          <div class="feature-desc">CSS 自定义属性</div>
        </div>
      </div>
    </div>
  </section>
  <section class="cta-section">
    <div style="font-size:1.1rem;font-weight:700;color:var(--accent);">支持 Claude Code、Cursor、Codex 等 40+ 智能体</div>
    <div style="font-size:0.9rem;color:var(--muted);margin:0.5rem 0 1rem;">提取布局模式 · 评分 WCAG 可访问性 · 捕捉4个断点响应</div>
    <div class="highlight">
      <div style="font-size:1rem;font-weight:700;color:var(--accent);">一行命令，生成完整设计系统</div>
    </div>
  </section>
</body>
</html>
