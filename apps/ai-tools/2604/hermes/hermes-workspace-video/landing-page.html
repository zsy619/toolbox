<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Workspace - WeChat 桥接工具</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0F172A; color: #F8FAFC; }
    .gradient-text { background: linear-gradient(135deg, #3B82F6, #22D3EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: #1E293B; border: 1px solid #334155; }
    .feature-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #3B82F6, #22D3EE); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  </style>
</head>
<body class="min-h-screen">
  <div class="container mx-auto px-6 py-16 max-w-4xl">
    <div class="text-center mb-12">
      <div class="inline-block px-4 py-2 rounded-full bg-blue-500/20 text-blue-400 text-sm mb-6">🤖 开源项目</div>
      <h1 class="text-4xl md:text-5xl font-bold mb-4">Hermes Workspace</h1>
      <p class="text-xl text-gray-400 mb-2">WeChat 桥接工具</p>
      <p class="text-gray-500">在微信中与 Hermes Agent 直接交互</p>
    </div>

    <!-- Features -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
      <div class="card rounded-2xl p-6">
        <div class="feature-icon mb-4">💬</div>
        <h3 class="text-xl font-bold mb-2">WeChat 桥接</h3>
        <p class="text-gray-400">在微信中直接与 Hermes Agent 交互，聊天控制 Agent、接收结果</p>
      </div>
      <div class="card rounded-2xl p-6">
        <div class="feature-icon mb-4">⚡</div>
        <h3 class="text-xl font-bold mb-2">实时 SSE 流</h3>
        <p class="text-gray-400">Agent 输出实时推送，零延迟响应</p>
      </div>
      <div class="card rounded-2xl p-6">
        <div class="feature-icon mb-4">📱</div>
        <h3 class="text-xl font-bold mb-2">移动端优先</h3>
        <p class="text-gray-400">PWA 安装，手机电脑同步体验</p>
      </div>
      <div class="card rounded-2xl p-6">
        <div class="feature-icon mb-4">🔒</div>
        <h3 class="text-xl font-bold mb-2">安全认证</h3>
        <p class="text-gray-400">所有 API 路由认证，数据安全有保障</p>
      </div>
    </div>

    <!-- How It Works -->
    <div class="card rounded-2xl p-8 mb-12">
      <h2 class="text-2xl font-bold mb-6 text-center">使用流程</h2>
      <div class="grid grid-cols-3 gap-4 text-center">
        <div class="p-4">
          <div class="text-3xl font-bold text-blue-400 mb-2">①</div>
          <p class="text-gray-400">部署 Workspace</p>
        </div>
        <div class="p-4">
          <div class="text-3xl font-bold text-blue-400 mb-2">②</div>
          <p class="text-gray-400">配置 WeChat 桥接</p>
        </div>
        <div class="p-4">
          <div class="text-3xl font-bold text-blue-400 mb-2">③</div>
          <p class="text-gray-400">开始聊天控制</p>
        </div>
      </div>
    </div>

    <!-- CTA -->
    <div class="text-center">
      <a href="https://github.com/outsourc-e/hermes-workspace" target="_blank" class="inline-block px-8 py-4 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-xl font-bold text-lg hover:opacity-90 transition">
        GitHub 开源地址 →
      </a>
      <p class="text-gray-500 mt-4">⭐ 欢迎 Star · 开源免费</p>
    </div>
  </div>
</body>
</html>
