<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes-LCM - 损失极低的上下文管理</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0f0f23; color: #e5e5e5; }
        .reading-width { max-width: 680px; margin: 0 auto; }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
        h2 { font-size: 1.5rem; font-weight: 600; margin: 2rem 0 1rem; color: #fff; }
        p { line-height: 1.8; margin-bottom: 1rem; }
        blockquote { border-left: 4px solid #667eea; padding-left: 1rem; color: #9ca3af; margin: 1rem 0; }
    </style>
</head>
<body class="min-h-screen py-12 px-6">
    <article class="reading-width">
        <header class="mb-12 text-center">
            <h1>📊 Hermes-LCM - 损失极低的上下文管理</h1>
            <p class="text-gray-500">层次化 DAG 存储对话历史</p>
        </header>

        <div class="space-y-6">
            <p>传统 AI 对话面临一个核心问题：上下文长度限制导致关键信息丢失。Hermes-LCM 通过层次化 DAG 结构存储对话历史，实现损失极低的上下文管理。</p>

            <h2>核心特性</h2>
            <ul class="list-disc list-inside space-y-2">
                <li><strong>层次化 DAG 存储</strong> - 有向无环图保留对话层次</li>
                <li><strong>低损失压缩</strong> - 最小化信息丢失</li>
                <li><strong>lcm_grep 检索</strong> - 快速检索被压缩的历史</li>
                <li><strong>lcm_expand 展开</strong> - 快速恢复历史</li>
            </ul>

            <h2>技术优势</h2>
            <ul class="list-disc list-inside space-y-2">
                <li>损失极低</li>
                <li>高效检索</li>
                <li>快速展开</li>
                <li>保留层次</li>
            </ul>

            <blockquote>
                让 AI 记住更多
            </blockquote>

            <p class="text-center mt-8">
                <a href="https://github.com/stephenschoettler/hermes-lcm" target="_blank" class="inline-block px-6 py-3 bg-purple-600 rounded-full hover:opacity-90">
                    访问 GitHub
                </a>
            </p>
        </div>
    </article>
</body>
</html>
