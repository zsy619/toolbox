<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes-LCM - 损失极低的上下文管理</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%); }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .glow { box-shadow: 0 0 60px rgba(102,126,234,0.3); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <div class="container mx-auto px-6 py-12 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-16">
            <h1 class="text-5xl font-bold mb-4">Hermes-LCM</h1>
            <p class="text-xl text-gray-400">损失极低的上下文管理</p>
            <p class="text-lg text-purple-400 mt-4">层次化 DAG 存储对话历史</p>
        </header>

        <!-- CTA -->
        <div class="text-center mb-16">
            <a href="https://github.com/stephenschoettler/hermes-lcm" target="_blank" class="inline-block px-8 py-4 bg-gradient-to-r from-purple-600 to-blue-600 rounded-full text-xl font-bold hover:opacity-90 transition glow">
                GitHub - hermes-lcm
            </a>
        </div>

        <!-- Features -->
        <section class="grid md:grid-cols-2 gap-8 mb-16">
            <div class="card p-8">
                <div class="text-4xl mb-4">📊</div>
                <h3 class="text-xl font-bold mb-3">层次化 DAG</h3>
                <p class="text-gray-400">有向无环图存储对话历史，保留层次关系</p>
            </div>
            <div class="card p-8">
                <div class="text-4xl mb-4">🔍</div>
                <h3 class="text-xl font-bold mb-3">lcm_grep 检索</h3>
                <p class="text-gray-400">快速检索被压缩的历史对话</p>
            </div>
            <div class="card p-8">
                <div class="text-4xl mb-4">📜</div>
                <h3 class="text-xl font-bold mb-3">lcm_expand 展开</h3>
                <p class="text-gray-400">快速展开恢复被压缩的历史</p>
            </div>
            <div class="card p-8">
                <div class="text-4xl mb-4">⚡</div>
                <h3 class="text-xl font-bold mb-3">损失极低</h3>
                <p class="text-gray-400">先进的压缩算法，最小化信息丢失</p>
            </div>
        </section>

        <!-- Tech -->
        <section class="card p-8 mb-16">
            <h2 class="text-2xl font-bold mb-6 text-center">技术架构</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                <div class="p-4 bg-white/5 rounded-lg">
                    <div class="font-bold">DAG</div>
                    <div class="text-gray-400 text-sm">层次化存储</div>
                </div>
                <div class="p-4 bg-white/5 rounded-lg">
                    <div class="font-bold">低损失</div>
                    <div class="text-gray-400 text-sm">先进压缩</div>
                </div>
                <div class="p-4 bg-white/5 rounded-lg">
                    <div class="font-bold">快速检索</div>
                    <div class="text-gray-400 text-sm">lcm_grep</div>
                </div>
                <div class="p-4 bg-white/5 rounded-lg">
                    <div class="font-bold">快速展开</div>
                    <div class="text-gray-400 text-sm">lcm_expand</div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="text-center text-gray-500 text-sm">
            <p>让 AI 记住更多</p>
            <p class="mt-2">© Hermes-LCM · GitHub</p>
        </footer>
    </div>
</body>
</html>
