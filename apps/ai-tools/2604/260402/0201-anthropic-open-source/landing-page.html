<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>突发！Anthropic 开源代码库，更名 OpenClaude</title>
  
  <!-- 国内 CDN CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; 
    }
    .gradient-text {
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <!-- Hero Section -->
  <section class="min-h-screen flex flex-col justify-center items-center text-center px-6">
    <div class="animate__animated animate__fadeIn">
      <div class="text-6xl md:text-8xl font-bold mb-4 text-red-500">🚨 突发！</div>
      <h1 class="text-4xl md:text-6xl font-bold mb-6 gradient-text animate__animated animate__fadeIn animate__delay-1s">
        Anthropic 开源了！
      </h1>
      <p class="text-2xl md:text-3xl text-gray-300 mb-8 animate__animated animate__fadeIn animate__delay-2s">
        更名 OpenClaude
      </p>
    </div>
    
    <div class="mt-12 animate__animated animate__fadeIn animate__delay-3s">
      <a href="#details" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-semibold transition-all hover:scale-105 inline-flex items-center">
        <i class="fas fa-arrow-down mr-2"></i>了解更多
      </a>
    </div>
  </section>
  
  <!-- 核心消息 -->
  <section id="details" class="py-20 px-6 bg-gray-800">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">核心消息</h2>
      
      <div class="grid md:grid-cols-3 gap-8">
        <div class="bg-gray-900 p-8 rounded-2xl text-center">
          <div class="text-5xl mb-4">💻</div>
          <h3 class="text-xl font-bold mb-2">开源代码库</h3>
          <p class="text-gray-400">Anthropic 宣布开源全部代码库</p>
        </div>
        
        <div class="bg-gray-900 p-8 rounded-2xl text-center">
          <div class="text-5xl mb-4">🤖</div>
          <h3 class="text-xl font-bold mb-2">更名 OpenClaude</h3>
          <p class="text-gray-400">AI 产品正式更名为 OpenClaude</p>
        </div>
        
        <div class="bg-gray-900 p-8 rounded-2xl text-center">
          <div class="text-5xl mb-4">🌐</div>
          <h3 class="text-xl font-bold mb-2">社区驱动</h3>
          <p class="text-gray-400">代码将通过社区继续存活</p>
        </div>
      </div>
    </div>
  </section>
  
  <!-- CEO 原话 -->
  <section class="py-20 px-6">
    <div class="max-w-3xl mx-auto text-center">
      <h2 class="text-2xl text-gray-400 mb-8">Dario Amodei 表示：</h2>
      <blockquote class="text-2xl md:text-3xl font-serif italic leading-relaxed">
        "如果我们也消失，代码将通过社区继续存活。"
      </blockquote>
    </div>
  </section>
  
  <!-- 行业对比 -->
  <section class="py-20 px-6 bg-gray-800">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-3xl font-bold text-center mb-12">行业对比</h2>
      
      <div class="flex flex-col md:flex-row items-center justify-center gap-12">
        <div class="text-center">
          <div class="text-3xl text-gray-400 mb-4">OpenAI</div>
          <div class="text-5xl font-bold text-red-500 mb-4">闭源</div>
          <div class="text-gray-500">逐渐消失</div>
        </div>
        
        <div class="text-4xl text-white">vs</div>
        
        <div class="text-center">
          <div class="text-3xl text-gray-400 mb-4">OpenClaude</div>
          <div class="text-5xl font-bold text-green-500 mb-4">开源</div>
          <div class="text-gray-500">社区永存</div>
        </div>
      </div>
    </div>
  </section>
  
  <!-- 视频展示 -->
  <section class="py-20 px-6">
    <div class="max-w-2xl mx-auto text-center">
      <h2 class="text-3xl font-bold mb-8">观看视频</h2>
      <video controls class="w-full rounded-xl shadow-2xl" style="max-width: 400px; margin: 0 auto;">
        <source src="./video-project/out/video.mp4" type="video/mp4">
        您的浏览器不支持视频播放
      </video>
    </div>
  </section>
  
  <!-- Footer -->
  <footer class="py-12 px-6 bg-gray-900 text-center">
    <p class="text-gray-500">#AI #科技 #开源</p>
    <p class="text-gray-600 mt-4">关注我，了解更多 AI 动态</p>
  </footer>
</body>
</html>
