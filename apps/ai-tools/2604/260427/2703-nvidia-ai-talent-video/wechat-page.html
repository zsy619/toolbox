<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英伟达 CEO 黄仁勋：AI 时代的人才观</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-800">
    <div class="container mx-auto px-6 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">英伟达 CEO 黄仁勋：AI 时代，我只雇佣懂 AI 的人</h1>
            <p class="text-sm text-gray-500 mt-2">元曜科技 · 2026-04-24</p>
        </header>

        <article class="space-y-6 text-gray-700 leading-relaxed">
            <div class="bg-gray-100 rounded-lg p-6">
                <p class="text-lg">
                    "我会优先雇佣那个精通 AI 的毕业生，而不是那个不懂 AI 的人。每次都是这样。"
                </p>
                <p class="text-sm text-gray-500 mt-2 text-right">—— 英伟达 CEO 黄仁勋</p>
            </div>

            <section>
                <h2 class="text-lg font-bold mb-3 text-gray-900">现在有两类人</h2>
                
                <div class="bg-red-50 rounded-lg p-4 mb-4">
                    <h3 class="font-bold text-red-600 mb-2">第一类：被动等待者</h3>
                    <p>还在聊天窗口里输入提示词，按下回车，然后祈祷结果。</p>
                </div>
                
                <div class="bg-green-50 rounded-lg p-4">
                    <h3 class="font-bold text-green-600 mb-2">第二类：主动创造者</h3>
                    <p>已经做出了一个 AI 代理，并把它卖了 10 万美元。把趋势变成了杠杆。</p>
                </div>
            </section>

            <section class="bg-gray-100 rounded-lg p-6">
                <p class="text-lg text-red-600">第一类：会被取代</p>
                <p class="text-lg text-green-600 mt-2">第二类：会成为独自创办十亿美元公司的创始人</p>
            </section>

            <section class="text-center pt-6">
                <p class="text-xl text-gray-800 font-bold">你属于哪一类？</p>
            </section>
        </article>

        <footer class="mt-12 pt-6 border-t border-gray-200 text-center text-gray-500 text-sm">
            <p>欢迎关注公众号：元曜科技</p>
        </footer>
    </div>
</body>
</html>
