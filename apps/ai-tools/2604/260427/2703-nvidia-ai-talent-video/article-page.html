<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英伟达 CEO 黄仁勋：AI 时代的人才观</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">
                <span class="gradient-text">AI 时代，我只雇佣懂 AI 的人</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">—— 英伟达 CEO 黄仁勋</p>
        </header>

        <article class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-lg text-gray-200 leading-relaxed">
                    "我会优先雇佣那个精通 AI 的毕业生，而不是那个不懂 AI 的人。每次都是这样。"
                </p>
            </div>

            <div class="bg-red-900/30 rounded-xl p-6 border border-red-800">
                <h3 class="text-lg font-bold mb-3 text-red-400">第一类：被动等待者</h3>
                <p class="text-gray-300">还在聊天窗口里输入提示词<br>按下回车，然后祈祷结果</p>
            </div>

            <div class="bg-green-900/30 rounded-xl p-6 border border-green-800">
                <h3 class="text-lg font-bold mb-3 text-green-400">第二类：主动创造者</h3>
                <p class="text-gray-300">已经做出了一个 AI 代理<br>并把它卖了 10 万美元</p>
            </div>

            <div class="text-center pt-6">
                <p class="text-xl text-gray-400">你属于哪一类？</p>
            </div>
        </article>
    </div>
</body>
</html>
