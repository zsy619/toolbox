<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="AI 时代的人才观">
  <meta property="og:description" content="—— 英伟达 CEO 黄仁勋">
  <meta property="og:type" content="website">
  <title>AI 时代的人才观</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #10B981 0%, #3B82F6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #10B98120; border: 2px solid #10B981; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #3B82F6; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #10B981; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #10B981, #3B82F6); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #10B98120, #3B82F620); border: 2px solid #10B981; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#10B98110 1px, transparent 1px), linear-gradient(90deg, #10B98110 1px, transparent 1px), linear-gradient(#3B82F608 1px, transparent 1px), linear-gradient(90deg, #3B82F608 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #3B82F6; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    
    <div class="highlight-box"><p>"我会优先雇佣那个精通 AI 的毕业生<br>而不是那个不懂 AI 的人。每次都是这样。"</p></div>

    <div class="features">
      <div class="feature-row"><div class="feature-icon">👔</div><div class="feature-text"><strong>第一类：被动等待者</strong> — 还在聊天窗口里输入提示词，按下回车然后祈祷结果</div></div>
      <div class="feature-row"><div class="feature-icon">🚀</div><div class="feature-text"><strong>第二类：主动创造者</strong> — 已经做出了一个 AI 代理，并把它卖了 10 万美元</div></div>
    </div>

    <div class="highlight-box" style="border-color: #10B981; background: linear-gradient(135deg, #10B98120, #3B82F620);"><p>第一类会被取代<br>第二类会成为独自创办十亿美元公司的创始人</p></div>

    <div class="links">
      <span>你属于哪一类？</span>
    </div>

  </div>
</body>
</html>
