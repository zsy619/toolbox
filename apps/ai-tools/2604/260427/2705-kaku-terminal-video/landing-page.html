<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Kaku">
  <meta property="og:description" content="为 AI 编码而生的终端">
  <meta property="og:type" content="website">
  <title>Kaku</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #10B981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #10B98120; border: 2px solid #10B981; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #059669; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #10B981; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #10B981, #059669); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #10B98120, #05966920); border: 2px solid #10B981; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#10B98110 1px, transparent 1px), linear-gradient(90deg, #10B98110 1px, transparent 1px), linear-gradient(#05966908 1px, transparent 1px), linear-gradient(90deg, #05966908 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #059669; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    
    <div class="stats">
      <div class="stat-item"><div class="stat-num">Zero</div><div class="stat-label">Config</div></div>
      <div class="stat-item"><div class="stat-num">40%</div><div class="stat-label">更小包体</div></div>
      <div class="stat-item"><div class="stat-num">AI</div><div class="stat-label">助手内置</div></div>
    </div>

    <div class="features">
      <div class="feature-row"><div class="feature-icon">⚡</div><div class="feature-text"><strong>Zero Config</strong> — JetBrains Mono + macOS 字体渲染，开箱即用</div></div>
      <div class="feature-row"><div class="feature-icon">🚀</div><div class="feature-text"><strong>Fast &amp; Lightweight</strong> — 40% 更小的包，即时启动</div></div>
      <div class="feature-row"><div class="feature-icon">🤖</div><div class="feature-text"><strong>AI 助手内置</strong> — 错误修复 + 自然语言转命令</div></div>
      <div class="feature-row"><div class="feature-icon">🔌</div><div class="feature-text"><strong>WezTerm 兼容</strong> — Lua 配置完全兼容</div></div>
    </div>

    <div class="highlight-box"><p>为 AI 编码而生的终端<br>更快、更轻、更智能</p></div>

    <div class="cta-group">
      <a href="https://github.com/tw93/kakuku" target="_blank" class="cta-btn">安装</a>
    </div>

  </div>
</body>
</html>
