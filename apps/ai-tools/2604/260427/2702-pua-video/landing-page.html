<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="PUA">
  <meta property="og:description" content="让 AI 不敢偷懒的技能插件">
  <meta property="og:type" content="website">
  <title>PUA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #EF4444 0%, #F97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #EF444420; border: 2px solid #EF4444; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #F97316; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #EF4444; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #EF4444, #F97316); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #EF444420, #F9731620); border: 2px solid #EF4444; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#EF444410 1px, transparent 1px), linear-gradient(90deg, #EF444410 1px, transparent 1px), linear-gradient(#F9731608 1px, transparent 1px), linear-gradient(90deg, #F9731608 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #F97316; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    
    <div class="stats">
      <div class="stat-item"><div class="stat-num">5</div><div class="stat-label">大偷懒模式</div></div>
      <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">大鞭策模块</div></div>
      <div class="stat-item"><div class="stat-num">∞</div><div class="stat-label">效率翻倍</div></div>
    </div>

    <div class="features">
      <div class="feature-row"><div class="feature-icon">💪</div><div class="feature-text"><strong>PUA 话术</strong> — 让 AI 不敢放弃，穷尽所有方案才允许放弃</div></div>
      <div class="feature-row"><div class="feature-icon">🔧</div><div class="feature-text"><strong>调试方法论</strong> — 让 AI 有能力不放弃，有工具有步骤地解决问题</div></div>
      <div class="feature-row"><div class="feature-icon">⚡</div><div class="feature-text"><strong>能动性鞭策</strong> — 让 AI 主动出击而不是被动等待</div></div>
    </div>

    <div class="highlight-box"><p>用中西大厂 PUA 话术<br>驱动 Coding Agent 效率翻倍</p></div>

    <div class="cta-group">
      <a href="https://github.com/tanweai/pua" target="_blank" class="cta-btn">GitHub</a>
    </div>

  </div>
</body>
</html>
