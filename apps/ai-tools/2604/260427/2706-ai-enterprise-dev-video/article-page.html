<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业级开发中的 AI 应用策略</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">
                <span class="gradient-text">"AI First" 难以落地？</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">企业级开发的现实挑战</p>
        </header>

        <article class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-lg text-red-400 font-bold mb-2">信息壁垒</p>
                <p class="text-gray-300">庞大且复杂的内部架构才是大模型难以跨越的信息壁垒</p>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-lg text-yellow-400 font-bold mb-2">AI 缺乏"隐性知识"</p>
                <p class="text-gray-300">未记录在档的业务妥协、历史架构演进、特定的合规要求</p>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-lg text-green-400 font-bold mb-2">务实策略</p>
                <p class="text-white font-bold mb-2">"人工主导，AI 辅助"</p>
                <p class="text-gray-300">开发人员深入理解业务细节，将带有明确约束的指令交给 AI 执行</p>
            </div>

            <div class="text-center pt-6">
                <p class="text-xl text-gray-400">务实比理想更重要</p>
            </div>
        </article>
    </div>
</body>
</html>
