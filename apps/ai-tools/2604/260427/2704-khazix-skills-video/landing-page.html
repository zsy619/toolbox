<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Khazix Skills">
  <meta property="og:description" content="数字生命卡兹克的 AI 工具箱">
  <meta property="og:type" content="website">
  <title>Khazix Skills</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #8B5CF620; border: 2px solid #8B5CF6; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #EC4899; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #8B5CF6; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #8B5CF6, #EC4899); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #8B5CF620, #EC489920); border: 2px solid #8B5CF6; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#8B5CF610 1px, transparent 1px), linear-gradient(90deg, #8B5CF610 1px, transparent 1px), linear-gradient(#EC489908 1px, transparent 1px), linear-gradient(90deg, #EC489908 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #EC4899; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    
    <div class="stats">
      <div class="stat-item"><div class="stat-num">Prompts</div><div class="stat-label">轻量即用</div></div>
      <div class="stat-item"><div class="stat-num">Skills</div><div class="stat-label">自动加载</div></div>
      <div class="stat-item"><div class="stat-num">开放</div><div class="stat-label">Agent Skills 标准</div></div>
    </div>

    <div class="features">
      <div class="feature-row"><div class="feature-icon">💡</div><div class="feature-text"><strong>Prompts</strong> — 轻量级，复制粘贴到任何 AI 对话或 Deep Research 里就能用</div></div>
      <div class="feature-row"><div class="feature-icon">⚙️</div><div class="feature-text"><strong>Skills</strong> — 重量级，遵循 Agent Skills 开放标准，安装后 Agent 自动加载</div></div>
      <div class="feature-row"><div class="feature-icon">📊</div><div class="feature-text"><strong>hv-analysis</strong> — 横纵分析法深度研究 Skill，自动联网收集信息，输出 PDF 报告</div></div>
      <div class="feature-row"><div class="feature-icon">✍️</div><div class="feature-text"><strong>khazix-writer</strong> — 公众号长文写作 Skill，含风格规则、四层自检体系和示例库</div></div>
    </div>

    <div class="highlight-box"><p>Prompts + Skills 合集<br>让方法论变成可复用的工具</p></div>

    <div class="cta-group">
      <a href="https://github.com/KKKKhazix/khazix-skills" target="_blank" class="cta-btn">GitHub</a>
    </div>

  </div>
</body>
</html>
