<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Web Access">
  <meta property="og:description" content="给 AI Agent 装上完整联网能力">
  <meta property="og:type" content="website">
  <title>Web Access</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #0A0A14; color: #F8FAFC; }
    .container { max-width: 1080px; margin: 0 auto; padding: 60px 40px; text-align: center; }
    h1 { font-size: 72px; font-weight: 800; margin-bottom: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15; }
    .subtitle { font-size: 32px; color: #808090; margin-bottom: 48px; line-height: 1.5; }
    .features { text-align: left; max-width: 860px; margin: 0 auto 48px; }
    .feature-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
    .feature-icon { width: 48px; height: 48px; background: #667eea20; border: 2px solid #667eea; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 20px; flex-shrink: 0; font-size: 24px; }
    .feature-text { font-size: 24px; color: #F8FAFC; line-height: 1.6; }
    .feature-text strong { color: #764ba2; }
    .stats { display: flex; justify-content: center; gap: 48px; margin: 48px 0; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 48px; font-weight: 800; color: #667eea; }
    .stat-label { font-size: 20px; color: #808090; margin-top: 6px; }
    .cta-group { display: flex; justify-content: center; gap: 20px; margin-top: 48px; flex-wrap: wrap; }
    .cta-btn { display: inline-block; padding: 16px 40px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 50px; font-size: 24px; text-decoration: none; font-weight: 600; border: none; transition: opacity 0.2s; }
    .cta-btn:hover { opacity: 0.85; }
    .highlight-box { background: linear-gradient(135deg, #667eea20, #764ba220); border: 2px solid #667eea; border-radius: 16px; padding: 28px 36px; margin: 40px auto; max-width: 650px; }
    .highlight-box p { font-size: 24px; color: #F8FAFC; font-weight: 600; }
    .grid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#667eea10 1px, transparent 1px), linear-gradient(90deg, #667eea10 1px, transparent 1px), linear-gradient(#764ba208 1px, transparent 1px), linear-gradient(90deg, #764ba208 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 50px 50px, 50px 50px; pointer-events: none; z-index: -1; }
    .links { margin-top: 48px; font-size: 20px; color: #808090; }
    .links a { color: #764ba2; text-decoration: none; margin: 0 12px; }
    @media (max-width: 640px) { h1 { font-size: 48px; } .subtitle { font-size: 24px; } .feature-text { font-size: 20px; } .container { padding: 40px 20px; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    
    <div class="stats">
      <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">种联网策略</div></div>
      <div class="stat-item"><div class="stat-num">CDP</div><div class="stat-label">浏览器直连</div></div>
      <div class="stat-item"><div class="stat-num">∞</div><div class="stat-label">站点经验</div></div>
    </div>

    <div class="features">
      <div class="feature-row"><div class="feature-icon">🔗</div><div class="feature-text"><strong>联网工具自动选择</strong> — WebSearch / WebFetch / curl / Jina / CDP</div></div>
      <div class="feature-row"><div class="feature-icon">🌐</div><div class="feature-text"><strong>CDP Proxy 浏览器操作</strong> — 直连 Chrome，携带登录态</div></div>
      <div class="feature-row"><div class="feature-icon">⚡</div><div class="feature-text"><strong>并行分治</strong> — 子 Agent 并行执行，tab 级隔离</div></div>
      <div class="feature-row"><div class="feature-icon">📚</div><div class="feature-text"><strong>站点经验积累</strong> — 跨 session 复用，越用越聪明</div></div>
    </div>

    <div class="highlight-box"><p>联网策略 + CDP 浏览器操作 + 站点经验积累<br>一站式 AI 联网解决方案</p></div>

    <div class="cta-group">
      <a href="https://github.com/eze-is/web-access" target="_blank" class="cta-btn">GitHub</a>
      <a href="https://github.com/eze-is/web-access" target="_blank" class="cta-btn" style="background: transparent; border: 2px solid #667eea;">安装指南</a>
    </div>

  </div>
</body>
</html>
