<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Access - 给 AI Agent 装上完整联网能力</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">
                <span class="gradient-text">Web Access</span>
            </h1>
            <p class="text-gray-400 text-sm mt-2">给 AI Agent 装上完整联网能力</p>
        </header>

        <article class="space-y-6">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-lg font-bold mb-2 text-red-400">痛点</h2>
                <p class="text-gray-300">WebSearch、WebFetch 缺少调度策略和浏览器自动化能力</p>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-lg font-bold mb-2 text-green-400">解决方案</h2>
                <p class="text-gray-300">联网策略 + CDP 浏览器操作 + 站点经验积累</p>
            </div>

            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <h2 class="text-lg font-bold mb-2 text-purple-400">安装</h2>
                <code class="text-green-400">npx skills add eze-is/web-access</code>
            </div>
        </article>
    </div>
</body>
</html>
