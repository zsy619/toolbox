<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drawnix - 一个画布搞定所有绘图</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0D0221 0%, #1a0a2e 50%, #0D0221 100%); min-height: 100vh; color: #fff; }
    .container { max-width: 540px; margin: 0 auto; padding: 20px; }
    .hero { text-align: center; padding: 60px 0 40px; }
    .badge { display: inline-block; background: linear-gradient(135deg, #00FFFF, #FF00FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    .title { font-size: 64px; font-weight: 800; background: linear-gradient(135deg, #00FFFF, #FF00FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; line-height: 1.2; }
    .subtitle { color: #8888AA; font-size: 20px; line-height: 1.6; margin-bottom: 24px; }
    .modes { display: flex; justify-content: center; gap: 24px; margin-top: 24px; }
    .mode { text-align: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,255,0.2); border-radius: 16px; padding: 16px 24px; }
    .mode-icon { font-size: 36px; margin-bottom: 8px; }
    .mode-name { font-size: 14px; color: #00FFFF; }
    .features { padding: 40px 0; }
    .feature { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,255,0.2); border-radius: 16px; padding: 24px; margin-bottom: 16px; transition: all 0.3s; }
    .feature:hover { border-color: #00FFFF; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
    .feature-title { font-size: 20px; font-weight: 700; color: #00FFFF; margin-bottom: 8px; }
    .feature-desc { color: #8888AA; font-size: 15px; line-height: 1.6; }
    .cta { text-align: center; padding: 40px 0; }
    .cta-btn { display: inline-block; background: linear-gradient(135deg, #00FFFF, #9D00FF); color: #0D0221; font-size: 18px; font-weight: 700; padding: 16px 48px; border-radius: 50px; text-decoration: none; transition: all 0.3s; }
    .cta-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,255,0.5); }
    .links { display: flex; justify-content: center; gap: 24px; margin-top: 20px; }
    .link { color: #8888AA; text-decoration: none; font-size: 14px; transition: color 0.3s; }
    .link:hover { color: #00FFFF; }
    .footer { text-align: center; padding: 40px 0; color: #8888AA; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="badge">🔥 GitHub Trending</div>
      <h1 class="title">Drawnix</h1>
      <p class="subtitle">一个画布搞定所有绘图<br>思维导图 / 流程图 / 自由绘画</p>
      <div class="modes">
        <div class="mode"><div class="mode-icon">🎯</div><div class="mode-name">思维导图</div></div>
        <div class="mode"><div class="mode-icon">📊</div><div class="mode-name">流程图</div></div>
        <div class="mode"><div class="mode-icon">🎨</div><div class="mode-name">自由绘画</div></div>
      </div>
    </div>
    <div class="features">
      <div class="feature">
        <div class="feature-title">📝 Markdown → 思维导图</div>
        <div class="feature-desc">输入 Markdown，一键生成结构化思维导图，立刻可视化</div>
      </div>
      <div class="feature">
        <div class="feature-title">🔲 Mermaid → 流程图</div>
        <div class="feature-desc">输入 Mermaid 语法，直接转换为流程图，省去重复画图</div>
      </div>
      <div class="feature">
        <div class="feature-title">∞ 无限画布</div>
        <div class="feature-desc">可无限缩放、可自由滚动，灵感不受限制</div>
      </div>
      <div class="feature">
        <div class="feature-title">💾 自动保存</div>
        <div class="feature-desc">随时自动保存，支持移动端，随时续画</div>
      </div>
    </div>
    <div class="cta">
      <a href="https://github.com/plait-board/drawnix" class="cta-btn">立即体验 →</a>
      <div class="links">
        <a href="https://github.com/plait-board/drawnix" class="link">GitHub</a>
        <a href="#" class="link">演示站点</a>
      </div>
    </div>
    <div class="footer"><p>插件化架构 · 无限画布 · 自动保存</p></div>
  </div>
</body>
</html>
