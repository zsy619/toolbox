<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Drawnix - 一个画布搞定所有绘图</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; color: #333; line-height: 1.8; }
    .container { max-width: 540px; margin: 0 auto; padding: 20px; }
    .header { padding: 30px 0 20px; text-align: center; border-bottom: 2px solid #f0f0f0; margin-bottom: 24px; }
    .account { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .account-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #00FFFF, #9D00FF); border-radius: 50%; }
    .account-name { font-size: 14px; color: #666; }
    .title { font-size: 26px; font-weight: 800; line-height: 1.4; color: #1a1a1a; margin-bottom: 12px; }
    .meta { font-size: 13px; color: #999; }
    .cover { width: 100%; aspect-ratio: 2.35/1; background: linear-gradient(135deg, #0D0221, #1a0a2e); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
    .cover-text { font-size: 36px; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(0,255,255,0.5); }
    .content { font-size: 16px; }
    .section { margin-bottom: 20px; }
    .section-title { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
    .section-text { color: #444; }
    .highlight { background: #f8f9fa; border-left: 4px solid #00FFFF; padding: 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
    .highlight-text { color: #00FFFF; font-size: 16px; font-weight: 600; }
    .feature-list { list-style: none; padding: 0; }
    .feature-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .feature-item:last-child { border-bottom: none; }
    .feature-icon { font-size: 18px; }
    .feature-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .feature-desc { color: #666; font-size: 14px; }
    .cta-section { text-align: center; padding: 24px 0; }
    .cta-btn { display: inline-block; background: linear-gradient(135deg, #00FFFF, #9D00FF); color: #fff; font-size: 15px; font-weight: 600; padding: 12px 32px; border-radius: 50px; text-decoration: none; }
    .footer { text-align: center; padding: 24px 0; border-top: 1px solid #f0f0f0; margin-top: 20px; }
    .footer-text { color: #999; font-size: 12px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .tag { background: #f0f0f0; color: #666; font-size: 12px; padding: 4px 10px; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="account"><div class="account-icon"></div><span class="account-name">元曜科技</span></div>
      <h1 class="title">GitHub 热榜！一个画布搞定所有绘图！</h1>
      <div class="meta">2026-04-27 · 3分钟阅读</div>
    </div>
    <div class="cover"><span class="cover-text">Drawnix · 一个画布搞定所有</span></div>
    <div class="content">
      <div class="section"><div class="section-text">今天给大家介绍一个最近很火的开源项目——<strong>Drawnix</strong>。</div></div>
      <div class="highlight"><div class="highlight-text">一个画布搞定所有绘图——思维导图、流程图、自由绘画</div></div>
      <div class="section">
        <h2 class="section-title">核心亮点</h2>
        <ul class="feature-list">
          <li class="feature-item"><span class="feature-icon">📝</span><div><div class="feature-name">Markdown → 思维导图</div><div class="feature-desc">一键生成，立刻可视化</div></div></li>
          <li class="feature-item"><span class="feature-icon">🔲</span><div><div class="feature-name">Mermaid → 流程图</div><div class="feature-desc">语法直转图形，省去重复画图</div></div></li>
          <li class="feature-item"><span class="feature-icon">∞</span><div><div class="feature-name">无限画布</div><div class="feature-desc">可缩放、可滚动，灵感不受限</div></div></li>
        </ul>
      </div>
      <div class="cta-section"><a href="https://github.com/plait-board/drawnix" class="cta-btn">立即体验 →</a></div>
      <div class="tag-list">
        <span class="tag">绘图工具</span><span class="tag">效率神器</span><span class="tag">GitHub</span>
        <span class="tag">思维导图</span><span class="tag">流程图</span><span class="tag">设计师</span>
      </div>
    </div>
    <div class="footer"><div class="footer-text">插件化架构 · 开源免费</div></div>
  </div>
</body>
</html>
