<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deerflow</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size: 17px; line-height: 1.8; color: #333; background: #FFF; margin: 0; padding: 0; }
    .container { max-width: 677px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 20px; color: #1a1a1a; }
    .meta { text-align: center; font-size: 14px; color: #999; margin-bottom: 24px; }
    p { font-size: 17px; color: #333; margin-bottom: 16px; }
    .stats { display: flex; justify-content: space-around; margin: 24px 0; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: #2563EB; }
    .stat-label { font-size: 13px; color: #666; }
    .footer { text-align: center; padding: 24px 0; border-top: 1px solid #E5E5E5; color: #999; font-size: 14px; }
    .tags { margin-top: 20px; }
    .tag { display: inline-block; background: #F3F4F6; color: #666; padding: 4px 12px; border-radius: 12px; font-size: 13px; margin: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deerflow</h1>
    <div class="meta">元曜科技 · 2026-04-25</div>
    <p>这是一款创新的AI工具，帮助用户高效完成复杂任务，提高效率，降低成本。完全免费，开源可用。</p>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">免费</div><div class="stat-label">开源可用</div></div>
      <div class="stat-item"><div class="stat-num">高效</div><div class="stat-label">提升效率</div></div>
      <div class="stat-item"><div class="stat-num">简单</div><div class="stat-label">易于上手</div></div>
    </div>
    <div class="tags">
      <span class="tag">#AI</span><span class="tag">#科技</span><span class="tag">#工具</span><span class="tag">#开源</span>
    </div>
    <div class="footer"><p>视频号：元曜科技</p><p style="font-size:12px;color:#CCC">来源：项目文档</p></div>
  </div>
</body>
</html>
