    <style>
    /* ============== 字体栈 ============== */
    /* 优先思源宋体（开源、跨平台），降级系统宋体 */
    :root {
        --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Source Han Serif CN',
                      'Songti SC', 'STSong', 'SimSun', '宋体', serif;
        --font-kai:   'Noto Serif SC', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
        --font-sans:  'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                      'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', sans-serif;
    }

    /* ============== 主题变量 ============== */
    :root {
        --bg-color: #F5EDE0;
        --bg-card: #FBF7EE;
        --bg-elevated: #EDE4D2;
        --text-primary: #2A2419;
        --text-secondary: #5A4F3D;
        --text-muted: #8A7F68;
        --border: #D9CDB2;
        --border-light: #E8DCC2;
        --accent: #A0522D;
        --accent-light: #B8704E;
        --accent-soft: #D4A77A;
        --shadow: rgba(80, 50, 20, 0.08);
        --shadow-strong: rgba(80, 50, 20, 0.15);
        --highlight: rgba(160, 82, 45, 0.08);
    }

    /* 纯白 */
    [data-bg-color="white"] {
        --bg-color: #FFFFFF;
        --bg-card: #FCFCFC;
        --bg-elevated: #F4F4F4;
        --text-primary: #1A1A1A;
        --text-secondary: #4A4A4A;
        --text-muted: #888888;
        --border: #E0E0E0;
        --border-light: #EEEEEE;
        --accent: #2563EB;
        --accent-light: #3B82F6;
        --accent-soft: #93C5FD;
        --shadow: rgba(0, 0, 0, 0.05);
        --shadow-strong: rgba(0, 0, 0, 0.1);
        --highlight: rgba(37, 99, 235, 0.08);
    }

    /* 护眼绿 */
    [data-bg-color="green"] {
        --bg-color: #E5EDD8;
        --bg-card: #EEF3E2;
        --bg-elevated: #D8E3C0;
        --text-primary: #2A3520;
        --text-secondary: #4A5A3A;
        --text-muted: #6A7A5A;
        --border: #BFCDA8;
        --border-light: #D2DEBC;
        --accent: #5A8A3A;
        --accent-light: #7AAA5A;
        --accent-soft: #A8C688;
        --shadow: rgba(40, 60, 20, 0.08);
        --shadow-strong: rgba(40, 60, 20, 0.15);
        --highlight: rgba(90, 138, 58, 0.1);
    }

    /* 暗夜黑 */
    [data-bg-color="dark"] {
        --bg-color: #14181F;
        --bg-card: #1E232C;
        --bg-elevated: #2A2F38;
        --text-primary: #E5E2DA;
        --text-secondary: #A8A398;
        --text-muted: #6A6458;
        --border: #34394A;
        --border-light: #2A2F3A;
        --accent: #E8A55C;
        --accent-light: #F5C587;
        --accent-soft: #8A6A3E;
        --shadow: rgba(0, 0, 0, 0.4);
        --shadow-strong: rgba(0, 0, 0, 0.6);
        --highlight: rgba(232, 165, 92, 0.12);
    }

    /* 暖米色（默认） */
    [data-bg-color="paper"] {
        --bg-color: #F5EDE0;
        --bg-card: #FBF7EE;
        --bg-elevated: #EDE4D2;
        --text-primary: #2A2419;
        --text-secondary: #5A4F3D;
        --text-muted: #8A7F68;
        --border: #D9CDB2;
        --border-light: #E8DCC2;
        --accent: #A0522D;
        --accent-light: #B8704E;
        --accent-soft: #D4A77A;
        --shadow: rgba(80, 50, 20, 0.08);
        --shadow-strong: rgba(80, 50, 20, 0.15);
        --highlight: rgba(160, 82, 45, 0.08);
    }

    /* 羊皮卷 */
    [data-bg-color="sepia"] {
        --bg-color: #F0E5C8;
        --bg-card: #F8EFD8;
        --bg-elevated: #E5D6B0;
        --text-primary: #3D2F1F;
        --text-secondary: #5C4A35;
        --text-muted: #8A7A60;
        --border: #C9B68A;
        --border-light: #DCC8A0;
        --accent: #8B4513;
        --accent-light: #A0522D;
        --accent-soft: #B8704E;
        --shadow: rgba(120, 90, 50, 0.15);
        --shadow-strong: rgba(120, 90, 50, 0.25);
        --highlight: rgba(139, 69, 19, 0.1);
    }

    /* 灰蓝 */
    [data-bg-color="gray"] {
        --bg-color: #ECEEF2;
        --bg-card: #F4F6FA;
        --bg-elevated: #DCE0E8;
        --text-primary: #1F2937;
        --text-secondary: #4A5568;
        --text-muted: #6A7488;
        --border: #C8CFD8;
        --border-light: #DDE2EA;
        --accent: #4A5568;
        --accent-light: #6A7488;
        --accent-soft: #94A0B0;
        --shadow: rgba(0, 0, 0, 0.06);
        --shadow-strong: rgba(0, 0, 0, 0.12);
        --highlight: rgba(74, 85, 104, 0.08);
    }

    /* 雪青 */
    [data-bg-color="lavender"] {
        --bg-color: #EFEAF4;
        --bg-card: #F6F2FA;
        --bg-elevated: #DDD2E8;
        --text-primary: #2D2438;
        --text-secondary: #504060;
        --text-muted: #786890;
        --border: #C8BCD4;
        --border-light: #DDD0E5;
        --accent: #6B4A8A;
        --accent-light: #8A6AAA;
        --accent-soft: #B098D0;
        --shadow: rgba(60, 40, 80, 0.08);
        --shadow-strong: rgba(60, 40, 80, 0.15);
        --highlight: rgba(107, 74, 138, 0.1);
    }

    /* ============== 字体大小 ============== */
    [data-font-size="small"]   { --reading-font-size: 15px; --reading-line-height: 1.75; }
    [data-font-size="medium"]  { --reading-font-size: 17px; --reading-line-height: 1.85; }
    [data-font-size="large"]   { --reading-font-size: 19px; --reading-line-height: 1.95; }
    [data-font-size="xlarge"]  { --reading-font-size: 22px; --reading-line-height: 2.05; }
    [data-font-size="xxlarge"] { --reading-font-size: 26px; --reading-line-height: 2.15; }

    /* ============== 行高覆盖 ============== */
    [data-line-height="compact"][data-font-size="small"]   { --reading-line-height: 1.6; }
    [data-line-height="compact"][data-font-size="medium"]  { --reading-line-height: 1.7; }
    [data-line-height="compact"][data-font-size="large"]   { --reading-line-height: 1.8; }
    [data-line-height="compact"][data-font-size="xlarge"]  { --reading-line-height: 1.9; }
    [data-line-height="compact"][data-font-size="xxlarge"] { --reading-line-height: 2.0; }
    [data-line-height="loose"][data-font-size="small"]   { --reading-line-height: 2.0; }
    [data-line-height="loose"][data-font-size="medium"]  { --reading-line-height: 2.1; }
    [data-line-height="loose"][data-font-size="large"]   { --reading-line-height: 2.2; }
    [data-line-height="loose"][data-font-size="xlarge"]  { --reading-line-height: 2.3; }
    [data-line-height="loose"][data-font-size="xxlarge"] { --reading-line-height: 2.4; }

    /* ============== 基础重置 ============== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: var(--font-serif);
        background: var(--bg-color);
        color: var(--text-primary);
        line-height: var(--reading-line-height);
        min-height: 100vh;
        transition: background 0.3s ease, color 0.3s ease;
        font-size: var(--reading-font-size);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }

    button { font-family: var(--font-sans); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ============== 无障碍跳链 ============== */
    .skip-link {
        position: absolute;
        top: -100px;
        left: 12px;
        background: var(--accent);
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        z-index: 9999;
        text-decoration: none;
        font-weight: 600;
        transition: top 0.2s;
    }
    .skip-link:focus { top: 12px; outline: none; }

    /* ============== 顶部导航 ============== */
    .reader-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-color);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        background: color-mix(in srgb, var(--bg-color) 88%, transparent);
    }
    .reader-header-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: 60px;
    }
    .reader-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text-primary);
        min-width: 0;
    }
    .reader-brand-icon {
        font-size: 24px;
        flex-shrink: 0;
        filter: grayscale(0.2);
    }
    .reader-brand-text { min-width: 0; }
    .reader-brand-title {
        font-size: 15px;
        font-weight: 700;
        font-family: var(--font-kai);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 1px;
    }
    .reader-brand-sub {
        font-size: 11px;
        color: var(--text-muted);
        font-family: var(--font-sans);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .reader-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 10px;
    }
    .toolbar-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        width: 32px;
        height: 32px;
        border-radius: 7px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.2s;
        font-weight: 600;
        font-family: var(--font-sans);
    }
    .toolbar-btn:hover {
        background: var(--bg-card);
        color: var(--text-primary);
    }
    .toolbar-btn[aria-pressed="true"] {
        background: var(--accent);
        color: white;
        box-shadow: 0 2px 6px var(--shadow);
    }
    .toolbar-divider {
        width: 1px;
        height: 20px;
        background: var(--border);
    }
    .toolbar-mobile-toggle { display: none; }

    /* ============== 主体布局 ============== */
    .reader-layout {
        display: flex;
        max-width: 1400px;
        margin: 0 auto;
        min-height: calc(100vh - 60px);
    }

    /* ============== 侧边栏 ============== */
    .reader-sidebar {
        width: 290px;
        flex-shrink: 0;
        background: var(--bg-card);
        border-right: 1px solid var(--border);
        height: calc(100vh - 60px);
        overflow-y: auto;
        position: sticky;
        top: 60px;
    }
    .reader-sidebar-header {
        padding: 20px 22px 16px;
        border-bottom: 1px solid var(--border-light);
        position: sticky;
        top: 0;
        background: var(--bg-card);
        z-index: 2;
    }
    .reader-sidebar-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-kai);
        letter-spacing: 1px;
    }
    .reader-sidebar-meta {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 12px;
        font-family: var(--font-sans);
    }
    .reader-progress-bar {
        height: 4px;
        background: var(--bg-elevated);
        border-radius: 2px;
        overflow: hidden;
    }
    .reader-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-light));
        transition: width 0.3s;
        width: 0%;
    }
    .reader-episode-list { list-style: none; padding: 10px 0 30px; }
    .reader-episode-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 22px;
        cursor: pointer;
        border-left: 3px solid transparent;
        transition: all 0.2s;
        position: relative;
    }
    .reader-episode-item:hover { background: var(--bg-elevated); }
    .reader-episode-item.is-active {
        background: var(--bg-elevated);
        border-left-color: var(--accent);
    }
    .reader-episode-item.is-active::after {
        content: '';
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 24px;
        background: var(--accent);
        border-radius: 2px 0 0 2px;
    }
    .reader-episode-item.is-read .episode-list-num {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }
    .episode-list-num {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--bg-elevated);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
        border: 1px solid var(--border);
        font-family: var(--font-kai);
    }
    .reader-episode-item.is-active .episode-list-num {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
        box-shadow: 0 2px 8px var(--shadow);
    }
    .episode-list-info { flex: 1; min-width: 0; }
    .episode-list-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 2px;
        font-family: var(--font-kai);
        letter-spacing: 0.5px;
    }
    .reader-episode-item.is-active .episode-list-title { color: var(--accent); }
    .episode-list-subtitle {
        font-size: 11px;
        color: var(--text-secondary);
        font-family: var(--font-sans);
        font-weight: 400;
        margin-bottom: 3px;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.85;
    }
    .reader-episode-item.is-active .episode-list-subtitle { color: var(--accent-light); opacity: 1; }
    .episode-list-meta {
        font-size: 11px;
        color: var(--text-muted);
        font-family: var(--font-sans);
    }

    /* ============== 主阅读区 ============== */
    .reader-main {
        flex: 1;
        min-width: 0;
        padding: 50px 60px 100px;
        max-width: 920px;
        margin: 0 auto;
        width: 100%;
    }
    .reader-article { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ============== 章首装饰 ============== */
    .reader-episode-header {
        margin-bottom: 40px;
        text-align: center;
        position: relative;
    }
    .episode-eyebrow {
        display: inline-block;
        font-family: var(--font-kai);
        font-size: 13px;
        color: var(--accent);
        letter-spacing: 6px;
        padding: 4px 16px;
        margin-bottom: 14px;
        border-top: 1px solid var(--accent-soft);
        border-bottom: 1px solid var(--accent-soft);
        text-indent: 6px; /* 弥补 letter-spacing 视觉偏移 */
    }
    .reader-episode-num {
        display: inline-block;
        font-family: var(--font-kai);
        font-size: 14px;
        font-weight: 700;
        color: white;
        background: var(--accent);
        padding: 5px 18px;
        border-radius: 4px;
        margin-bottom: 18px;
        letter-spacing: 4px;
        text-indent: 4px;
        box-shadow: 0 2px 8px var(--shadow);
        position: relative;
    }
    .reader-episode-num::before,
    .reader-episode-num::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 8px;
        height: 8px;
        background: var(--bg-color);
        border: 1px solid var(--accent);
        transform: translateY(-50%) rotate(45deg);
    }
    .reader-episode-num::before { left: -4px; }
    .reader-episode-num::after { right: -4px; }
    .reader-episode-title {
        font-size: 30px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.4;
        letter-spacing: 1px;
        font-family: var(--font-kai);
        margin: 14px 0 22px;
        padding: 0 12px;
    }
    .reader-episode-meta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--text-muted);
        font-family: var(--font-sans);
    }
    .meta-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-light);
        border-radius: 20px;
    }
    .meta-divider {
        color: var(--accent-soft);
        user-select: none;
    }

    /* 章首装饰横线 */
    .episode-divider {
        margin: 28px auto 0;
        text-align: center;
        color: var(--accent-soft);
        font-size: 14px;
        letter-spacing: 12px;
        position: relative;
    }
    .episode-divider::before,
    .episode-divider::after {
        content: '';
        display: inline-block;
        width: 60px;
        height: 1px;
        background: var(--accent-soft);
        vertical-align: middle;
        margin: 0 16px;
    }

    /* ============== 正文排版 ============== */
    .reader-episode-content {
        font-size: var(--reading-font-size);
        line-height: var(--reading-line-height);
        color: var(--text-primary);
        font-family: var(--font-serif);
        letter-spacing: 0.3px;
    }
    .reader-paragraph {
        margin-bottom: 1.4em;
        text-align: justify;
        text-justify: inter-ideograph;
        word-break: break-word;
        text-indent: 2em; /* 中文段落首行缩进 */
        position: relative;
    }
    /* 首段：取消首行缩进，配首字下沉 */
    .reader-paragraph.is-first {
        text-indent: 0;
    }
    /* 首字下沉 */
    .reader-paragraph.is-first::first-letter {
        font-family: var(--font-kai);
        font-size: 3.6em;
        font-weight: 700;
        color: var(--accent);
        float: left;
        line-height: 0.95;
        margin: 0.08em 0.12em 0 -0.05em;
        padding: 0;
    }
    /* 包含中文双引号的样式增强 */
    .reader-paragraph .quote-cn {
        color: var(--accent);
        font-weight: 500;
    }

    /* ============== 章末装饰 ============== */
    .episode-end {
        text-align: center;
        margin: 50px 0 40px;
        font-family: var(--font-kai);
        color: var(--text-muted);
        font-size: 14px;
        letter-spacing: 8px;
        text-indent: 8px;
        position: relative;
    }
    .episode-end::before,
    .episode-end::after {
        content: '';
        display: inline-block;
        width: 40px;
        height: 1px;
        background: var(--border);
        vertical-align: middle;
        margin: 0 18px;
    }

    /* ============== 章节导航 ============== */
    .reader-episode-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 50px;
        padding-top: 36px;
        border-top: 1px dashed var(--border);
    }
    .reader-nav-btn {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 18px 22px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        text-decoration: none;
        color: var(--text-primary);
        transition: all 0.25s;

    "paragraphs": [
      "有一位人类专家作为思考伙伴是很好的——就是那种可以一起讨论事情的人。但如果身边没有人类专家，AI——它实际上对很多事情都了解很多——可以是一个非常好的资源。我们将一起看多个例子，但首先从头脑风暴开始，这是一个很好的用例。",
      "现在，我知道很多人让AI帮忙头脑风暴点子列表，但有比仅仅让它生成列表更有效的使用方式。让我告诉你我的意思。",
      "根据OpenAI发布的数据，分析ChatGPT对话，大约一半的ChatGPT对话是请求写作和实用指导。实际上，创意构思占所有对话的3.9%或将近4%。我发现使用AI帮我头脑风暴非常有价值。让我和你分享一些方法。",
      "AI在生成选项方面可以相当不错。有一个常见的创造力测试，要求人们说出砖头的200种潜在用途。所以给它一块砖头，你能想到多少种用途？这实际上相当困难。有些人觉得它可以当镇纸、也许当花盆，也可以用来建房子，但想出200个例子并不容易。但如果你问AI模型，它很有机会想出很长的想法列表。而你真正的角色——如果你实际上想用砖头做点什么——是评估这些选项，挑选你喜欢的那些。头脑风暴的常见指导是：想法越多越好。所以有时让AI为你生成大量想法供你选择，可以是找到一个或两个好想法的有力方式。",
      "所以这是AI作为头脑风暴伙伴的更常见用法。我想展示一种不同形式的头脑风暴——你给它更多上下文，然后也与AI迭代更长时间，也就是说进行更长的来回对话，帮你获得更好的选项。",
      "所以如果你告诉它\"帮我制定一个健身计划，38岁，初级水平，10磅哑铃，每天15分钟\"，那么它可能会给出相当通用的答案，比如三个健身计划，从10个深蹲、10个俯卧撑开始——相当合理，非常明智的常识性答案。但如果你想要更有创意的选项，给它更多上下文会有帮助。所以如果你说\"我坚持不了这些，给我一些保持动力的小窍门，我有一个蹦床和一只猫\"，通过鼓励它给你蹦床和猫相关的锻炼选项——这是一种不同寻常的锻炼方式——它可能会让你考虑蹦床休息或猫咪触发式微型锻炼，比如也许每次你看到猫摇尾巴之类的，就做一个小锻炼。但这些当然更有创意。",
      "AI模型有一些内在的创造力，因为它们在互联网上的大量文本上训练过，涵盖了很多不同的想法，包括一些有创意的。AI的输出有一点随机性。所以如果你多次问它\"帮我制定健身计划\"，它可能会给你略有不同的答案。但如果你给AI基本的问题，那么常识性的、相对通用的回应——比如深蹲、俯卧撑等——更有可能出现。",
      "让我画一个概念图，水平轴上，我要标出回应有多独特、多有创意——从左边像正常的举重运动（比如二头肌弯举，非常常识的），到稍微更独特的，比如单腿站着头上顶瑜伽砖，到真正有创意的，比如猫咪触发式微型锻炼。垂直轴上，我要标出AI给出这些不同回应的概率。事实证明，它给出常识性回应的可能性远高于高度独特创意的回应。这是有原因的：它在互联网文本上训练过，互联网上关于哑铃弯举的文本比关于猫咪触发式微型锻炼的文本多得多。对大多数问题来说，这其实没问题，因为互联网上的平均信息可能是相当实事求是的。所以当你寻找信息时，比如\"世界上最高的建筑是什么\"——实际上是哈利法塔——大多数互联网文本会说哈利法塔。有较少量的文本会提其他建筑，但对于\"最高建筑是什么\"这样的问题，互联网上最常见的回应通常就是事实性的。",

      "那么如果你想要从AI那里获得高质量的、更有创意的想法，应该怎么做？我们已经看到，用基本提示，你会从常识空间获得回应。但如果你给AI模型更多上下文——给它年龄、水平，还告诉它你有迷你蹦床和一只猫、很难坚持做深蹲——那么这个上下文会把它推到更相关和更有创意的空间，它更有可能给出定制化的答案，而不是生成常识性的答案。",
      "现在，头脑风暴时我们面临的一个问题是：如果你试图想出创意点子，你有很多上下文可能可以给AI模型，你应该优先告诉它什么？原来有一种技术对于决定给AI模型什么上下文非常有帮助，那就是与AI迭代。让我告诉你我的意思。",
      "如果我想让AI帮我头脑风暴计划——比如还债计划——我有1100美元的信用卡债务，利率19%，每月最低还款40美元，一笔学生贷款利率8%，还有一笔家庭借款。这提供了不错的背景上下文。然后你可以做的是，不要让AI只给你一个选项或告诉你该怎么做，而是让它给你多个选项选择——我通常会要求3到5个选项。AI可能会提出几个不同的计划。计划一是流动性优先，保留现金；计划二是优先还最高利率贷款；计划三是优先偿还家庭借款。这些都是合理的好想法，我还没有给它足够的上下文来知道哪个计划最适合。原来找出应该给AI什么额外上下文的一个非常好的方法，就是对你呈现的选项给它反馈。高度相关的反馈可以让它给你下一组选项。",
      "\"我不喜欢选项一，太被动了。我确实喜欢还掉19%利率贷款的想法。哦，我忘了，我实际上有450美元的现金即将到手，而且我很快要搬回家。\"然后有了这些额外的上下文和对计划一、二、三的反馈，你喜欢什么不喜欢什么，你可以让它创建三个新计划。然后再次通过对这些计划给出反馈，你在给额外的上下文来帮助塑造AI模型的思考。你可以像这样继续迭代一段时间，直到它想出一个你确实喜欢的计划，然后也许让它详细展开你最满意的一两个计划的细节。我发现给AI关于它提出的好想法的反馈，是一种非常高效的机制，可以非常有效地找出什么是有用的上下文可以给AI。",
      "总结一下，如果你在头脑风暴，考虑尽可能提前给AI相关的上下文，然后要求它给出几个选项。然后对不同的选项给出反馈，要求更多选项，多次迭代——给更多选项、给反馈、给更多选项、给反馈——这样重复几次，直到你有一个或多个满意的想法。如果你遵循这个头脑风暴的方法，我认为你会发现你会持续获得更有用和更有创意的想法。",
      "现在，你听我用了\"上下文\"这个词很多次了。给AI模型正确的上下文很重要，这样它才知道足够的信息来做你想要的事。让我们看看下一个视频，了解上下文是如何工作的，以及它如何用来产生回应。"

    "paragraphs": [
      "根据心理学家的说法，大多数人类在同一时间只能在工作记忆中保持大约七件事。这就是为什么记住大约七项的购物清单勉强可以做到——如果你不是同时在想所有东西——但记住15或20项的购物清单就困难得多。有趣的是，AI可以使用大量的上下文。一些模型可以有数十万词的上下文大小。让我们看看AI模型的上下文是如何工作的，以及你如何利用它。",
      "AI模型可以阅读和推理非常大量的上下文。例如，如果你在选择公寓，你可以上传数百页的租赁合同，上传10条评论和社区统计数据，让AI阅读所有这些，并告诉你每个选项的优缺点。你可能会写这样一个提示：\"每个公寓的优缺点，阅读所有内容，在回答之前认真思考。\"顺便说一下，告诉AI认真思考、真的努力思考，是另一种常见的提示模式，我们稍后还会回到这个话题。",
      "上下文指的是模型用来生成对你查询的定制回应的所有文本和文件。如果你给它一个像\"学物理和学动物学的优缺点\"这样的提示，那么它会基于你给它的这个非常有限的提示——非常有限的上下文——来生成输出，回应可能相当笼统。但如果你给它更多上下文——也许给它你的职业评估结果，给它你的高中课表——这样它就知道你上了什么课。然后问同样的问题，所有这些额外的上下文将帮助它给出更定制化、可能更高质量的回应。",
      "如果你在考虑给AI模型什么上下文，想想一个可信赖的顾问需要什么信息才能长时间思考、推理，然后给你的问题一个好答案。一个对你一无所知的聪明顾问，如果只是被问\"学物理和学动物学的优缺点\"，他们能做的最好也就是给一个相当通用的回应，不是针对你的，因为上面那个例子中的上下文没有任何特定于你的内容。",
      "AI模型从一些内置上下文开始，目前领先的AI模型可以接受大约75万词作为上下文——这大约相当于前四或五本哈利·波特书的内容。所以这是很多文本，或者相当于好几天的持续讲话。所以很多人低估了你可以给AI模型多少信息或多少上下文。",
      "现在，当你问AI模型问题时，默认情况下上下文由几部分填充。首先，有一个叫做系统提示的东西，通常AI模型通过它知道当前日期、知道自己模型的名称、基本功能，也许还有对用户有帮助的一般指令。然后如果你的AI模型能够使用工具如网络搜索引擎，在这个上下文中也会有关于这些工具的书面描述以及如何使用——比如什么是网络搜索引擎，它应该如何使用网络搜索引擎。在你写提示之前，上下文包括系统提示和工具定义。当你写提示时，你的提示被添加到AI模型的上下文中，然后它会使用所有这些东西作为输入来生成回应，比如\"适合上半身减脂但低冲击力量的选项\"。",
      "你写的提示——即输入文本——以及AI的回应被称为聊天历史，聊天历史也会逐步添加到AI模型的上下文中。现在，如果你一开始给AI模型更多上下文——比如更长的提示，也许还上传一些文档来告诉它更多关于你的锻炼计划或锻炼偏好的信息——那么所有这些文件都可以被包含到AI模型的上下文中并用于生成回应。",

      "随着AI模型变得更好，它们执行长时间任务的能力迅速增长。这是一个由Meter组织做的研究，绘制了不同难度水平的任务——按人类完成任务所需时间来衡量——作为纵轴。AI能把这些任务做得多好？例如，在网上查找一个事实这样的任务可能只需人类几秒钟，总结几份文件可能需要一小时，读一篇博客文章需要几小时，审计法律文件或探索复杂的网络安全漏洞可能需要人类很多小时等等。在2024-2025年左右，模型开始能够完成从几秒到几分钟到几十分钟的任务。到了2025年，模型开始对需要人类越来越长时间的任务有不错的成功率，以至于现在AI模型可以完成需要人类很多小时才能完成的任务。通常AI模型不需要10小时来完成人类需要10小时的任务，但也不只是几秒钟。这就是最近模型所实现的——让AI能够长时间思考以完成这些更复杂的任务。",
      "如果你记得哈米尔的谜语，比如只需要人类几秒钟就能完成的，几年前AI模型有时会做错。在那个时代——也许是2023、2024年——你可能听过建议说\"告诉AI模型一步一步地思考\"。那时候这是好建议，但这个建议现在基本上过时了，我不再告诉AI模型一步一步思考。相反，我更可能只是告诉它\"认真思考\"，它知道这意味着什么——它应该深入推理，不一定是按步骤，而是用更复杂的方式来成功完成任务。所以与其把AI想成是数谜语、草莓中有多少个r、需要一步一步思考的，今天你可以问AI模型更复杂的问题，比如这些车之间的权衡是什么，或者看看所有这些上下文帮我创建一个定制播客脚本。",

      "如果你在考虑远程工作与办公室工作的优缺点，你问它\"你不觉得远程工作比办公室工作更好吗？\"问题中的措辞暴露了你希望答案是什么，AI可能会说\"是的，远程工作有很多优势\"。相比之下，如果你问\"办公室工作是否确实更有生产力？\"它可能会同意你办公室工作有这些强大的好处。所以根据你提问的方式，它倾向于强化你自己的偏好、你自己的偏见。这可能对做出客观的、基于事实的决策不太有帮助。",
      "在《华盛顿邮报》关于ChatGPT回应的研究中，它更有可能用\"没错\"、\"好观点\"、\"你在正确的轨道上\"这样的短语回应，而不是\"不太对\"、\"情况并非如此\"或\"实际上\"。事实上，它强烈同意的倾向大约是不同意的10倍。ChatGPT的一些模型会说出类似\"兄弟，你刚才说了一些深刻的东西，我1000%同意\"这样的话。虽然有些用户欣赏AI这样同意他们，但我个人不觉得AI只是倾向于同意我说的任何话——即使我不对——有什么用。",
      "虽然领先的AI模型公司正在努力减少谄媚效应，但这仍然是一个问题。模型使用人类反馈来训练成为有用的助手，这强化了谄媚效应。例如，如果你问AI模型\"我觉得内向更好，你不觉得吗？\"如果AI模型回应\"这是一个有趣的想法。以下是我倾向于同意的原因\"，那么大多数人更可能点击反馈按钮的竖大拇指，因为这是一个好的答案，让人感觉好。但如果AI说\"不一定，内向和外向两种类型都有各自的权衡\"，人们不会觉得答案那么好，所以他们不太可能竖大拇指，甚至可能点大拇指朝下。因为这种类型的反馈，AI被训练成更多产生导向竖大拇指正面反馈的答案，学会了试图突然同意人们的频率高于不同意，这就导致了谄媚效应。谄媚效应感觉有帮助，但实际上降低了答案质量。",
      "有时谄媚效应可能更容易发现——如果你说\"我真的为这篇文章感到骄傲，你觉得怎么样？\"嗯，它可能会同意你。但其他时候谄媚效应更难发现——如果你说\"分析这些数据，找出本季度所有正面的绩效指标\"，你在微妙地暗示你在寻找公司绩效的正面指标，所以它更有可能说\"数据清楚显示快速增长、强劲留存、改善利润率\"之类的话，而不太可能指出问题。",

      "在OpenAI的一项研究中，写作占人们要求ChatGPT执行任务的24%。这是最大的一组任务。写作实际上是一种思考。我发现当我在写作时，我必须思考。所以AI——它非常擅长思考和推理——可以帮助你。但只是让AI替你写，通常会导致AI废话——即听起来像AI写作的文字，不知怎的感觉与人类的思考和写作不同。让我们看看一些让AI有效为你写作的技巧，以及如何利用AI推理并避免AI废话。",
      "什么构成了AI废话？很多人注意到AI写作经常包含破折号（em dash），比正常人类写作多得多。在社交媒体网站Blue Sky上，自从ChatGPT发布以来，破折号的使用量一直在上升。最近一项调查显示，40%的美国雇员在上个月收到了工作中的AI废话。\"AI废话\"这个词指的是AI生成的内容，如果你不仔细阅读看起来还不错。也许每句话单独读起来似乎写得很好，但整体上文本缺乏实质内容，感觉像没有多少深入或仔细的思考就写出来的。",
      "AI废话的一个特点是它经常包含这样的句子：\"但它确实改变了一切。\"这是模糊的、空洞的，但不知怎的又过于重要感十足的文本。AI独特的写作风格来自某些它倾向于过度使用的词汇和模式。AI倾向于使用更少的独特词汇，过度代表某些词和短语。例如，AI倾向于过度使用\"nuanced\"（微妙的）和\"delve\"（深入探讨）这两个词。它倾向于使用三重列表多于大多数人。它倾向于使用少数感叹词，导致像\"这是一篇结构严谨、极具洞察力的论文\"这样的短语。还有\"这不是x而是y\"——\"不仅仅是关于速度，是关于可用性。\"事实上，我在社交媒体上注意到更多这种\"不是x而是y\"类型的措辞，通常x和y都是模糊的东西。比如\"这不是关于基础设施，是关于架构。\"很多这样的短语只是模糊的，不反映深刻的洞察。",

        if (n < 20) return '十' + map[n - 10];
        if (n < 100) {

        const contentHtml = ep.paragraphs
            .map((p, idx) => {
                const cls = idx === 0 ? 'reader-paragraph is-first' : 'reader-paragraph';
                return `<p class="${cls}">${decorateParagraph(p)}</p>`;
            })
            .join('');
        $('#article-content').innerHTML = contentHtml;

        // 上下集导航
        const prevEp = EPISODES_DATA.find(e => e.id === state.currentEpisode - 1);
        const nextEp = EPISODES_DATA.find(e => e.id === state.currentEpisode + 1);

        const prevBtn = $('#nav-prev');
        const nextBtn = $('#nav-next');

        if (prevEp) {
            prevBtn.classList.remove('is-disabled');
            prevBtn.removeAttribute('aria-disabled');
            $('#nav-prev-title').textContent = `第 ${numToCn(prevEp.id)} 集`;
        } else {
            prevBtn.classList.add('is-disabled');
            prevBtn.setAttribute('aria-disabled', 'true');
            $('#nav-prev-title').textContent = '已是第一集';
        }

        if (nextEp) {
            nextBtn.classList.remove('is-disabled');
            nextBtn.removeAttribute('aria-disabled');
            $('#nav-next-title').textContent = `第 ${numToCn(nextEp.id)} 集`;
        } else {
            nextBtn.classList.add('is-disabled');
            nextBtn.setAttribute('aria-disabled', 'true');
            $('#nav-next-title').textContent = '已是最后一集';
        }

        // 同步 URL hash
        history.replaceState(null, '', `#episode-${ep.id}`);

        // 同步侧边栏 active
        $$('.reader-episode-item').forEach(item => {
            const id = parseInt(item.getAttribute('data-episode-id'), 10);
            item.classList.toggle('is-active', id === state.currentEpisode);
        });

        // 标记当前章节已读
        state.readSet.add(state.currentEpisode);
        saveReadSet(state.readSet);
        updateProgress();

        // 触发重新动画
        const article = $('#reader-article');
        article.style.animation = 'none';
        void article.offsetWidth;
        article.style.animation = '';
    }

    // ====== 进度更新 ======
    function updateProgress() {
        const percent = Math.round((state.readSet.size / EPISODES_DATA.length) * 100);
        $('#progress-fill').style.width = percent + '%';
        $('#read-percent').textContent = percent + '%';
    }

    // ====== 切换到指定集 ======
    function switchToEpisode(epId) {
        epId = parseInt(epId, 10);
        if (epId < 1 || epId > EPISODES_DATA.length) return;
        if (epId === state.currentEpisode) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
        }
        state.currentEpisode = epId;
        savePref(STORAGE_KEYS.currentEpisode, epId);
        savePref(STORAGE_KEYS.scrollPosition, 0);
        renderCurrentEpisode();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (window.innerWidth <= 1024) {
            toggleSidebar(false);
        }
    }

    // ====== 字号调节 ======
    const FONT_SIZES = ['small', 'medium', 'large', 'xlarge', 'xxlarge'];
    function setFontSize(size) {
        if (!FONT_SIZES.includes(size)) return;
        state.fontSize = size;
        savePref(STORAGE_KEYS.fontSize, size);
        document.documentElement.setAttribute('data-font-size', size);
    }
    function adjustFontSize(delta) {
        const idx = FONT_SIZES.indexOf(state.fontSize);
        const newIdx = Math.max(0, Math.min(FONT_SIZES.length - 1, idx + delta));
        setFontSize(FONT_SIZES[newIdx]);
    }

    // ====== 行高调节 ======
    function setLineHeight(size) {
        state.lineHeight = size;
        savePref(STORAGE_KEYS.lineHeight, size);
        document.documentElement.setAttribute('data-line-height', size);
        applySettings();
    }

    // ====== 底色切换 ======
    function setBgColor(color) {
        state.bgColor = color;
        savePref(STORAGE_KEYS.bgColor, color);
        document.documentElement.setAttribute('data-bg-color', color);
        applySettings();
    }

    // ====== 侧边栏开关 ======
    function toggleSidebar(force) {
        const sidebar = $('#reader-sidebar');
        const overlay = $('#sidebar-overlay');
        const isOpen = sidebar.classList.contains('is-open');
        const shouldOpen = force !== undefined ? force : !isOpen;

        if (shouldOpen) {
            sidebar.classList.add('is-open');
            overlay.classList.add('is-open');
        } else {
            sidebar.classList.remove('is-open');
            overlay.classList.remove('is-open');
        }
    }

    // ====== 回到顶部按钮 + 进度条 ======
    function setupBackToTop() {
        const btn = $('#back-top');
        const progressBar = $('#reading-progress');
        window.addEventListener('scroll', () => {
            btn.classList.toggle('is-visible', window.scrollY > 400);
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (window.scrollY / docHeight) * 100 : 0;
            progressBar.style.width = progress + '%';
        }, { passive: true });

        btn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    // ====== 阅读位置记忆 ======
    let scrollSaveTimer = null;
    let pendingRestoreScroll = 0;
    function setupScrollMemory() {
        const savedScroll = parseInt(loadPref(STORAGE_KEYS.scrollPosition, '0'), 10) || 0;
        pendingRestoreScroll = savedScroll;

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (pendingRestoreScroll > 0) {
                    window.scrollTo(0, pendingRestoreScroll);
                }
            });
        });

        window.addEventListener('scroll', () => {
            if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(() => {
                savePref(STORAGE_KEYS.scrollPosition, window.scrollY);
            }, 500);
        }, { passive: true });
    }

    // ====== 事件绑定 ======
    function bindEvents() {
        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            e.preventDefault();
            const action = btn.getAttribute('data-action');
            switch (action) {
                case 'font-decrease': adjustFontSize(-1); break;
                case 'font-increase': adjustFontSize(+1); break;
                case 'line-compact': setLineHeight('compact'); break;
                case 'line-comfortable': setLineHeight('comfortable'); break;
                case 'line-loose': setLineHeight('loose'); break;
                case 'toggle-sidebar': toggleSidebar(); break;
                case 'prev-episode': switchToEpisode(state.currentEpisode - 1); break;
                case 'next-episode': switchToEpisode(state.currentEpisode + 1); break;
            }
        });

        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-bg-btn]');
            if (!btn) return;
            e.preventDefault();
            setBgColor(btn.getAttribute('data-bg-btn'));
        });

        $('#episode-list').addEventListener('click', (e) => {
            const item = e.target.closest('[data-episode-id]');
            if (!item) return;
            switchToEpisode(item.getAttribute('data-episode-id'));
        });

        $('#episode-list').addEventListener('keydown', (e) => {
            const item = e.target.closest('[data-episode-id]');
            if (!item) return;
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                switchToEpisode(item.getAttribute('data-episode-id'));
            }
        });

        $('#sidebar-overlay').addEventListener('click', () => toggleSidebar(false));

        document.addEventListener('keydown', (e) => {
            if (e.target.matches('input, textarea, select')) return;

            if (e.key === 'ArrowLeft' && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                switchToEpisode(state.currentEpisode - 1);
            } else if (e.key === 'ArrowRight' && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                switchToEpisode(state.currentEpisode + 1);
            } else if (e.key === '+' || e.key === '=') {
                if (e.metaKey || e.ctrlKey) {
                    e.preventDefault();
                    adjustFontSize(+1);
                }
            } else if (e.key === '-') {
                if (e.metaKey || e.ctrlKey) {
                    e.preventDefault();
                    adjustFontSize(-1);
                }
            }
        });

        window.addEventListener('hashchange', () => {
            const m = location.hash.match(/^#episode-(\d+)$/);
            if (m) switchToEpisode(m[1]);
        });
    }

    // ====== 初始化 ======
    function init() {
        const m = location.hash.match(/^#episode-(\d+)$/);
        if (m) {
            const epId = parseInt(m[1], 10);
            if (epId >= 1 && epId <= EPISODES_DATA.length) {
                state.currentEpisode = epId;
            }
        }

        applySettings();
        renderEpisodeList();
        renderCurrentEpisode();
        bindEvents();
        setupBackToTop();
        setupScrollMemory();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
