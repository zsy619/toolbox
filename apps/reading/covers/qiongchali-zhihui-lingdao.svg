<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="grad-1596" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="shine-1596" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow-1596" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景渐变 -->
  <rect width="800" height="1200" fill="url(#grad-1596)"/>

  <!-- 光泽效果 -->
  <rect width="800" height="1200" fill="url(#shine-1596)"/>

  <!-- 装饰圆圈 -->
  <circle cx="650" cy="100" r="180" fill="rgba(255,255,255,0.05)"/>
  <circle cx="100" cy="1100" r="220" fill="rgba(255,255,255,0.04)"/>
  <circle cx="700" cy="1050" r="80" fill="rgba(255,255,255,0.06)"/>

  <!-- 中央书脊效果 -->
  <line x1="60" y1="0" x2="60" y2="1200" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="64" y1="0" x2="64" y2="1200" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>

  <!-- 大图标 -->
  <text x="400" y="450" font-size="220" text-anchor="middle" filter="url(#shadow-1596)" opacity="0.9">💡</text>

  <!-- 装饰线 -->
  <line x1="200" y="600" x2="600" y2="600" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- 书名 -->
  <text x="400" y="750" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="56" font-weight="700" text-anchor="middle"
        fill="white" filter="url(#shadow-1596)" letter-spacing="2">
    <tspan x="400" dy="0">《穷查理的智慧领导版》</tspan>
    
  </text>

  <!-- 底部装饰 -->
  <circle cx="150" cy="200" r="120" fill="rgba(255,255,255,0.03)"/>
</svg>