<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- 背景渐变:深空蓝 → 科学青蓝 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- 网格纹理 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#g)"/>
  <rect width="400" height="600" fill="url(#grid)"/>
  <rect width="400" height="600" fill="url(#g2)"/>

  <!-- 装饰圆环:代表 Agent 集群 -->
  <circle cx="320" cy="120" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="320" cy="120" r="55" fill="rgba(255,255,255,0.10)"/>
  <circle cx="80"  cy="480" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="80"  cy="480" r="80"  fill="rgba(255,255,255,0.08)"/>

  <!-- 小亮点:代表"10 人小队 + Agent" -->
  <circle cx="120" cy="180" r="4"  fill="rgba(255,255,255,0.6)"/>
  <circle cx="200" cy="160" r="3"  fill="rgba(255,255,255,0.5)"/>
  <circle cx="280" cy="200" r="4"  fill="rgba(255,255,255,0.6)"/>
  <circle cx="160" cy="240" r="3"  fill="rgba(255,255,255,0.4)"/>
  <circle cx="240" cy="260" r="3"  fill="rgba(255,255,255,0.4)"/>

  <!-- 主标题 -->
  <text x="200" y="320" font-family="serif" font-size="38" font-weight="bold" fill="#fff" text-anchor="middle">吴恩达</text>
  <text x="200" y="370" font-family="sans-serif" font-size="18" fill="rgba(255,255,255,0.85)" text-anchor="middle">Agent 狂飙之后</text>

  <!-- 副标题分隔线 -->
  <line x1="100" y1="400" x2="300" y2="400" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- 标签 -->
  <text x="200" y="430" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.75)" text-anchor="middle">10 人小队 × 数据架构重构</text>
  <text x="200" y="455" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">AI · Agent · 未来公司</text>

  <!-- 底部 brand -->
  <text x="200" y="555" font-family="sans-serif" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="2">LangChain Interrupt · 2026</text>
</svg>
