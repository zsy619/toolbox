<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="grad-4937" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="shine-4937" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow-4937" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景渐变 -->
  <rect width="800" height="1200" fill="url(#grad-4937)"/>

  <!-- 光泽效果 -->
  <rect width="800" height="1200" fill="url(#shine-4937)"/>

  <!-- 装饰圆圈 -->
  <circle cx="650" cy="100" r="180" fill="rgba(255,255,255,0.05)"/>
  <circle cx="100" cy="1100" r="220" fill="rgba(255,255,255,0.04)"/>
  <circle cx="700" cy="1050" r="80" fill="rgba(255,255,255,0.06)"/>

  <!-- 中央书脊效果 -->
  <line x1="60" y1="0" x2="60" y2="1200" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="64" y1="0" x2="64" y2="1200" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>

  <!-- 顶部难度徽章 -->
  <rect x="540" y="40" width="220" height="56" rx="28" fill="#10B981" opacity="0.95"/>
  <text x="650" y="78" font-family="'Inter', 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="white" letter-spacing="1">BEGINNER</text>

  <!-- 大图标 -->
  <text x="400" y="450" font-size="220" text-anchor="middle" filter="url(#shadow-4937)" opacity="0.9">📚</text>

  <!-- 装饰线 -->
  <line x1="200" y1="600" x2="600" y2="600" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- 书名 -->
  <text x="400" y="750" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="46" font-weight="700" text-anchor="middle"
        fill="white" filter="url(#shadow-4937)" letter-spacing="2">
    <tspan x="400" dy="0">100个晚知道的真理</tspan>
  </text>

  <!-- 底部装饰 -->
  <circle cx="150" cy="200" r="120" fill="rgba(255,255,255,0.03)"/>

  <!-- 分类副标题 -->
  <text x="400" y="1000" font-family="'Inter', sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="rgba(255,255,255,0.5)" letter-spacing="6">ESSAY</text>
  <!-- 阅读时间 -->
  <rect x="280" y="1100" width="240" height="40" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="400" y="1127" font-family="'Inter', 'PingFang SC', sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="rgba(255,255,255,0.9)">⏱ 28分钟</text>
</svg>