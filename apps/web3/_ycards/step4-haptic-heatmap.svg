<text x="167" y="52" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">0 分</text><text x="277" y="52" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">2 分</text><text x="387" y="52" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">5 分</text><text x="62" y="52" text-anchor="middle" fill="#9aa3c4" font-size="11" font-weight="700">能力模型</text><line x1="12" y1="66" x2="466" y2="66" stroke="#1f2742" stroke-width="1"/><text x="104" y="88" text-anchor="end" fill="#e6e9f5" font-size="12" font-weight="600">并发手感</text><g><rect x="112" y="70" width="104" height="28" rx="4" fill="rgba(248, 113, 113, 0.25)" stroke="#1f2742" stroke-width="0.5"/><text x="164" y="87" text-anchor="middle" fill="#e6e9f5" font-size="10.5">没接触过</text></g><g><rect x="222" y="70" width="104" height="28" rx="4" fill="rgba(251, 191, 36, 0.20)" stroke="#1f2742" stroke-width="0.5"/><text x="274" y="87" text-anchor="middle" fill="#e6e9f5" font-size="10.5">能写简单 goroutine</text></g><g><rect x="332" y="70" width="104" height="28" rx="4" fill="rgba(52, 211, 153, 0.30)" stroke="#1f2742" stroke-width="0.5"/><text x="384" y="87" text-anchor="middle" fill="#e6e9f5" font-size="10.5">看到无界 channel 就知道会泄漏</text></g><text x="104" y="124" text-anchor="end" fill="#e6e9f5" font-size="12" font-weight="600">链上手感</text><g><rect x="112" y="106" width="104" height="28" rx="4" fill="rgba(248, 113, 113, 0.25)" stroke="#1f2742" stroke-width="0.5"/><text x="164" y="123" text-anchor="middle" fill="#e6e9f5" font-size="10.5">没读源码</text></g><g><rect x="222" y="106" width="104" height="28" rx="4" fill="rgba(251, 191, 36, 0.20)" stroke="#1f2742" stroke-width="0.5"/><text x="274" y="123" text-anchor="middle" fill="#e6e9f5" font-size="10.5">知道 RPC 概念</text></g><g><rect x="332" y="106" width="104" height="28" rx="4" fill="rgba(52, 211, 153, 0.30)" stroke="#1f2742" stroke-width="0.5"/><text x="384" y="123" text-anchor="middle" fill="#e6e9f5" font-size="10.5">第一反应是"这笔交易确认够了吗"</text></g><