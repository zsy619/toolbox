ext-anchor="middle" fill="#e6e9f5" font-size="10.5">知道对账表结构</text></g><g><rect x="332" y="214" width="104" height="28" rx="4" fill="rgba(52, 211, 153, 0.30)" stroke="#1f2742" stroke-width="0.5"/><text x="384" y="231" text-anchor="middle" fill="#e6e9f5" font-size="10.5">链上/库差异第一反应查确认数</text></g><text x="104" y="268" text-anchor="end" fill="#e6e9f5" font-size="12" font-weight="600">Gas 策略</text><g><rect x="112" y="250" width="104" height="28" rx="4" fill="rgba(248, 113, 113, 0.25)" stroke="#1f2742" stroke-width="0.5"/><text x="164" y="267" text-anchor="middle" fill="#e6e9f5" font-size="10.5">不懂 gas 字段</text></g><g><rect x="222" y="250" width="104" height="28" rx="4" fill="rgba(251, 191, 36, 0.20)" stroke="#1f2742" stroke-width="0.5"/><text x="274" y="267" text-anchor="middle" fill="#e6e9f5" font-size="10.5">能解释 base+priority</text></g><g><rect x="332" y="250" width="104" height="28" rx="4" fill="rgba(52, 211, 153, 0.30)" stroke="#1f2742" stroke-width="0.5"/><text x="384" y="267" text-anchor="middle" fill="#e6e9f5" font-size="10.5">看到曲线就预测对手出价</text></g><text x="104" y="304" text-anchor="end" fill="#e6e9f5" font-size="12" font-weight="600">事件订阅</text><g><rect x="112" y="286" width="104" height="28" rx="4" fill="rgba(248, 113, 113, 0.25)" stroke="#1f2742" stroke-width="0.5"/><text x="164" y="303" text-anchor="middle" fill="#e6e9f5" font-size="10.5">不会用 filter</text></g><g><rect x="222" y="286" width="104" height="28" rx="4" fill="rgba(251, 191, 36, 0.20)" stroke="#1f2742" stroke-width="0.5"/><text x="274" y="303" text-anchor="middle" fill="#e6e9f5" font-size="10.5">能跑通同步脚本</text></g><g><rect x="332" y="286" width="104" height="28" rx="4" fill="rgba(52, 211, 153, 0.30)" stroke="#1f2742" stroke-width="0.5"/><text x="384" y="303" text-anchor="middle" fill="#e6e9f5" font-size="10.5">出现 reorg 第一时间想到"区块 N 是否回退"</text></g><line x1="12" y1="66" x2="466" y2="66" stroke="#1f2742" stroke-width="0.3" opacity="0.5"/><line x1="12" y1="102" x2="466" y2="102" stroke="#1f2742" stroke-wi