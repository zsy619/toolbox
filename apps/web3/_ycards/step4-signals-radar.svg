<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" class="step4-svg" aria-label="4 类信号雷达图">
<style>
    .step4-svg { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .s4-radar-title { fill: #e6e9f5; font-size: 14px; font-weight: 700; }
    .s4-radar-sub { fill: #9aa3c4; font-size: 10px; }
    .s4-ideal { fill: rgba(52, 211, 153, 0.15); stroke: #34d399; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .s4-actual { fill: rgba(192, 132, 252, 0.25); stroke: #c084fc; stroke-width: 2; }
    .s4-actual-dot { fill: #c084fc; }
    .s4-legend { fill: #9aa3c4; font-size: 10px; }
    .s4-legend-strong { fill: #c084fc; font-size: 10px; font-weight: 700; }
</style>

<text x="240" y="24" text-anchor="middle" class="s4-radar-title">4 类信号雷达图 · 理想 vs 实际</text>
<text x="240" y="40" text-anchor="middle" class="s4-radar-sub">紫色=本周实际 · 绿色虚线=理想线（每类 ≥3）</text>

<polygon points="200.0,174.0 226.0,200.0 200.0,226.0 174.0,200.0" fill="none" stroke="#1f2742" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/><polygon points="200.0,148.0 252.0,200.0 200.0,252.0 148.0,200.0" fill="none" stroke="#1f2742" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/><polygon points="200.0,122.0 278.0,200.0 200.0,278.0 122.0,200.0" fill="none" stroke="#1f2742" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/><polygon points="200.0,96.0 304.0,200.0 200.0,304.0 96.0,200.0" fill="none" stroke="#1f2742" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/><polygon points="200.0,70.0 330.0,200.0 200.0,330.0 70.0,200.0" fill="none" stroke="#1f2742" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
<line x1="200" y1="200" x2="200.0" y2="70.0" stroke="#1f2742" stroke-width="1" opacity="0.4"/><line x1="200" y1="200" x2="330.0" y2="200.0" stroke="#1f2742" stroke-width="1" opacity="0.4"/><line x1="200" y1="200" x2="200.0" y2="330.0" stroke="#1f2742" stroke-width="1" opacity="0.4"/><line x1="200" y1="200" x2="70.0" y2="200.0" stroke="#1f2742" stroke-width="1" opacity="0.4"/>

<polygon class="s4-ideal" points="200.0,122.0 278.0,200.0 200.0,278.0 122.0,200.0"/>
<text x="170" y="240" class="s4-legend">· 理想线 (3/5)</text>

<!-- 实际示例分（4/3/3/2）：画出示例多边形 -->
<polygon class="s4-actual" points="237,86 282,180 222,275 122,180"/>
<circle class="s4-actual-dot" cx="237" cy="86" r="4"/>
<circle class="s4-actual-dot" cx="282" cy="180" r="4"/>
<circle class="s4-actual-dot" cx="222" cy="275" r="4"/>
<circle class="s4-actual-dot" cx="122" cy="180" r="4"/>

<text x="50" y="420" class="s4-legend-strong">示例: A=4, B=3, C=3, D=2</text>
<text x="50" y="436" class="s4-legend">4 类未全 ≥3 → 触发"信号盲区"诊断</text>
<text x="50" y="452" class="s4-legend">建议: 下周专攻 D 类（提炼建模）</text>

<g><circle cx="200.0" cy="50.0" r="4" fill="#c084fc"/><text x="200.0" y="46.0" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">A</text><text x="200.0" y="60.0" text-anchor="middle" fill="#9aa3c4" font-size="9">把感觉变成数字</text></g><g><circle cx="350.0" cy="200.0" r="4" fill="#22d3ee"/><text x="358.0" y="204.0" text-anchor="start" fill="#22d3ee" font-size="12" font-weight="700">B</text><text x="358.0" y="218.0" text-anchor="start" fill="#9aa3c4" font-size="9">借外行的高招</text></g><g><circle cx="200.0" cy="350.0" r="4" fill="#fbbf24"/><text x="200.0" y="362.0" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">C</text><text x="200.0" y="376.0" text-anchor="middle" fill="#9aa3c4" font-size="9">先立假设再验证</text></g><g><circle cx="50.0" cy="200.0" r="4" fill="#34d399"/><text x="42.0" y="204.0" text-anchor="end" fill="#34d399" font-size="12" font-weight="700">D</text><text x="42.0" y="218.0" text-anchor="end" fill="#9aa3c4" font-size="9">从经验到抽象</text></g>
<text x="204" y="177.0" fill="#9aa3c4" font-size="9" text-anchor="start">1</text><text x="204" y="151.0" fill="#9aa3c4" font-size="9" text-anchor="start">2</text><text x="204" y="125.0" fill="#9aa3c4" font-size="9" text-anchor="start">3</text><text x="204" y="99.0" fill="#9aa3c4" font-size="9" text-anchor="start">4</text><text x="204" y="73.0" fill="#9aa3c4" font-size="9" text-anchor="start">5</text>
</svg>