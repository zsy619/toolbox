<text x="376" y="20" text-anchor="middle" class="s4-diag-title">6 种组合诊断模式 · 阈值触发条件</text>
<text x="376" y="34" text-anchor="middle" class="s4-diag-sub">绿=触发该模式 · 灰=不触发 · 字母表示该信号是否 ≥3</text>

