" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="337" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">B</text><rect x="364" y="46" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="385" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">C</text><rect x="412" y="46" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="433" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">D</text></g><text x="268" y="150" fill="#9aa3c4" font-size="9" font-style="italic">A B C D = 阈值触发 (≥3 / ≤1)</text></g><g><rect x="504" y="38" width="240" height="130" rx="8" fill="rgba(17, 23, 44, 0.5)" stroke="#fbbf24" stroke-width="1.5"/><text x="516" y="60" fill="#fbbf24" font-size="13" font-weight="700">🟡 C 高 D 低</text><text x="516" y="80" fill="#9aa3c4" font-size="10">诊断: 有推翻但抽象不出来</text><text x="516" y="98" fill="#e6e9f5" font-size="10">建议: 把推翻的假设画成 1 张图（决策树 / 反例对照）</text><g transform="translate(0, 70)"><rect x="516" y="46" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="537" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">A</text><rect x="564" y="46" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="585" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">B</text><rect x="612" y="46" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="633" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">C</text><rect x="660" y="46" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="681" y="60" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">D</text></g><text x="516" y="150" fill="#9aa3c4" font-size="9" font-style="italic">A B C D = 阈值触发 (≥3 / ≤1)</text></g><g><rect x="8" y="176" width="240" height="130" rx="8" fill="rgba(17, 23, 44, 0.5)" stroke="#fbbf24" stroke-width="1.5"/><text x="20" y="198" fill="#fbbf24" font-size="13" font-weight="700">🟡 D 高 C 低</text><text x="20" y="218" fill="#9aa3c4" font-size="10">诊断: 有抽象但未验证</text><text x="20" y="236" fill="#e6e9f5" font-size="10">建议: 取本周一个抽象，去做对照实验验证</text><g transform="translate(0, 70)"><rect x="20" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="41" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">A</text><rect x="68" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="89" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">B</text><rect x="116" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="137" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">C</text><rect x="164" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#fbbf24" stroke-width="1"/><text x="185" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">D</text></g><text x="20" y="288" fill="#9aa3c4" font-size="9" font-style="italic">A B C D = 阈值触发 (≥3 / ≤1)</text></g><g><rect x="256" y="176" width="240" height="130" rx="8" fill="rgba(17, 23, 44, 0.5)" stroke="#f87171" stroke-width="1.5"/><text x="268" y="198" fill="#f87171" font-size="13" font-weight="700">🔴 任 ≤1</text><text x="268" y="218" fill="#9aa3c4" font-size="10">诊断: 信号盲区</text><text x="268" y="236" fill="#e6e9f5" font-size="10">建议: 下周专攻这一类 · 写进 commit "下周只补一类"</text><g transform="translate(0, 70)"><rect x="268" y="184" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="289" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">A</text><rect x="316" y="184" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="337" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">B</text><rect x="364" y="184" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="385" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">C</text><rect x="412" y="184" width="42" height="20" rx="3" fill="rgba(154,163,196,0.1)" stroke="#1f2742" stroke-width="1"/><text x="433" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">D</text></g><text x="268" y="288" fill="#9aa3c4" font-size="9" font-style="italic">A B C D = 阈值触发 (≥3 / ≤1)</text></g><g><rect x="504" y="176" width="240" height="130" rx="8" fill="rgba(17, 23, 44, 0.5)" stroke="#22d3ee" stroke-width="1.5"/><text x="516" y="198" fill="#22d3ee" font-size="13" font-weight="700">🔵 全 ≤2 持平</text><text x="516" y="218" fill="#9aa3c4" font-size="10">诊断: 方向可能错</text><text x="516" y="236" fill="#e6e9f5" font-size="10">建议: 回到 STEP 01 范围声明 / STEP 02 指标 / STEP 03 框架</text><g transform="translate(0, 70)"><rect x="516" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#22d3ee" stroke-width="1"/><text x="537" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">A</text><rect x="564" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#22d3ee" stroke-width="1"/><text x="585" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">B</text><rect x="612" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#22d3ee" stroke-width="1"/><text x="633" y="198" text-anchor="middle" fill="#e6e9f5" font-size="11" font-weight="700">C</text><rect x="660" y="184" width="42" height="20" rx="3" fill="rgba(52,211,153,0.3)" stroke="#22d3ee" stroke-width="1"/><text x="681" y="198" text-anchor="middle" fill="#e6e9f5" font