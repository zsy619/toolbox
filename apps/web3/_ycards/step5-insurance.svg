<text x="57" y="34" text-anchor="middle" fill="#9aa3c4" font-size="11" font-weight="700">配套</text><text x="142" y="34" text-anchor="middle" fill="#9aa3c4" font-size="11" font-weight="700">断多久</text><text x="212" y="34" text-anchor="middle" fill="#9aa3c4" font-size="11" font-weight="700">影响</text><text x="382" y="34" text-anchor="middle" fill="#9aa3c4" font-size="11" font-weight="700">故障案例</text><text x="622" y="34" text-anchor="middle" fill="#9aa3c4" font-size="11" font-weight="700">怎么修</text><rect x="12" y="44" width="710" height="50" rx="6" fill="rgba(17,23,44,0.5)" stroke="#1f2742" stroke-width="0.5"/><text x="57" y="62" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700">📚 KB</text><text x="57" y="78" text-anchor="middle" fill="#9aa3c4" font-size="9">知识库</text><text x="142" y="74" text-anchor="middle" fill="#e6e9f5" font-size="12" font-weight="700">2 周</text><text x="212" y="74" text-anchor="middle" fill="#e6e9f5" font-size="20">🟡</text><text x="250" y="66" fill="#e6e9f5" font-size="11">找不到 3 周前某个 ADR</text><text x="530" y="66" fill="#34d399" font-size="11">git log 里有但 docs/ 没有 → 重新建索引</text><rect x="12" y="98" width="710" height="50" rx="6" fill="rgba(17,23,44,0.5)" stroke="#1f2742" stroke-width="0.5"/><text x="57" y="116" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">🎙 REC</text><text x="57" y="132" text-anchor="middle" fill="#9aa3c4" font-size="9">记录设备</text><text x="142" y="128" text-anchor="middle" fill="#e6e9f5" font-size="12" font-weight="700">1 周</text><text x="212" y="128" text-anchor="middle" fill="#e6e9f5" font-size="20">🟠</text><text x="250" y="120" fill="#e6e9f5" font-size="11">"上周我干了啥"想不起来</text><text x="530" y="120" fill="#34d399" font-size="11">听录音 → 还原 80% 内容</text><rect x="12" y="152" width="710" height="50" rx="6" fill="rgba(17,23,44,0.5)" stroke="#1f2742" stroke-width="0.5"/><text x="57" y="170" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">🔁 RT</text><text x="57" y="186" text-anchor="middle" fill="#9aa3c4" font-size="9">复盘会</text><text x="142" y="182" text-anchor="middle" fill="#e6e9f5" font-size="12" font-weight="700">2 周</text><text x="212" y="182" text-anchor="middle" fill="#e6e9f5" font-size="20">🔴</text><text x="250" y="174" fill="#e6e9f5" font-size="11">错误重复犯 2 次才发现</text><text x="530" y="174" fill="#34d399" font-size="11">复盘 → 提炼成下次检查项</text><rect x="12" y="206" width="710" height="50" rx="6" fill="rgba(17,23,44,0.5)" stroke="#1f2742" stroke-width="0.5"/><text x="57" y="224" text-anchor="middle" fill="#f472b6" font-size="14" font-weight="700">🎙 INT</text><text x="57" y="240" text-anchor="middle" fill="#9aa3c4" font-size="9">专家访谈</text><text x="142" y="236" text-anchor="middle" fill="#e6e9f5" font-size="12" font-weight="700">4 周</text><text x="212" y="236" text-anchor="middle" fill="#e6e9f5" font-size="20">🟠</text><text x="250" y="228" fill="#e6e9f5" font-size="11">闭门造车 1 个月</text><text x="530" y="228" fill="#34d399" font-size="11">约 1 位专家 → 1 小时救回 1 周</text><rect x="12" y="260" width="710" height="50" rx="6" fill="rgba(17,23,44,0.5)" stroke="#1f2742" stroke-width="0.5"/><text x="57" y="278" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">📑 DOC</text><text x="57" y="294" text-anchor="middle" fill="#9aa3c4" font-size="9">论文与资源</text><text x="142" y="290" text-anchor="middle" fill="#e6e9f5" font-size="12" font-weight="700">3 周</text><text x="212" y="290" text-anchor="middle" fill="#e6e9f5" font-size="20">🟡</text><text x="250" y="282" fill="#e6e9f5" font-size="11">面试被问 EIP-4337 哑口</text><text x="530" y="282" fill="#34d399" font-size="11">重读 EIP → 写 1 段话讲清</text><rect x="12" y="330" width="710" height="24" rx="6" fill="rgba(192,132,252,0.08)" stroke="#c084fc" stroke-width="0.5"/><text x="20" y="346" fill="#c084fc" font-size="11" font-weight="700">📌 一句话保险：</text><text x="112" y="346" fill="#e6e9f5" font-size="10.5">断 2 周=🟡 还能修 / 断 3 周=🟠 需要求助 / 断 4 周=🔴 计划崩 · 上表 = 真实代价</text>
